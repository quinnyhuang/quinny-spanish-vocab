    { es: "tabaco", en: "tobacco", gender: "m", pos: "n.", zh: "菸草", ex: "Dejar el tabaco fue lo más difícil que ha hecho en su vida.", exZh: "戒菸是他這輩子做過最困難的事。" },
    { es: "nicotina", en: "nicotine", gender: "f", pos: "n.", zh: "尼古丁", ex: "Los parches de nicotina le ayudaron a controlar el síndrome de abstinencia.", exZh: "尼古丁貼片幫助他控制了戒斷症狀。" },
    { es: "estupefaciente", gender: "m", plural: "estupefacientes", pos: "n.", zh: "麻醉藥品；毒品", note: "亦可作形容詞使用(如 sustancia estupefaciente),此處取常見的名詞用法。", ex: "La ley castiga con dureza el tráfico de estupefacientes.", exZh: "法律對毒品販運行為嚴厲懲處。" },
    { es: "adicto", en: "addicted", pos: "adj.", zh: "上癮的；成癮的", note: "也常作名詞使用,意為「上癮者」(un adicto / una adicta)。", ex: "Es adicto a los videojuegos y apenas sale de casa.", exZh: "他對電玩上癮,幾乎不出門。" },
    { es: "drogadicción", gender: "f", pos: "n.", zh: "藥物成癮；毒癮", ex: "La drogadicción destruyó su relación con la familia.", exZh: "毒癮摧毀了他與家人的關係。" },
    { es: "toxicomanía", gender: "f", pos: "n.", zh: "藥物依賴；毒癮", ex: "La toxicomanía es un problema que afecta tanto al cuerpo como a la mente.", exZh: "藥物依賴是一個同時影響身心的問題。" },
    { es: "alcoholismo", en: "alcoholism", gender: "m", pos: "n.", zh: "酒精中毒；酗酒", ex: "Su alcoholismo le costó el matrimonio y el trabajo.", exZh: "他的酗酒問題讓他失去了婚姻和工作。" },
    { es: "tabaquismo", gender: "m", pos: "n.", zh: "菸癮；吸菸成癮", ex: "El tabaquismo es la principal causa evitable de enfermedades pulmonares.", exZh: "菸癮是可預防的肺部疾病中最主要的成因。" },
    { es: "ludopatía", gender: "f", pos: "n.", zh: "賭博成癮症", ex: "La ludopatía lo llevó a endeudarse con varios casinos en línea.", exZh: "賭博成癮讓他在多個線上賭場欠下債務。" },
    { es: "sobredosis", gender: "f", plural: "sobredosis", pos: "n.", zh: "藥物過量；吸毒過量", note: "單複數同形(la sobredosis / las sobredosis)。", ex: "Ingresó de urgencia por una sobredosis de tranquilizantes.", exZh: "他因鎮靜劑服用過量而緊急送醫。" },
    { es: "abstinencia", en: "abstinence", gender: "f", pos: "n.", zh: "戒斷；禁戒", ex: "Los primeros días del síndrome de abstinencia fueron los más duros.", exZh: "戒斷症狀的頭幾天是最難熬的。" },
    { es: "recaída", gender: "f", plural: "recaídas", pos: "n.", zh: "復發；故態復萌", ex: "Tras seis meses limpio, sufrió una recaída que lo devolvió al hospital.", exZh: "在戒毒六個月後,他又復發,再度住進醫院。" },
    { es: "rehabilitación", en: "rehabilitation", gender: "f", pos: "n.", zh: "復健；戒治", ex: "Ingresó en un centro de rehabilitación para superar su adicción al alcohol.", exZh: "他進入一間戒治中心,努力戰勝酒癮。" },
    { es: "desintoxicación", gender: "f", pos: "n.", zh: "排毒；戒毒治療", ex: "El proceso de desintoxicación duró tres semanas bajo supervisión médica.", exZh: "這個排毒過程在醫療監督下持續了三週。" },
    { es: "grupo de apoyo", gender: "m", plural: "grupos de apoyo", pos: "n.", zh: "互助團體；支持團體", note: "es_raw 原文結尾多出一個雜訊「de」,已修正為「grupo de apoyo」。", ex: "Empezó a asistir a un grupo de apoyo para personas con ansiedad.", exZh: "他開始參加一個為焦慮症患者設立的互助團體。" },
    { es: "Alcohólicos Anónimos", gender: "m", pos: "n.", zh: "匿名戒酒會", note: "專有名稱,固定以複數形式使用,字首大寫。", ex: "Lleva tres años yendo a las reuniones de Alcohólicos Anónimos.", exZh: "他參加匿名戒酒會的聚會已經三年了。" },
    { es: "abusar", en: "to abuse", pos: "v.", zh: "濫用；虐待", note: "常搭配介系詞 de(abusar de algo/alguien)。", ex: "No se debe abusar de los medicamentos para dormir.", exZh: "不應該濫用安眠藥。" },
    { es: "enganchar", pos: "v.", zh: "使上癮；勾住", note: "反身動詞 engancharse 常用來表示「上癮」。", ex: "Se enganchó a las apuestas online sin darse cuenta.", exZh: "他在不知不覺中對線上賭博上了癮。" },
    { es: "alucinar", en: "to hallucinate", pos: "v.", zh: "產生幻覺；（口語）大吃一驚", note: "口語中也常用來表示「感到驚訝、難以置信」。", ex: "Empezó a alucinar después de tomar aquella sustancia desconocida.", exZh: "服用那種不明物質後,他開始產生幻覺。" },
    { es: "profeta", en: "prophet", gender: "m", plural: "profetas", pos: "n.", zh: "先知", note: "陰性形式為「profetisa」,但口語中也常直接說「la profeta」指女性先知。", ex: "El profeta advirtió al pueblo sobre las consecuencias de ignorar sus enseñanzas.", exZh: "這位先知警告人民,若忽視他的教誨將會有嚴重後果。" },
    { es: "Jesucristo", en: "Jesus Christ", gender: "m", pos: "n.", zh: "耶穌基督", note: "專有名詞,慣例大寫,無複數形式。", ex: "Para los cristianos, Jesucristo es el hijo de Dios y el salvador de la humanidad.", exZh: "對基督徒而言,耶穌基督是上帝之子,也是全人類的救主。" },
    { es: "cardenal", en: "cardinal", gender: "m", plural: "cardenales", pos: "n.", zh: "樞機主教", note: "此天主教職位僅限男性擔任,故無陰性形式;「cardenal」在口語中也可指身上的「瘀傷」。", ex: "El Papa nombró a tres nuevos cardenales durante la ceremonia celebrada en el Vaticano.", exZh: "教宗在梵蒂岡舉行的儀式上任命了三位新的樞機主教。" },
    { es: "pastor", en: "pastor", gender: "m", plural: "pastores", pos: "n.", zh: "牧師", note: "陰性「pastora」較常指「女牧羊人」,新教女牧師雖也可用此詞,但語境需明確。", ex: "El pastor de la iglesia evangélica visita a los enfermos del hospital todas las semanas.", exZh: "這位福音教會的牧師每週都會去醫院探望病人。" },
    { es: "apóstol", en: "apostle", gender: "m", plural: "apóstoles", pos: "n.", zh: "使徒", note: "傳統上指耶穌的十二使徒,現代也常比喻「某理念的積極倡導者」。", ex: "San Pablo no fue uno de los doce apóstoles originales, pero se convirtió en una figura clave del cristianismo.", exZh: "聖保羅並不是最初十二位使徒之一,但他後來成為基督教發展的關鍵人物。" },
    { es: "monje", gender: "m", plural: "monjes", pos: "n.", zh: "修士、僧侶", note: "陰性形式為「monja」(修女),為另一獨立詞條。", ex: "Los monjes del monasterio se levantan antes del amanecer para rezar.", exZh: "修道院裡的修士們在天亮前就起床祈禱。" },
    { es: "monja", gender: "f", plural: "monjas", pos: "n.", zh: "修女", ex: "Mi tía decidió hacerse monja poco después de terminar la universidad.", exZh: "我阿姨大學畢業後不久就決定去當修女。" },
    { es: "imán", en: "imam", gender: "m", plural: "imanes", pos: "n.", zh: "伊瑪目(伊斯蘭教教長)", note: "同形字「imán」在日常西語中更常見的意思是「磁鐵」,兩者為同形異義詞,需依上下文判斷。", ex: "El imán dirigió la oración del viernes en la mezquita del barrio.", exZh: "這位伊瑪目在社區的清真寺主持了週五的禮拜。" },
    { es: "rabino", en: "rabbi", gender: "m", plural: "rabinos", pos: "n.", zh: "拉比(猶太教教士)", note: "陰性形式「rabina」用於指女性拉比。", ex: "El rabino explicó el significado de la festividad antes de comenzar la cena.", exZh: "這位拉比在晚餐開始前解釋了這個節日的意義。" },
    { es: "chamán", en: "shaman", gender: "m", plural: "chamanes", pos: "n.", zh: "薩滿、巫醫", note: "陰性形式「chamana」指女性薩滿。", ex: "En algunas culturas indígenas, el chamán es quien cura las enfermedades con plantas y rituales.", exZh: "在某些原住民文化中,薩滿是用草藥與儀式來治病的人。" },
    { es: "ídolo", en: "idol", gender: "m", plural: "ídolos", pos: "n.", zh: "偶像", note: "可指宗教崇拜的偶像,也可比喻流行文化中的「偶像明星」。", ex: "Los antiguos pueblos paganos adoraban ídolos de piedra y madera.", exZh: "古代的異教民族崇拜石頭與木頭雕成的偶像。" },
    { es: "fiel", gender: "m", plural: "fieles", pos: "n.", zh: "信徒、信眾", note: "作名詞時陰陽性依所指對象而定(el fiel / la fiel),此處預設陽性;複數「los fieles」常泛指全體信眾。原始詞性也可作形容詞,意為「忠誠的、虔誠的」。", ex: "Cientos de fieles se reunieron en la catedral para la misa de Navidad.", exZh: "數百名信徒聚集在大教堂參加聖誕彌撒。" },
    { es: "pecador", gender: "m", plural: "pecadores", pos: "n.", zh: "罪人", note: "陰性形式為「pecadora」。", ex: "El sacerdote recordó a los presentes que todos somos pecadores necesitados de perdón.", exZh: "神父提醒在場的人,我們都是需要被寬恕的罪人。" },
    { es: "confesión", en: "confession", gender: "f", plural: "confesiones", pos: "n.", zh: "告解、懺悔;供詞、自白", note: "除宗教上的告解外,也常用於一般語境的「坦白、自白」,例如法律上的供詞。", ex: "El niño fue a su primera confesión antes de hacer la comunión.", exZh: "這個男孩在領聖體前第一次去辦告解。" },
    { es: "misa", en: "Mass", gender: "f", plural: "misas", pos: "n.", zh: "彌撒", ex: "Mis abuelos van a misa todos los domingos por la mañana.", exZh: "我祖父母每個星期天早上都會去望彌撒。" },
    { es: "salmo", en: "psalm", gender: "m", plural: "salmos", pos: "n.", zh: "詩篇(聖經)", ex: "El sacerdote leyó un salmo antes de comenzar el sermón.", exZh: "神父在開始講道前朗讀了一篇詩篇。" },
    { es: "gospel", en: "gospel", gender: "m", pos: "n.", zh: "福音音樂", note: "指源自美國黑人教會的音樂類型「福音音樂」,為英語外來詞,單複數同形,通常不加s。若要表達「福音書」(聖經內容)則須用「evangelio」,兩者不可混淆。", ex: "El coro interpretó varias canciones de gospel durante el servicio dominical.", exZh: "唱詩班在週日禮拜中演唱了幾首福音音樂。" },
    { es: "oración", gender: "f", plural: "oraciones", pos: "n.", zh: "禱告、祈禱文", note: "文法上也指「句子」;與外形相似的英文「oration(正式演講)」意義並不相同,屬於假朋友,不宜視為同源詞對應。", ex: "Antes de dormir, la abuela siempre dice una oración por su familia.", exZh: "祖母睡前總是會為家人念一段禱告文。" },
    { es: "infierno", gender: "m", plural: "infiernos", pos: "n.", zh: "地獄", note: "與英文「inferno(猛烈大火)」同源,但兩者意義已分化——英文的inferno多指大火而非宗教地獄,故不列為同源詞。", ex: "En muchas religiones se cree que las malas acciones llevan al infierno.", exZh: "在許多宗教中,人們相信惡行會使人下地獄。" },
    { es: "cruz", gender: "f", plural: "cruces", pos: "n.", zh: "十字架", note: "複數為不規則變化「cruces」(z 變 c)。", ex: "Llevaba una pequeña cruz de plata colgada del cuello.", exZh: "她脖子上掛著一個小小的銀十字架。" },
    { es: "misticismo", en: "mysticism", gender: "m", pos: "n.", zh: "神秘主義", ex: "El misticismo medieval influyó profundamente en la poesía religiosa de la época.", exZh: "中世紀的神秘主義深深影響了當時的宗教詩歌。" },
    { es: "veneración", en: "veneration", gender: "f", pos: "n.", zh: "崇敬、敬仰", ex: "Los fieles tratan las reliquias del santo con gran veneración.", exZh: "信徒們懷著極大的敬意對待這位聖人的遺物。" },
    { es: "piadoso", pos: "adj.", zh: "虔誠的、虔敬的", note: "也可引申指「仁慈的、出於憐憫的」,例如「una mentira piadosa」(善意的謊言)。", ex: "Su abuela era una mujer muy piadosa que rezaba el rosario cada noche.", exZh: "她祖母是個非常虔誠的女性,每天晚上都會念玫瑰經。" },
    { es: "santo", en: "saintly", pos: "adj.", zh: "神聖的、聖潔的", note: "置於人名前縮寫為「San」(如San Pedro,但Tomás、Domingo等例外);陰性為「santa」;也常直接作名詞使用,指「聖人」。", ex: "Dicen que fue un hombre santo que dedicó toda su vida a ayudar a los pobres.", exZh: "據說他是個聖潔的人,一生都致力於幫助窮人。" },
    { es: "pagano", en: "pagan", pos: "adj.", zh: "異教的、異教徒的", note: "也常作名詞使用,指「異教徒」;陰性為「pagana」。", ex: "Muchas tradiciones cristianas tienen raíces en antiguos rituales paganos.", exZh: "許多基督教傳統其實源自古老的異教儀式。" },
    { es: "concejo", gender: "m", plural: "concejos", pos: "n.", zh: "(市)議會、鄉鎮委員會", note: "容易與同音字「consejo」(建議;顧問委員會)混淆——兩字發音相同但拼法與意義不同,「concejo」專指地方行政機關(市議會)。", ex: "El concejo municipal aprobó el nuevo presupuesto para las obras públicas.", exZh: "市議會通過了公共工程的新預算案。" },
    { es: "consejero", en: "counselor", gender: "m", plural: "consejeros", pos: "n.", zh: "顧問、參事", note: "陰性為「consejera」;在西班牙某些自治區,「consejero」也指地方政府的「廳長、局長」。", ex: "El presidente nombró a un nuevo consejero de seguridad nacional.", exZh: "總統任命了一位新的國家安全顧問。" },
    { es: "gabinete", en: "cabinet", gender: "m", plural: "gabinetes", pos: "n.", zh: "內閣;小型辦公室、診療室", note: "除「內閣」之意外,也常指小房間,如「gabinete médico」(診療室)、「gabinete de abogados」(律師事務所)。", ex: "El primer ministro reunió a todo su gabinete para discutir la crisis económica.", exZh: "總理召集了整個內閣來討論這場經濟危機。" },
    { es: "canciller", en: "chancellor", gender: "m", plural: "cancilleres", pos: "n.", zh: "總理;外交部長", note: "通性名詞,陽性陰性同形(el canciller / la canciller),此處預設陽性;在德國、奧地利指「總理」,在拉丁美洲多國則指「外交部長」。", ex: "La canciller alemana se reunió con varios jefes de Estado en la cumbre.", exZh: "這位德國總理在峰會上與多位國家元首會面。" },
    { es: "primer ministro", en: "prime minister", gender: "m", plural: "primeros ministros", pos: "n.", zh: "首相、總理", note: "中心詞為「ministro」,故整體為陽性;陰性形式為「primera ministra」。", ex: "El primer ministro anunció una reforma fiscal para el próximo año.", exZh: "首相宣布了明年將實施的稅制改革。" },
    { es: "disputado", en: "disputed", pos: "adj.", zh: "有爭議的、競爭激烈的", note: "為動詞「disputar」的過去分詞轉為形容詞,常見於「una elección muy disputada」(競爭極為激烈的選舉)。", ex: "El resultado de las elecciones fue tan disputado que se tuvo que hacer un recuento.", exZh: "選舉結果爭議太大,以至於必須重新計票。" },
    { es: "senador", en: "senator", gender: "m", plural: "senadores", pos: "n.", zh: "參議員", note: "陰性為「senadora」。", ex: "La senadora presentó un proyecto de ley para proteger el medio ambiente.", exZh: "這位參議員提出了一項保護環境的法案。" },
    { es: "político", en: "politician", gender: "m", plural: "políticos", pos: "n.", zh: "政治人物、政客", note: "陰性為「política」,但「la política」同時也指「政治」這個抽象概念,須依上下文判斷;作形容詞時「político」則指「政治的」。", ex: "Muchos ciudadanos ya no confían en los políticos tradicionales.", exZh: "許多民眾已經不再信任傳統的政治人物。" },
    { es: "junta", en: "junta", gender: "f", plural: "juntas", pos: "n.", zh: "委員會、董事會;(政變後的)軍事執政團", note: "亦可指政變後成立的「军事执政团」(junta militar);英文「junta」一詞正是借自西語。", ex: "La junta directiva se reunirá mañana para votar sobre la fusión de las empresas.", exZh: "董事會明天將開會表決兩家公司的合併案。" },
    { es: "autoritario", en: "authoritarian", pos: "adj.", zh: "威權的、獨裁作風的", note: "也常用於形容個人性格「專制的、強勢的」,不限於政治體制。", ex: "Su padre siempre fue muy autoritario y nunca le dejaba tomar sus propias decisiones.", exZh: "他父親一向非常專制,從不讓他自己做決定。" },
    { es: "comunista", en: "communist", gender: "m", plural: "comunistas", pos: "n.", zh: "共產主義者", note: "通性名詞,陽性陰性同形(el comunista / la comunista),此處預設陽性;亦可作形容詞使用。", ex: "Durante la Guerra Fría, muchos comunistas fueron perseguidos en varios países.", exZh: "冷戰期間,許多共產主義者在多個國家遭到迫害。" },
    { es: "fascista", en: "fascist", gender: "m", plural: "fascistas", pos: "n.", zh: "法西斯主義者", note: "通性名詞,陽性陰性同形(el fascista / la fascista),此處預設陽性;亦可作形容詞使用。", ex: "El historiador analizó cómo el régimen fascista controlaba los medios de comunicación.", exZh: "這位歷史學家分析了法西斯政權如何控制媒體。" },
    { es: "republicano", en: "republican", gender: "m", plural: "republicanos", pos: "n.", zh: "共和主義者;(美國)共和黨人", note: "陰性為「republicana」;在美國語境中特指「共和黨」黨員。", ex: "Durante la Guerra Civil española, muchos republicanos tuvieron que exiliarse.", exZh: "西班牙內戰期間,許多共和派人士被迫流亡海外。" },
    { es: "democrático", en: "democratic", pos: "adj.", zh: "民主的", ex: "El país celebró sus primeras elecciones democráticas después de décadas de dictadura.", exZh: "這個國家在數十年獨裁統治後,舉行了第一次民主選舉。" },
    { es: "conservador", en: "conservative", gender: "m", plural: "conservadores", pos: "n.", zh: "保守派人士", note: "陰性為「conservadora」;作形容詞時也指「保守的」。", ex: "El nuevo alcalde es un conservador convencido que se opone a cualquier reforma social.", exZh: "這位新市長是個堅定的保守派,反對任何社會改革。" },
    { es: "liberal", pos: "adj.", zh: "自由主義的;開放包容的", note: "也常直接作名詞使用,指「自由主義者」;日常用語中也可形容人「思想開放、不拘泥傳統」。", ex: "Sus padres tienen una educación bastante liberal y le permiten tomar sus propias decisiones.", exZh: "他父母的教育方式相當開明,讓他自己做決定。" },
    { es: "internacional", en: "international", pos: "adj.", zh: "國際的", ex: "La empresa firmó un acuerdo internacional para exportar sus productos a Asia.", exZh: "這家公司簽署了一項國際協議,要將產品外銷到亞洲。" },
    { es: "abdicar", en: "abdicate", pos: "v.", zh: "退位、放棄(權力)", note: "常接介系詞「a」,如「abdicar al trono」(退位讓出王位)。", ex: "El rey decidió abdicar en favor de su hijo tras cuarenta años en el trono.", exZh: "國王在位四十年後,決定退位讓位給他的兒子。" },
    { es: "lobby", en: "lobby", gender: "m", plural: "lobbies", pos: "n.", zh: "遊說團體", note: "為英語外來詞。西班牙皇家語言學院建議寫作「lobi」(複數lobis),但日常使用仍以「lobby」較普遍。", ex: "El lobby farmacéutico presiona constantemente al gobierno para influir en las nuevas leyes.", exZh: "製藥業的遊說團體不斷向政府施壓,企圖影響新法案的走向。" },
    { es: "forense", en: "forensic", pos: "adj.", zh: "法醫的；鑑識的", ex: "El equipo forense analizó las huellas dactilares encontradas en la escena del crimen.", exZh: "鑑識小組分析了在犯罪現場發現的指紋。" },
    { es: "objeción", en: "objection", gender: "f", plural: "objeciones", pos: "n.", zh: "異議；反對", ex: "El abogado defensor presentó una objeción antes de que el testigo respondiera.", exZh: "辯護律師在證人回答之前提出了異議。" },
    { es: "demostración", en: "demonstration", gender: "f", plural: "demostraciones", pos: "n.", zh: "證明；舉證", note: "在法律脈絡中常指用證據「證明」某事，而非街頭示威（那是 manifestación）。", ex: "La demostración de su inocencia se basó en pruebas de ADN concluyentes.", exZh: "他清白的證明是基於確鑿的 DNA 證據。" },
    { es: "denunciar", pos: "v.", zh: "舉報；控告", note: "常用於「向警方報案／檢舉某人某事」，與英文 denounce（公開譴責）語意不完全對等，不宜視為同源詞。", ex: "Decidió denunciar el acoso laboral ante el departamento de recursos humanos.", exZh: "她決定向人資部門舉報職場騷擾行為。" },
    { es: "anular", en: "annul", pos: "v.", zh: "廢除；使無效；撤銷", ex: "El tribunal anuló la sentencia por un error de procedimiento.", exZh: "法院因程序錯誤而撤銷了該判決。" },
    { es: "inculpar", en: "inculpate", pos: "v.", zh: "指控；歸罪於", ex: "Los nuevos documentos podrían inculpar al exdirector financiero en el fraude.", exZh: "新文件可能將前財務總監牽連進這起詐騙案中。" },
    { es: "fianza", gender: "f", plural: "fianzas", pos: "n.", zh: "保釋金；擔保金", ex: "El juez fijó la fianza en diez mil euros para que el acusado pudiera salir en libertad.", exZh: "法官將保釋金定為一萬歐元，以便被告能夠交保獲釋。" },
    { es: "palacio de justicia", gender: "m", plural: "palacios de justicia", pos: "n.", zh: "法院大樓", note: "字面意思是「正義宮」，是「法院建築」的正式說法，在拉丁美洲尤其常見；西班牙本土也常用 juzgado、tribunal 指法院機構本身。", ex: "Los manifestantes se reunieron frente al palacio de justicia para exigir una sentencia justa.", exZh: "抗議者聚集在法院大樓前，要求做出公正的判決。" },
    { es: "vista", gender: "f", plural: "vistas", pos: "n.", zh: "（法律）開庭審理；聽證會", note: "此為法律語境下的意思，與常見字義「視野、景色」不同，不要和英文 vista（景色）混淆，是典型的假朋友字。", ex: "La vista oral se celebrará la próxima semana en el juzgado de primera instancia.", exZh: "言詞辯論庭將於下週在初審法院舉行。" },
    { es: "apelación", gender: "f", plural: "apelaciones", pos: "n.", zh: "上訴", ex: "La defensa presentó una apelación ante el tribunal superior tras conocer el veredicto.", exZh: "辯方在得知判決後向上級法院提出了上訴。" },
    { es: "indulto", gender: "m", plural: "indultos", pos: "n.", zh: "特赦；赦免", note: "通常指國家元首給予個人的「特赦」，與針對群體的「大赦」（amnistía）不同。", ex: "El presidente concedió un indulto a varios presos políticos antes de dejar el cargo.", exZh: "總統在卸任前赦免了幾名政治犯。" },
    { es: "jurar", pos: "v.", zh: "宣誓；發誓", ex: "El nuevo testigo tuvo que jurar decir la verdad antes de declarar.", exZh: "這位新證人在作證前必須宣誓說實話。" },
    { es: "absolver", en: "absolve", pos: "v.", zh: "宣判無罪", note: "法律上指「判決無罪」；英文 absolve 更常用於宗教語境中「赦罪」的意思，用法略有不同。", ex: "El jurado decidió absolver al acusado por falta de pruebas.", exZh: "陪審團因證據不足而判決被告無罪。" },
    { es: "prohibición", en: "prohibition", gender: "f", plural: "prohibiciones", pos: "n.", zh: "禁止；禁令", ex: "La nueva prohibición de fumar en espacios públicos entrará en vigor el mes que viene.", exZh: "新的公共場所禁菸令將於下個月生效。" },
    { es: "contención", gender: "f", plural: "contenciones", pos: "n.", zh: "抑制；克制；圍堵", note: "一般語境指「抑制、克制、圍堵」，與英文 contention（爭執、爭論）意思不同，是典型的假朋友字，故不列為同源詞。", ex: "Los médicos aplicaron técnicas de contención para calmar al paciente agitado.", exZh: "醫生們運用約束與鎮定技巧來安撫躁動的病患。" },
    { es: "delito", gender: "m", plural: "delitos", pos: "n.", zh: "罪行；犯罪", note: "指程度較嚴重、可受刑事追訴的犯罪行為，與較輕微的違規（falta）有所區別。", ex: "Cometer ese delito puede conllevar una pena de hasta cinco años de prisión.", exZh: "犯下那項罪行可能導致最高五年的有期徒刑。" },
    { es: "enjuiciar", pos: "v.", zh: "起訴；審判", ex: "Las autoridades decidieron enjuiciar al empresario por evasión fiscal.", exZh: "當局決定以逃稅罪名起訴這名企業家。" },
    { es: "procesar", pos: "v.", zh: "起訴；控告", note: "在法律語境中指「提起訴訟、起訴」，與英文 process（處理）語意不同，是常見的假朋友字。", ex: "El fiscal decidió procesar a los tres sospechosos por el mismo delito.", exZh: "檢察官決定以同一項罪名起訴這三名嫌疑人。" },
    { es: "pena de muerte", gender: "f", plural: "penas de muerte", pos: "n.", zh: "死刑", ex: "Varios países han abolido la pena de muerte en las últimas décadas.", exZh: "近幾十年來，已有多個國家廢除了死刑。" },
    { es: "cadena perpetua", gender: "f", plural: "cadenas perpetuas", pos: "n.", zh: "無期徒刑；終身監禁", note: "字面意思是「永久的鎖鏈」，引申為「無期徒刑」。", ex: "El tribunal condenó al asesino a cadena perpetua sin posibilidad de libertad condicional.", exZh: "法院判處這名殺人犯無期徒刑，且不得假釋。" },
    { es: "normativa", gender: "f", plural: "normativas", pos: "n.", zh: "規範；法規", ex: "La empresa tuvo que adaptar sus procesos a la nueva normativa medioambiental.", exZh: "公司必須讓其流程符合新的環保法規。" },
    { es: "reglamento", gender: "m", plural: "reglamentos", pos: "n.", zh: "規章；章程", ex: "Todos los empleados deben conocer el reglamento interno de la empresa.", exZh: "所有員工都必須了解公司的內部規章。" },
    { es: "legislación", en: "legislation", gender: "f", plural: "legislaciones", pos: "n.", zh: "立法；法律體系", ex: "La nueva legislación laboral busca proteger mejor a los trabajadores autónomos.", exZh: "新的勞動立法旨在更好地保障自雇工作者。" },
    { es: "estatuto", en: "statute", gender: "m", plural: "estatutos", pos: "n.", zh: "法規；章程", note: "可指法律上的「法規」，也可指機構或公司的「章程」，依上下文而定。", ex: "Los estatutos de la asociación establecen los derechos y deberes de sus miembros.", exZh: "該協會的章程規定了會員的權利與義務。" },
    { es: "directriz", gender: "f", plural: "directrices", pos: "n.", zh: "指導方針；準則", ex: "El ministerio publicó nuevas directrices para la gestión de residuos industriales.", exZh: "部會公布了工業廢棄物管理的新指導方針。" },
    { es: "protocolo", en: "protocol", gender: "m", plural: "protocolos", pos: "n.", zh: "規程；協議；議定書", ex: "El hospital actualizó su protocolo de emergencias tras el simulacro de incendio.", exZh: "醫院在火災演習後更新了緊急應變規程。" },
    { es: "política", gender: "f", plural: "políticas", pos: "n.", zh: "政策", note: "同一個字也可指「政治」，需依語境判斷；此處指公司或機構的「政策」，與英文 politics（政治活動）不完全對應，故不列為同源詞。", ex: "La empresa implementó una nueva política de trabajo remoto para todos sus empleados.", exZh: "公司為所有員工實施了新的遠距工作政策。" },
    { es: "supervisión", en: "supervision", gender: "f", plural: "supervisiones", pos: "n.", zh: "監督；督導", ex: "El proyecto se llevó a cabo bajo la supervisión directa del director de obras.", exZh: "這項工程是在工程總監的直接監督下進行的。" },
    { es: "vigilancia", en: "vigilance", gender: "f", pos: "n.", zh: "監視；監控；警戒", note: "英文 vigilance 較常指「警覺、戒備」的抽象概念，而西文 vigilancia 更常用於「監控、監視」（如監視攝影機），語意略有偏移。", ex: "Instalaron cámaras de vigilancia en todas las entradas del edificio.", exZh: "他們在大樓所有出入口都安裝了監視攝影機。" },
    { es: "auditoría", en: "audit", gender: "f", plural: "auditorías", pos: "n.", zh: "稽核；審計", ex: "La empresa contrató a una firma externa para realizar una auditoría financiera.", exZh: "公司聘請了一家外部事務所來進行財務稽核。" },
    { es: "inspección", en: "inspection", gender: "f", plural: "inspecciones", pos: "n.", zh: "檢查；稽查", ex: "Los inspectores realizaron una inspección sorpresa en la fábrica.", exZh: "稽查員對這間工廠進行了一次突擊檢查。" },
    { es: "expulsión", en: "expulsion", gender: "f", plural: "expulsiones", pos: "n.", zh: "開除；驅逐", ex: "El estudiante fue amenazado con la expulsión si volvía a copiar en un examen.", exZh: "這名學生被警告，如果再次考試作弊就會被開除。" },
    { es: "suspensión", en: "suspension", gender: "f", plural: "suspensiones", pos: "n.", zh: "停職；停權；休學", note: "可指停職、停權、休學等多種「暫停」情境，依上下文而定。", ex: "El árbitro recibió una suspensión de tres partidos por su comportamiento antideportivo.", exZh: "這名裁判因不符運動精神的行為而被停職三場比賽。" },
    { es: "vinculante", pos: "adj.", zh: "有約束力的", ex: "El acuerdo alcanzado en la mediación no es vinculante para ninguna de las partes.", exZh: "調解達成的協議對雙方均無法律約束力。" },
    { es: "cumplir", pos: "v.", zh: "履行；遵守；完成", ex: "Es fundamental cumplir con los plazos establecidos en el contrato.", exZh: "遵守合約中規定的期限是至關重要的。" },
    { es: "incumplir", pos: "v.", zh: "違反；不履行", ex: "Si la constructora incumple el contrato, tendrá que pagar una multa considerable.", exZh: "如果建築公司違反合約，將必須支付一筆可觀的罰款。" },
    { es: "acatar", pos: "v.", zh: "遵從；服從", ex: "Los ciudadanos deben acatar las nuevas medidas sanitarias impuestas por el gobierno.", exZh: "公民必須遵從政府實施的新衛生措施。" },
    { es: "imponer", en: "impose", pos: "v.", zh: "施加；強制實行", ex: "El gobierno decidió imponer un nuevo impuesto a las grandes empresas tecnológicas.", exZh: "政府決定對大型科技公司徵收新稅。" },
    { es: "fiscalizar", pos: "v.", zh: "監督；查核", note: "與名詞 auditoría（審計）相關，常用於政府或公部門對財務、行政進行監督查核。", ex: "La contraloría se encarga de fiscalizar el uso de los fondos públicos.", exZh: "主計機關負責監督查核公共資金的使用情形。" },
    { es: "castigar", pos: "v.", zh: "懲罰；處罰", note: "英文的 castigate 語意較窄，多指「嚴厲批評」，與西文 castigar（懲罰，範圍更廣，可指實際處罰）不完全相同，避免誤判為同源詞。", ex: "Los padres decidieron castigar al niño sin videojuegos durante una semana.", exZh: "父母決定處罰這個孩子一週不准玩電動遊戲。" },
    { es: "recompensar", en: "recompense", pos: "v.", zh: "獎賞；酬謝", ex: "La empresa decidió recompensar a los empleados más productivos con un bono extra.", exZh: "公司決定額外發放獎金來獎勵最有生產力的員工。" },
    { es: "autodisciplina", gender: "f", pos: "n.", zh: "自律", ex: "Aprender a tocar un instrumento requiere mucha autodisciplina y constancia.", exZh: "學習演奏樂器需要極大的自律與恆心。" },
    { es: "autocontrol", gender: "m", pos: "n.", zh: "自我控制；自制力", ex: "Mantener la calma en situaciones de estrés requiere un gran autocontrol.", exZh: "在壓力情境下保持冷靜需要很強的自制力。" },
    { es: "constancia", en: "constancy", gender: "f", pos: "n.", zh: "恆心；毅力", note: "在拉丁美洲部分地區，constancia 也可指「證明文件」（如 constancia de estudios，在學證明），但此處為「恆心、毅力」之意。", ex: "Solo con constancia y disciplina se pueden alcanzar metas a largo plazo.", exZh: "只有靠恆心與紀律，才能達成長期目標。" },
    { es: "rutina", en: "routine", gender: "f", plural: "rutinas", pos: "n.", zh: "日常慣例；例行公事", ex: "Cambiar la rutina diaria puede ayudar a mejorar la productividad.", exZh: "改變日常作息有助於提升生產力。" },
    { es: "metódico", en: "methodical", pos: "adj.", zh: "有條理的；講求方法的", ex: "Es una investigadora muy metódica que nunca deja ningún detalle al azar.", exZh: "她是一位非常有條理的研究員，從不放過任何一個細節。" },
    { es: "riguroso", en: "rigorous", pos: "adj.", zh: "嚴謹的；嚴格的", ex: "El proceso de selección de los candidatos fue extremadamente riguroso.", exZh: "候選人的甄選過程極為嚴謹。" },
    { es: "delinquir", pos: "v.", zh: "犯罪、觸犯法律", ex: "Muchos jóvenes empiezan a delinquir por falta de oportunidades y de apoyo familiar.", exZh: "許多年輕人因缺乏機會與家庭支持而開始犯罪。" },
    { es: "cometer", pos: "v.", zh: "犯（罪）、做出（某行為）", ex: "El sospechoso cometió el robo aprovechando que no había cámaras de seguridad.", exZh: "嫌犯趁著沒有監視器的時候犯下了搶案。" },
    { es: "hurtar", pos: "v.", zh: "（不使用暴力）偷竊", note: "與英文 hurt（傷害）拼字相近但意思完全不同,是假朋友;hurtar 指不使用暴力的竊盜行為,與可能帶有暴力的 robar 有所區別。", ex: "El empleado fue despedido después de que lo grabaran hurtando mercancía del almacén.", exZh: "那名員工在被拍到從倉庫偷竊商品後遭到解雇。" },
    { es: "violar", pos: "v.", zh: "強暴、性侵;（法律)違反、侵犯", note: "另有「違反（法律、條約等)」之意,與英文 violate 同源;但單獨使用時最常見的意思是「強暴、性侵」,需依語境判斷,避免與 violate 直接畫上等號。", ex: "El tribunal condenó al hombre a quince años de prisión por violar a una menor.", exZh: "法院判處該名男子十五年徒刑,因為他性侵了一名未成年少女。" },
    { es: "violentar", pos: "v.", zh: "（強行)撬開、破壞;施暴、強迫", ex: "Los ladrones violentaron la puerta principal para entrar en la vivienda.", exZh: "竊賊撬開大門闖入了那間住宅。" },
    { es: "chantajear", pos: "v.", zh: "勒索、敲詐", ex: "La expareja intentó chantajearlo amenazando con publicar fotos privadas.", exZh: "前任情人威脅要公開私人照片藉此勒索他。" },
    { es: "sobornar", pos: "v.", zh: "賄賂、行賄", ex: "El empresario fue detenido por intentar sobornar a un funcionario para agilizar el permiso.", exZh: "那名企業主因試圖賄賂官員以加快許可申請而遭到逮捕。" },
    { es: "falsificar", en: "falsify", pos: "v.", zh: "偽造、造假", ex: "La policía descubrió una red dedicada a falsificar billetes de veinte euros.", exZh: "警方發現了一個專門偽造二十歐元紙鈔的集團。" },
    { es: "matar", pos: "v.", zh: "殺、殺死", ex: "El acusado admitió haber matado a su vecino tras una discusión que se salió de control.", exZh: "被告承認在一場失控的爭吵後殺害了他的鄰居。" },
    { es: "raptar", pos: "v.", zh: "綁架、擄走", note: "外形近似英文 rapt（出神的、入迷的),但兩者意思無關,不要混淆。", ex: "Los secuestradores raptaron al empresario y exigieron un rescate millonario.", exZh: "綁匪擄走了那名企業家並要求鉅額贖金。" },
    { es: "homicidio", en: "homicide", gender: "m", plural: "homicidios", pos: "n.", zh: "殺人（罪)、他殺", ex: "La fiscalía calificó el caso como homicidio doloso, no como accidente.", exZh: "檢方將此案定性為故意殺人,而非意外事故。" },
    { es: "fraude", en: "fraud", gender: "m", plural: "fraudes", pos: "n.", zh: "詐欺、詐騙", ex: "La empresa fue multada por cometer fraude fiscal durante varios años.", exZh: "該公司因多年來從事逃稅詐欺而遭到罰款。" },
    { es: "estafa", gender: "f", plural: "estafas", pos: "n.", zh: "詐騙、騙局", ex: "Miles de personas cayeron en la estafa piramidal antes de que las autoridades la detectaran.", exZh: "在當局查獲之前,已有數千人落入了這個金字塔詐騙騙局。" },
    { es: "contrabando", en: "contraband", gender: "m", plural: "contrabandos", pos: "n.", zh: "走私（行為);走私品", note: "英文 contraband 主要指「違禁品」本身,西文 contrabando 除了指違禁品外,也常指「走私」這個行為。", ex: "Detuvieron al camión en la frontera por transportar contrabando de cigarrillos.", exZh: "那輛卡車在邊境因運送走私香菸而被攔截查扣。" },
    { es: "narcotráfico", gender: "m", pos: "n.", zh: "毒品販運、販毒", note: "不可數,通常不使用複數形。", ex: "El gobierno anunció una nueva estrategia para combatir el narcotráfico en la región.", exZh: "政府宣布了一項打擊該地區毒品販運的新策略。" },
    { es: "trata", gender: "f", pos: "n.", zh: "（人口)販運、拐賣", note: "常見搭配 trata de personas（人口販運)、trata de blancas（早期指婦女性販運)。", ex: "La ONG trabaja para rescatar a víctimas de la trata de personas en la zona fronteriza.", exZh: "這個非政府組織致力於在邊境地區救援人口販運的受害者。" },
    { es: "vandalismo", en: "vandalism", gender: "m", pos: "n.", zh: "蓄意破壞、毀損公物", note: "不可數,通常不使用複數形。", ex: "Varios coches del barrio amanecieron rayados en un nuevo acto de vandalismo.", exZh: "社區裡好幾輛車在一次新的蓄意破壞行動中,一早就被劃出了刮痕。" },
    { es: "pandilla", gender: "f", plural: "pandillas", pos: "n.", zh: "幫派、幫伙", ex: "El barrio lleva años intentando alejar a los jóvenes de las pandillas callejeras.", exZh: "這個社區多年來一直努力讓年輕人遠離街頭幫派。" },
    { es: "camello", gender: "m", plural: "camellos", pos: "n.", zh: "（俚語,西班牙用語)毒販;（本義)駱駝", note: "camello 本義是「駱駝」,在西班牙口語俚語中引申指「毒販」;拉丁美洲較少見此用法,常用 narcotraficante 或 dealer 等詞。", ex: "La policía detuvo a un camello que vendía droga a las puertas del instituto.", exZh: "警方逮捕了一名在高中門口賣毒品的毒販。" },
    { es: "cómplice", en: "accomplice", gender: "m", plural: "cómplices", pos: "n.", zh: "共犯、幫兇", note: "陽陰性同形名詞(el cómplice / la cómplice),依所指對象性別決定冠詞,此處預設陽性列出。", ex: "El chofer fue acusado de ser cómplice del robo al no avisar a la policía.", exZh: "那名司機因未報警而被控是這起搶案的共犯。" },
    { es: "inflación", en: "inflation", gender: "f", pos: "n.", zh: "通貨膨脹", note: "經濟學語境中通常不可數,一般不使用複數形。", ex: "La inflación ha reducido considerablemente el poder adquisitivo de las familias.", exZh: "通貨膨脹已大幅削弱了家庭的購買力。" },
    { es: "deflación", en: "deflation", gender: "f", pos: "n.", zh: "通貨緊縮", note: "不可數,通常不使用複數形。", ex: "Algunos economistas temen que la deflación frene aún más el consumo.", exZh: "有些經濟學家擔心通貨緊縮會進一步抑制消費。" },
    { es: "recesión", en: "recession", gender: "f", plural: "recesiones", pos: "n.", zh: "經濟衰退", ex: "El país entró en recesión después de dos trimestres consecutivos de caída del PIB.", exZh: "該國在連續兩季國內生產毛額下滑後陷入了經濟衰退。" },
    { es: "bolsa de valores", gender: "f", plural: "bolsas de valores", pos: "n.", zh: "證券交易所", ex: "Las acciones de la compañía subieron un diez por ciento en la bolsa de valores.", exZh: "該公司的股票在證券交易所上漲了百分之十。" },
    { es: "valor", en: "value", gender: "m", plural: "valores", pos: "n.", zh: "價值;（複數 valores)證券、有價證券;勇氣", note: "valor 除了「價值」之外也常指「勇氣」;複數 valores 在金融語境中則指「證券、有價證券」。", ex: "El valor de la propiedad se ha duplicado desde que se construyó el nuevo metro.", exZh: "自從新地鐵通車以來,這處房產的價值已經翻倍了。" },
    { es: "cédula", gender: "f", plural: "cédulas", pos: "n.", zh: "債券、憑證;（拉美常用)身分證", note: "在拉丁美洲多國,cédula 常單獨指「身分證」(cédula de identidad);此處金融語境則指「債券、憑證」。", ex: "El banco emitió nuevas cédulas hipotecarias para financiar la construcción de viviendas.", exZh: "銀行發行了新的抵押債券以資助住宅建設。" },
    { es: "invertir", pos: "v.", zh: "投資;（也可指)顛倒、反轉", note: "invertir 除了「投資」外,也常表示「顛倒、反轉」(如 invertir el orden 顛倒順序),須依語境判斷;與英文 invest 拼字相近但字源不同,意思恰好在金融語境中重疊。", ex: "Muchos jóvenes prefieren invertir sus ahorros en fondos indexados antes que en bienes raíces.", exZh: "許多年輕人偏好把積蓄投資在指數型基金,而不是不動產。" },
    { es: "activo", gender: "m", plural: "activos", pos: "n.", zh: "資產", note: "同形容詞 activo/activa（積極的、活躍的),此處為金融名詞用法,指「資產」。", ex: "La empresa vendió parte de sus activos para reducir la deuda acumulada.", exZh: "該公司出售了部分資產以減少累積的債務。" },
    { es: "fideicomiso", gender: "m", plural: "fideicomisos", pos: "n.", zh: "信託", ex: "Los padres crearon un fideicomiso para garantizar la educación universitaria de sus hijos.", exZh: "父母設立了一個信託,以保障子女的大學教育經費。" },
    { es: "acción", gender: "f", plural: "acciones", pos: "n.", zh: "股票、股份;（一般義)行動、動作", note: "acción 最常見的意思是「行動、動作」(與英文 action 同源),但在金融語境中意指「股票、股份」。", ex: "Compró acciones de la empresa cuando el precio todavía era bajo.", exZh: "他在股價還低的時候買進了該公司的股票。" },
    { es: "propiedad", en: "property", gender: "f", plural: "propiedades", pos: "n.", zh: "財產、地產;（也指)特性、屬性", ex: "La familia heredó una propiedad en las afueras de la ciudad.", exZh: "這家人繼承了一處位於市郊的房產。" },
    { es: "globalización", en: "globalization", gender: "f", pos: "n.", zh: "全球化", note: "不可數,通常不使用複數形。", ex: "La globalización ha facilitado el intercambio comercial entre países lejanos.", exZh: "全球化促進了遙遠國家之間的貿易往來。" },
    { es: "consumidor", en: "consumer", gender: "m", plural: "consumidores", pos: "n.", zh: "消費者", note: "陰性形為 consumidora。", ex: "Los consumidores exigen cada vez más productos sostenibles y de comercio justo.", exZh: "消費者越來越要求永續且公平貿易的產品。" },
    { es: "mercado laboral", gender: "m", plural: "mercados laborales", pos: "n.", zh: "勞動市場、就業市場", ex: "El mercado laboral se ha vuelto más competitivo con la llegada de la inteligencia artificial.", exZh: "隨著人工智慧的到來,就業市場變得更加競爭激烈。" },
    { es: "tasa de desempleo", gender: "f", plural: "tasas de desempleo", pos: "n.", zh: "失業率", ex: "La tasa de desempleo bajó al cinco por ciento en el último trimestre.", exZh: "失業率在上一季降到了百分之五。" },
    { es: "déficit", en: "deficit", gender: "m", plural: "déficits", pos: "n.", zh: "赤字、虧空", ex: "El gobierno prometió reducir el déficit público en los próximos cuatro años.", exZh: "政府承諾在未來四年內縮減財政赤字。" },
    { es: "superávit", gender: "m", plural: "superávits", pos: "n.", zh: "盈餘、順差", ex: "La región cerró el año con un superávit fiscal gracias al aumento de la recaudación.", exZh: "該地區在稅收增加的帶動下,以財政盈餘結束了這一年。" },
    { es: "empobrecer", pos: "v.", zh: "使貧窮化、使貧困", ex: "La sequía prolongada terminó por empobrecer a gran parte de la población rural.", exZh: "長期乾旱最終使大部分農村人口陷入了貧困。" },
    { es: "cuenta corriente", gender: "f", plural: "cuentas corrientes", pos: "n.", zh: "活期存款帳戶、支票帳戶", ex: "Domicilié el pago del alquiler en mi cuenta corriente para no olvidarme cada mes.", exZh: "我把房租的付款設定從我的活期帳戶自動扣款,這樣每個月才不會忘記。" },
    { es: "cuenta de ahorro", gender: "f", plural: "cuentas de ahorro", pos: "n.", zh: "儲蓄帳戶", ex: "Abrí una cuenta de ahorro para mis hijos en cuanto nacieron.", exZh: "我的孩子一出生,我就替他們開了一個儲蓄帳戶。" },
    { es: "cajero automático", gender: "m", plural: "cajeros automáticos", pos: "n.", zh: "自動櫃員機、提款機", ex: "Saqué dinero en efectivo del cajero automático antes de entrar al mercado.", exZh: "我在進市場之前先在自動櫃員機領了現金。" },
    { es: "ingreso", gender: "m", plural: "ingresos", pos: "n.", zh: "收入、所得", note: "常用複數 ingresos 表示「收入」;與英文 ingress（進入)為假朋友,意思不同,切勿混淆。", ex: "Sus ingresos mensuales apenas le alcanzan para cubrir el alquiler y la comida.", exZh: "他每個月的收入幾乎只夠支付房租和伙食費。" },
    { es: "anticipo", gender: "m", plural: "anticipos", pos: "n.", zh: "預付款、訂金", note: "與英文 anticipation（期待、預期)意思不同,是假朋友;anticipo 指「預付款、訂金」。", ex: "El comprador pagó un anticipo del veinte por ciento para reservar el apartamento.", exZh: "買方支付了百分之二十的訂金以預訂這間公寓。" },
    { es: "depósito", en: "deposit", gender: "m", plural: "depósitos", pos: "n.", zh: "存款、押金、寄存", ex: "Tuve que dejar un depósito de cien euros para alquilar el equipo de buceo.", exZh: "我必須先付一百歐元的押金才能租潛水裝備。" },
    { es: "transacción", en: "transaction", gender: "f", plural: "transacciones", pos: "n.", zh: "交易", ex: "El banco bloqueó la transacción por considerarla sospechosa de fraude.", exZh: "銀行因懷疑這筆交易涉及詐欺而將其封鎖。" },
    { es: "tarjeta de débito", gender: "f", plural: "tarjetas de débito", pos: "n.", zh: "金融卡、簽帳卡", ex: "Pagué la cena con tarjeta de débito porque no llevaba efectivo.", exZh: "我用金融卡付了晚餐錢,因為我沒帶現金。" },
    { es: "tarjeta de crédito", gender: "f", plural: "tarjetas de crédito", pos: "n.", zh: "信用卡", ex: "Acumulé muchos puntos usando la tarjeta de crédito para las compras del mes.", exZh: "我用信用卡支付這個月的購物,累積了很多點數。" },
    { es: "tarjeta de regalo", gender: "f", plural: "tarjetas de regalo", pos: "n.", zh: "禮品卡", ex: "Le regalé una tarjeta de regalo de su tienda de ropa favorita por su cumpleaños.", exZh: "我送了她最愛的服飾店禮品卡當生日禮物。" },
    { es: "bono", gender: "m", plural: "bonos", pos: "n.", zh: "債券;（也可指)抵用券、獎金", note: "意思因語境而異,可指「債券」（金融)、「抵用券」（消費)或「獎金」（工作,較接近英文 bonus,但兩者非同一詞用法,不宜直接對應)。", ex: "El gobierno emitió bonos del Estado para financiar las nuevas infraestructuras.", exZh: "政府發行了公債來資助新的基礎建設。" },
    { es: "cuota", gender: "f", plural: "cuotas", pos: "n.", zh: "分期付款、會費", note: "與英文 quota（配額)拼字相近但意思不同,是假朋友;cuota 常指「分期款、會費」,而非「配額」。", ex: "Pagamos una cuota mensual de treinta euros por la membresía del gimnasio.", exZh: "我們每個月支付三十歐元的健身房會費。" },
    { es: "tarifa", en: "tariff", gender: "f", plural: "tarifas", pos: "n.", zh: "費率、資費;關稅", note: "除了「關稅」(與英文 tariff 同義)外,西文 tarifa 更廣泛地指任何「費率、資費」(如電話、水電資費)。", ex: "La compañía eléctrica subió la tarifa nocturna a partir de este mes.", exZh: "電力公司從這個月起調漲了夜間電費費率。" },
    { es: "fondo", en: "fund", gender: "m", plural: "fondos", pos: "n.", zh: "基金;（也指)底部、背景", note: "fondo 另有「底部、背景」的意思(如 al fondo 在後面、深處),此處金融語境指「基金」。", ex: "Invirtió sus ahorros en un fondo de inversión de bajo riesgo.", exZh: "他把積蓄投入了一檔低風險的投資基金。" },
    { es: "IVA", gender: "m", pos: "n.", zh: "加值稅（加值型營業稅)", note: "為 Impuesto sobre el Valor Añadido 的縮寫,相當於英文的 VAT（Value Added Tax);不可數,通常不使用複數形。", ex: "El precio final incluye el veintiuno por ciento de IVA.", exZh: "最終價格已包含百分之二十一的加值稅。" },
    { es: "alcabala", gender: "f", plural: "alcabalas", pos: "n.", zh: "（西語系國家)銷售稅、交易稅", note: "此詞源自西班牙殖民時期的稅制用語;現今在部分拉丁美洲國家（如委內瑞拉)也常用來指「（公路)檢查哨」,需依上下文判斷語意。", ex: "Durante la colonia, los comerciantes debían pagar la alcabala por cada venta que realizaban.", exZh: "在殖民時期,商人每完成一筆交易就必須繳納交易稅。" },
    { es: "asequible", pos: "adj.", zh: "負擔得起的、可企及的", note: "常與 accesible（易於進出、使用的)混淆;asequible 強調「價格可負擔」或「容易達成」。", ex: "Buscamos un piso asequible cerca del centro, pero los precios han subido mucho.", exZh: "我們想找一間市中心附近負擔得起的公寓,但房價漲了很多。" },
    { es: "reembolsar", pos: "v.", zh: "退款、償還", ex: "La tienda se comprometió a reembolsar el importe total si el producto llegaba defectuoso.", exZh: "這家店承諾如果商品有瑕疵送達,將全額退款。" },
    { es: "ahorrar", pos: "v.", zh: "存錢、節省", ex: "Decidieron ahorrar para el enganche de su primera casa.", exZh: "他們決定存錢作為第一間房子的頭期款。" },
    { es: "deber", pos: "v.", zh: "欠（錢);（也表)應該", note: "deber 除了「欠錢」之外,更常用來表示「應該、必須」(deber + 原形動詞)。", ex: "Todavía le debo doscientos euros a mi hermano por el préstamo del año pasado.", exZh: "我還欠我哥哥去年借的兩百歐元。" },
    { es: "costar", en: "cost", pos: "v.", zh: "花費、值（多少錢)", note: "用法類似 gustar,常以第三人稱搭配間接受詞代名詞(me cuesta, te cuesta...)。", ex: "El vuelo directo a Buenos Aires cuesta bastante más que el que hace escala.", exZh: "直飛布宜諾斯艾利斯的機票比轉機的貴上不少。" },
    { es: "empeñar", pos: "v.", zh: "典當、抵押", note: "反身動詞 empeñarse（en + 原形動詞)則表示「堅持、執意要做某事」,意思不同。", ex: "Tuvo que empeñar su reloj para pagar el alquiler ese mes.", exZh: "那個月他必須典當自己的手錶才能付房租。" },
    { es: "símil", en: "simile", gender: "m", plural: "símiles", pos: "n.", zh: "明喻", note: "修辭手法,以「como」等詞直接比較兩件事物", ex: "\"Sus ojos brillaban como estrellas\" es un símil muy usado en la poesía romántica.", exZh: "「她的眼睛閃耀如星星」是浪漫主義詩歌中常用的明喻。" },
    { es: "hipérbole", en: "hyperbole", gender: "f", plural: "hipérboles", pos: "n.", zh: "誇飾;誇張修辭", note: "雖以 -e 結尾,卻是陰性名詞(la hipérbole),須特別記憶", ex: "Decir que ha llorado un río de lágrimas es una hipérbole evidente.", exZh: "說自己哭出了一條河的眼淚,顯然是一種誇飾修辭。" },
    { es: "onomatopeya", en: "onomatopoeia", gender: "f", plural: "onomatopeyas", pos: "n.", zh: "擬聲詞", ex: "El cómic estaba lleno de onomatopeyas como \"¡pum!\" y \"¡crash!\".", exZh: "這本漫畫裡充滿了「碰!」、「哐噹!」之類的擬聲詞。" },
    { es: "personificación", en: "personification", gender: "f", plural: "personificaciones", pos: "n.", zh: "擬人法", ex: "En el poema, la muerte aparece personificada como una anciana silenciosa.", exZh: "在這首詩裡,死亡被擬人化成一位沉默的老婦人。" },
    { es: "aliteración", en: "alliteration", gender: "f", plural: "aliteraciones", pos: "n.", zh: "頭韻", ex: "El trabalenguas juega con la aliteración de la letra \"p\".", exZh: "這句繞口令運用了「p」這個字母的頭韻效果。" },
    { es: "ironía", en: "irony", gender: "f", plural: "ironías", pos: "n.", zh: "反諷;諷刺", note: "常見片語 \"qué ironía\"(真諷刺)", ex: "Con cierta ironía, el crítico elogió el libro que antes había destrozado.", exZh: "那位評論家帶著一絲諷刺意味,稱讚了他先前狠批過的那本書。" },
    { es: "traductor", en: "translator", gender: "m", plural: "traductores", pos: "n.", zh: "譯者;翻譯者", note: "陰性形為 traductora", ex: "El traductor tuvo que buscar un equivalente cultural para ese chiste intraducible.", exZh: "譯者必須為那個難以直譯的笑話找出對應的文化說法。" },
    { es: "sátira", en: "satire", gender: "f", plural: "sátiras", pos: "n.", zh: "諷刺作品;諷刺文學", ex: "La novela es una sátira feroz de la política contemporánea.", exZh: "這部小說是對當代政治的一部辛辣諷刺作品。" },
    { es: "realismo mágico", gender: "m", pos: "n.", zh: "魔幻寫實主義", note: "拉丁美洲文學代表流派,如加西亞·馬奎斯的作品;通常不使用複數形", ex: "García Márquez es el máximo exponente del realismo mágico latinoamericano.", exZh: "加西亞·馬奎斯是拉丁美洲魔幻寫實主義的代表作家。" },
    { es: "tragicomedia", en: "tragicomedy", gender: "f", plural: "tragicomedias", pos: "n.", zh: "悲喜劇", ex: "La obra mezcla momentos desgarradores con gags absurdos, como toda buena tragicomedia.", exZh: "這部作品交織著撕心裂肺的時刻與荒誕的笑點,正是一部優秀悲喜劇該有的樣子。" },
    { es: "relato corto", gender: "m", plural: "relatos cortos", pos: "n.", zh: "短篇小說", ex: "Publicó una colección de relatos cortos ambientados en su pueblo natal.", exZh: "他出版了一本以家鄉為背景的短篇小說集。" },
    { es: "autoayuda", gender: "f", pos: "n.", zh: "自我成長;勵志(類書籍)", note: "常見片語 \"libro de autoayuda\"(勵志書);通常不使用複數形", ex: "La sección de autoayuda de la librería no para de crecer cada año.", exZh: "書店裡的勵志自助類書區每年都在不斷擴大。" },
    { es: "tebeo", gender: "m", plural: "tebeos", pos: "n.", zh: "(西班牙式)兒童漫畫;連環漫畫", note: "此用法在西班牙較常見,拉美多用 \"cómic\" 或 \"historieta\"", ex: "De pequeño coleccionaba tebeos que compraba en el quiosco de la esquina.", exZh: "我小時候會收集在轉角書報攤買的漫畫書。" },
    { es: "manga", en: "manga", gender: "m", plural: "mangas", pos: "n.", zh: "日本漫畫", note: "雖以 -a 結尾,但此日文借詞在西語中為陽性(el manga)", ex: "Ese manga se ha adaptado ya a tres temporadas de anime.", exZh: "那部漫畫已經被改編成三季動畫了。" },
    { es: "resumen", gender: "m", plural: "resúmenes", pos: "n.", zh: "摘要;概要", note: "複數重音位置改變(resumen → resúmenes)", ex: "El profesor nos pidió un resumen de dos páginas sobre el capítulo.", exZh: "老師要求我們針對這一章寫一份兩頁的摘要。" },
    { es: "bibliografía", en: "bibliography", gender: "f", plural: "bibliografías", pos: "n.", zh: "參考書目", ex: "Al final de la tesis hay que incluir la bibliografía completa.", exZh: "論文最後必須附上完整的參考書目。" },
    { es: "nota al pie de página", gender: "f", plural: "notas al pie de página", pos: "n.", zh: "註腳;頁尾註釋", note: "也常簡稱 \"nota al pie\"", ex: "El editor añadió una nota al pie de página para aclarar el término histórico.", exZh: "編輯加了一個註腳來解釋那個歷史用語。" },
    { es: "comprensión", en: "comprehension", gender: "f", pos: "n.", zh: "理解;領悟(能力)", note: "常見於 \"comprensión lectora\"(閱讀理解);此義通常不使用複數", ex: "El examen incluye un ejercicio de comprensión lectora bastante exigente.", exZh: "考試中包含一項相當有難度的閱讀理解練習。" },
    { es: "suspense", en: "suspense", gender: "m", pos: "n.", zh: "懸疑;懸念", note: "拉丁美洲多用 \"suspenso\";通常不使用複數形", ex: "La película mantiene el suspense hasta el último minuto.", exZh: "這部電影把懸疑感一直維持到最後一分鐘。" },
    { es: "bocadillo", gender: "m", plural: "bocadillos", pos: "n.", zh: "(漫畫)對話框;(西班牙)三明治", note: "在西班牙,此字最常見的意思其實是「三明治」;在漫畫脈絡中則指「對話框」", ex: "En el cómic, el villano suelta su amenaza dentro de un bocadillo enorme.", exZh: "在這部漫畫裡,反派角色在一個巨大的對話框裡說出他的威脅。" },
    { es: "héroe", en: "hero", gender: "m", plural: "héroes", pos: "n.", zh: "英雄;男主角", ex: "El héroe de la novela duda constantemente de sus propias decisiones.", exZh: "這部小說裡的英雄不斷懷疑自己所做的決定。" },
    { es: "heroína", en: "heroine", gender: "f", plural: "heroínas", pos: "n.", zh: "女英雄;女主角", note: "也指毒品「海洛因」,需依語境判斷", ex: "La heroína rechaza el papel tradicional que la sociedad esperaba de ella.", exZh: "這位女主角拒絕了社會對她所期待的傳統角色。" },
    { es: "antihéroe", en: "antihero", gender: "m", plural: "antihéroes", pos: "n.", zh: "反英雄", ex: "El protagonista es un antihéroe cínico que apenas se preocupa por los demás.", exZh: "主角是個憤世嫉俗、幾乎不在乎他人死活的反英雄。" },
    { es: "villano", en: "villain", gender: "m", plural: "villanos", pos: "n.", zh: "反派;壞人", note: "陰性形為 villana", ex: "El villano de la saga resulta tener motivaciones más complejas de lo que parecía.", exZh: "這部系列作品的反派角色,其動機其實比表面看起來複雜得多。" },
    { es: "precuela", en: "prequel", gender: "f", plural: "precuelas", pos: "n.", zh: "前傳", ex: "La precuela explica cómo se conocieron los dos protagonistas años antes.", exZh: "這部前傳解釋了兩位主角多年前是如何相識的。" },
    { es: "secuela", en: "sequel", gender: "f", plural: "secuelas", pos: "n.", zh: "續集;(常用義)後遺症", note: "日常生活中更常見的意思是「後遺症、後果」,尤其在醫學或事故脈絡中", ex: "El accidente le dejó secuelas que aún hoy le dificultan caminar.", exZh: "那場意外留下的後遺症,讓他至今走路仍有困難。" },
    { es: "saga", en: "saga", gender: "f", plural: "sagas", pos: "n.", zh: "系列作品;傳奇故事", ex: "Ha leído toda la saga sin parar, libro tras libro.", exZh: "他一口氣把整個系列讀完了,一本接著一本。" },
    { es: "mitología", en: "mythology", gender: "f", plural: "mitologías", pos: "n.", zh: "神話;神話學", ex: "Muchos superhéroes modernos están inspirados en la mitología griega.", exZh: "許多現代超級英雄的靈感都來自希臘神話。" },
    { es: "conseja", gender: "f", plural: "consejas", pos: "n.", zh: "民間傳說;古老故事", note: "罕用的古語詞,意指口耳相傳的故事;切勿與 \"consejo\"(建議)混淆", ex: "La abuela contaba consejas de brujas y aparecidos junto a la chimenea.", exZh: "奶奶會在壁爐旁講述關於女巫和亡靈的民間傳說。" },
    { es: "ciberpunk", en: "cyberpunk", gender: "m", pos: "n.", zh: "電馭叛客;賽博龐克(文類)", note: "作為文類名詞時通常不使用複數形", ex: "La novela combina alta tecnología y decadencia urbana, típico del ciberpunk.", exZh: "這部小說融合了高科技與都市頹敗景象,是典型的電馭叛客風格。" },
    { es: "magia", en: "magic", gender: "f", pos: "n.", zh: "魔法;魔術", note: "此義通常不使用複數形", ex: "En ese universo, la magia tiene un precio que el protagonista aún desconoce.", exZh: "在那個世界觀裡,魔法是有代價的,而主角目前還不知道那代價是什麼。" },
    { es: "profecía", en: "prophecy", gender: "f", plural: "profecías", pos: "n.", zh: "預言", ex: "Toda la trama gira en torno a una profecía antigua que nadie sabe interpretar.", exZh: "整個劇情都圍繞著一則沒有人能解讀的古老預言展開。" },
    { es: "zombi", en: "zombie", gender: "m", plural: "zombis", pos: "n.", zh: "殭屍", note: "RAE 建議複數拼作 \"zombis\";口語中也常見 \"zombie/zombies\" 的拼法", ex: "La serie trata sobre un grupo de supervivientes tras una invasión de zombis.", exZh: "這部影集講述殭屍入侵後一群倖存者的故事。" },
    { es: "monstruo", en: "monster", gender: "m", plural: "monstruos", pos: "n.", zh: "怪物;怪獸", ex: "El monstruo del lago aparece solo en las noches de luna llena.", exZh: "那隻湖怪只在滿月的夜晚才會出現。" },
    { es: "vampiro", en: "vampire", gender: "m", plural: "vampiros", pos: "n.", zh: "吸血鬼", note: "陰性形為 vampira", ex: "El vampiro de la novela odia su propia condición inmortal.", exZh: "小說裡的那個吸血鬼痛恨自己不死之身的處境。" },
    { es: "duende", gender: "m", plural: "duendes", pos: "n.", zh: "精靈;小妖精", note: "西班牙民間傳說中住在家裡的小妖精;也用於佛朗明哥表演中「魅力、靈氣」的引申義", ex: "Según la leyenda, un duende travieso escondía los objetos de la casa.", exZh: "傳說中,一個調皮的精靈會把家裡的東西藏起來。" },
    { es: "hombre lobo", gender: "m", plural: "hombres lobo", pos: "n.", zh: "狼人", ex: "Bajo la luna llena, el hombre lobo pierde todo control sobre sí mismo.", exZh: "在滿月之下,狼人會完全失去自我控制。" },
    { es: "mago", gender: "m", plural: "magos", pos: "n.", zh: "巫師;魔術師", note: "陰性形為 maga", ex: "El viejo mago le enseña al niño los secretos de la magia antigua.", exZh: "那位老巫師教導那個孩子古老魔法的祕密。" },
    { es: "elfo", en: "elf", gender: "m", plural: "elfos", pos: "n.", zh: "精靈", ex: "Los elfos del bosque viven cientos de años sin apenas envejecer.", exZh: "森林裡的精靈能活上數百年,幾乎不會衰老。" },
    { es: "enano", gender: "m", plural: "enanos", pos: "n.", zh: "矮人;侏儒", note: "陰性形為 enana", ex: "El enano forjó una espada capaz de atravesar cualquier armadura.", exZh: "那個矮人打造了一把能夠貫穿任何盔甲的劍。" },
    { es: "orco", en: "orc", gender: "m", plural: "orcos", pos: "n.", zh: "半獸人;歐克", ex: "Un ejército de orcos avanzaba hacia las puertas de la ciudad.", exZh: "一支半獸人大軍正朝著城門逼近。" },
    { es: "dragón", en: "dragon", gender: "m", plural: "dragones", pos: "n.", zh: "龍", ex: "El dragón custodiaba un tesoro que nadie había logrado robar.", exZh: "那隻龍守護著一批從沒有人成功偷走過的寶藏。" },
    { es: "extraterrestre", en: "extraterrestrial", gender: "m", plural: "extraterrestres", pos: "n.", zh: "外星人", note: "陽陰性同形(el/la extraterrestre)", ex: "La película narra el primer contacto de la humanidad con un extraterrestre.", exZh: "這部電影講述人類與一名外星人的首次接觸。" },
    { es: "fantasma", gender: "m", plural: "fantasmas", pos: "n.", zh: "幽靈;鬼魂", note: "雖以 -a 結尾,卻是陽性名詞(el fantasma),屬於常見例外", ex: "Los vecinos juran que la casa abandonada está habitada por un fantasma.", exZh: "鄰居們都發誓說那棟廢棄的房子裡住著一個幽靈。" },
    { es: "viaje en el tiempo", gender: "m", plural: "viajes en el tiempo", pos: "n.", zh: "時空旅行;時間旅行", ex: "La serie explora las consecuencias éticas del viaje en el tiempo.", exZh: "這部影集探討了時空旅行所帶來的倫理後果。" },
    { es: "espectro", en: "specter", gender: "m", plural: "espectros", pos: "n.", zh: "幽靈;亡靈;(物理)光譜", note: "也可指「光譜」(物理學意義)", ex: "Cuentan que el espectro de un antiguo capitán recorre el barco por las noches.", exZh: "傳說一艘船上,每到夜晚都會有一位古代船長的幽靈四處遊蕩。" },
    { es: "karma", en: "karma", gender: "m", pos: "n.", zh: "業力;因果報應", note: "陽性名詞;口語中常表示「報應」,例如 \"es tu karma\"。通常視為不可數概念,一般不用複數。", ex: "Ella cree firmemente que el karma se encarga de castigar a quienes actúan con maldad.", exZh: "她堅信業力會懲罰那些心懷惡意行事的人。" },
    { es: "aquelarre", gender: "m", plural: "aquelarres", pos: "n.", zh: "女巫夜會;巫魔會", note: "也可引申比喻喧鬧混亂的聚會或場面。", ex: "Según la leyenda local, las brujas se reunían cada luna llena para celebrar un aquelarre en el bosque.", exZh: "根據當地傳說,女巫們每逢滿月就會在森林裡聚集舉行巫魔會。" },
    { es: "augurio", gender: "m", plural: "augurios", pos: "n.", zh: "徵兆;預兆", note: "常見搭配 \"buen/mal augurio\"(好/壞兆頭)。", ex: "El cielo encapotado la mañana de la boda fue interpretado por su abuela como un mal augurio.", exZh: "婚禮當天早晨陰沉的天空被她祖母解讀為不祥的預兆。" },
    { es: "brujería", gender: "f", plural: "brujerías", pos: "n.", zh: "巫術", ex: "En algunos pueblos todavía se acusa a ciertas mujeres de practicar brujería.", exZh: "在一些村莊裡,至今仍有女性被指控施行巫術。" },
    { es: "hechicería", gender: "f", plural: "hechicerías", pos: "n.", zh: "巫術;魔法", note: "與 brujería 意思相近,常可互換使用。", ex: "La novela mezcla elementos de hechicería antigua con la vida cotidiana de un pueblo andino.", exZh: "這部小說將古老的巫術元素與安地斯山區村莊的日常生活交織在一起。" },
    { es: "presagio", en: "presage", gender: "m", plural: "presagios", pos: "n.", zh: "預兆;凶兆", ex: "El silencio repentino de los pájaros fue tomado como un presagio de la tormenta.", exZh: "鳥兒突然的沉寂被視為暴風雨即將來臨的預兆。" },
    { es: "talismán", en: "talisman", gender: "m", plural: "talismanes", pos: "n.", zh: "護身符", ex: "Lleva siempre colgado del cuello un pequeño talismán que le regaló su abuela.", exZh: "他脖子上一直掛著祖母送他的一個小護身符。" },
    { es: "cartomancia", en: "cartomancy", gender: "f", pos: "n.", zh: "紙牌占卜術", ex: "La cartomancia consiste en predecir el futuro interpretando las cartas de una baraja.", exZh: "紙牌占卜術是透過解讀牌卡來預測未來。" },
    { es: "astrología", en: "astrology", gender: "f", pos: "n.", zh: "占星學", note: "別與「天文學」astronomía 混淆。", ex: "Aunque la astrología no tiene base científica, mucha gente consulta su horóscopo a diario.", exZh: "雖然占星學沒有科學根據,還是有很多人每天查看自己的星座運勢。" },
    { es: "horóscopo", en: "horoscope", gender: "m", plural: "horóscopos", pos: "n.", zh: "星座運勢;占星圖", ex: "Todas las mañanas lee su horóscopo antes de salir de casa.", exZh: "她每天早上出門前都會先看星座運勢。" },
    { es: "quiromancia", gender: "f", pos: "n.", zh: "手相術", ex: "En quiromancia se supone que las líneas de la mano revelan aspectos del destino de una persona.", exZh: "在手相術中,據說手掌上的紋路能揭示一個人的命運。" },
    { es: "tarot", en: "tarot", gender: "m", plural: "tarots", pos: "n.", zh: "塔羅牌", ex: "La mujer del puesto del mercado ofrece lecturas de tarot por diez euros.", exZh: "市場攤位上的那個女人以十歐元提供塔羅牌解讀服務。" },
    { es: "espiritismo", gender: "m", pos: "n.", zh: "招魂術;通靈術", ex: "El espiritismo se popularizó en el siglo XIX con las sesiones para comunicarse con los muertos.", exZh: "招魂術在十九世紀因與亡者溝通的降靈會而廣為流行。" },
    { es: "mal de ojo", gender: "m", pos: "n.", zh: "惡眼詛咒;邪眼", note: "原始資料 es_raw 為「mal de ojo de」,多了一個雜訊字「de」,已依 en_def(evil eye)修正為固定用語「mal de ojo」(el mal de ojo)。屬固定片語,不使用複數。", ex: "La abuela le puso una pulsera roja al bebé para protegerlo del mal de ojo.", exZh: "祖母給嬰兒戴上一條紅手環,以保護他不受惡眼詛咒。" },
    { es: "conjuro", gender: "m", plural: "conjuros", pos: "n.", zh: "咒語;符咒", ex: "La bruja del cuento pronuncia un conjuro para transformar al príncipe en rana.", exZh: "故事裡的女巫唸出一句咒語,把王子變成了青蛙。" },
    { es: "maldición", gender: "f", plural: "maldiciones", pos: "n.", zh: "詛咒", ex: "Cuenta la leyenda que la familia vive bajo una maldición desde hace generaciones.", exZh: "傳說中,這個家族世世代代都活在一個詛咒之下。" },
    { es: "embrujo", gender: "m", plural: "embrujos", pos: "n.", zh: "魔咒;魅力", note: "字面指「著魔、被下咒」,也常引申比喻某地方或人的迷人魅力,例如 \"el embrujo de la ciudad\"。", ex: "El embrujo de aquella isla hace que muchos turistas quieran quedarse a vivir allí.", exZh: "那座島嶼的迷人魅力讓許多遊客都想留下來定居。" },
    { es: "encantamiento", gender: "m", plural: "encantamientos", pos: "n.", zh: "咒語;魔法", ex: "En la novela, el mago rompe el encantamiento con una sola palabra mágica.", exZh: "在小說裡,那位魔法師只用一個魔法字就解除了咒語。" },
    { es: "poltergeist", en: "poltergeist", gender: "m", plural: "poltergeists", pos: "n.", zh: "騷靈;吵鬧鬼", note: "外來語(源自德文),拼字不變。", ex: "Los vecinos aseguran que en esa casa vieja vive un poltergeist que mueve los objetos por la noche.", exZh: "鄰居們都說那棟老房子裡住著一個會在夜裡移動物品的騷靈。" },
    { es: "médium", en: "medium", gender: "m", plural: "médiums", pos: "n.", zh: "靈媒", note: "通性名詞,依所指人的性別可用 el médium 或 la médium;此處預設陽性。", ex: "El médium afirmó que podía comunicarse con los espíritus de los familiares fallecidos.", exZh: "那位靈媒聲稱自己能與已故親人的靈魂溝通。" },
    { es: "vidente", gender: "m", plural: "videntes", pos: "n.", zh: "通靈者;先知", note: "通性名詞,陰性用法為 la vidente;此處預設陽性。", ex: "La vidente le dijo que pronto recibiría una noticia importante sobre su trabajo.", exZh: "那位通靈者告訴她,她很快就會收到一則關於工作的重要消息。" },
    { es: "embrujar", pos: "v.", zh: "施魔法;使著迷", ex: "La actriz embrujó al público con su interpretación desde el primer minuto.", exZh: "那位女演員從一開始就以她的演出深深迷住了觀眾。" },
    { es: "invocar", en: "invoke", pos: "v.", zh: "召喚;祈求", ex: "En la ceremonia, el chamán invoca a los espíritus de la naturaleza.", exZh: "在儀式中,薩滿會召喚大自然的靈。" },
    { es: "paranormal", en: "paranormal", pos: "adj.", zh: "超自然的;靈異的", ex: "El programa de televisión investiga fenómenos paranormales en casas abandonadas.", exZh: "這個電視節目調查廢棄房屋中的靈異現象。" },
    { es: "sobrenatural", pos: "adj.", zh: "超自然的", ex: "Muchos habitantes del pueblo atribuyen los ruidos nocturnos a causas sobrenaturales.", exZh: "村裡許多居民把夜間的怪聲歸因於超自然的原因。" },
    { es: "claridad", en: "clarity", gender: "f", pos: "n.", zh: "清晰;明亮", note: "亦可表達「說話/思路清楚」之抽象意義。", ex: "A esta hora de la tarde, la claridad del cielo permite ver las montañas a lo lejos.", exZh: "在下午這個時段,天空的明亮讓人可以看到遠處的群山。" },
    { es: "penumbra", en: "penumbra", gender: "f", plural: "penumbras", pos: "n.", zh: "微光;半明半暗", ex: "La habitación quedó en penumbra cuando cerraron las persianas.", exZh: "他們把百葉窗拉上後,房間就變得半明半暗。" },
    { es: "oscuridad", gender: "f", pos: "n.", zh: "黑暗", ex: "Caminaron durante horas en la más completa oscuridad, guiados solo por el sonido del río.", exZh: "他們在一片漆黑中走了好幾個小時,只憑河水的聲音來辨認方向。" },
    { es: "opacidad", en: "opacity", gender: "f", pos: "n.", zh: "不透明;晦澀", ex: "La opacidad del cristal impide ver con claridad lo que hay al otro lado.", exZh: "這塊玻璃的不透明讓人無法清楚看到另一側的情況。" },
    { es: "transparencia", en: "transparency", gender: "f", pos: "n.", zh: "透明;透明度", ex: "El agua del lago tiene tal transparencia que se puede ver el fondo desde la orilla.", exZh: "湖水如此清澈透明,從岸邊就能看見湖底。" },
    { es: "panorama", en: "panorama", gender: "m", plural: "panoramas", pos: "n.", zh: "全景;景象", note: "雖以 -a 結尾,但源自希臘文,為陽性名詞。", ex: "Desde la cima se contempla un panorama espectacular de todo el valle.", exZh: "從山頂可以眺望整個山谷壯觀的全景。" },
    { es: "silueta", gender: "f", plural: "siluetas", pos: "n.", zh: "剪影;輪廓", ex: "Al atardecer, solo se distinguía la silueta de los árboles contra el cielo.", exZh: "黃昏時分,只能看見樹木在天空襯托下的輪廓。" },
    { es: "contraste", en: "contrast", gender: "m", plural: "contrastes", pos: "n.", zh: "對比;反差", ex: "El fotógrafo ajustó el contraste de la imagen para resaltar las sombras.", exZh: "攝影師調整了照片的對比度,以突顯陰影部分。" },
    { es: "resplandor", gender: "m", plural: "resplandores", pos: "n.", zh: "光輝;強光", ex: "El resplandor del sol reflejado en la nieve la obligó a ponerse las gafas de sol.", exZh: "陽光反射在雪地上的強光讓她不得不戴上太陽眼鏡。" },
    { es: "deslumbrar", pos: "v.", zh: "使目眩;使驚艷", note: "字面義為「刺眼、使目眩」,引申可指「令人驚艷、著迷」。", ex: "Los faros del coche que venía de frente lo deslumbraron por un instante.", exZh: "對向來車的頭燈讓他一瞬間眼花目眩。" },
    { es: "borroso", pos: "adj.", zh: "模糊的", ex: "Sin las gafas, todo lo que ve a más de un metro le resulta borroso.", exZh: "沒戴眼鏡的話,他看一公尺以外的東西都很模糊。" },
    { es: "llamativo", pos: "adj.", zh: "顯眼的;引人注目的", ex: "Llevaba un vestido tan llamativo que todos se giraron a mirarla al entrar.", exZh: "她穿的洋裝十分搶眼,以致於她一進門大家都轉頭看她。" },
    { es: "eco", en: "echo", gender: "m", plural: "ecos", pos: "n.", zh: "回聲;迴響", ex: "Gritó su nombre dentro de la cueva y escuchó el eco repetirse varias veces.", exZh: "他在洞穴裡喊了她的名字,聽見回聲重複了好幾次。" },
    { es: "acústica", en: "acoustics", gender: "f", pos: "n.", zh: "音響效果;聲學", ex: "La acústica de esta sala de conciertos es tan buena que no hace falta micrófono.", exZh: "這個音樂廳的音響效果非常好,根本不需要麥克風。" },
    { es: "resonancia", en: "resonance", gender: "f", pos: "n.", zh: "共鳴;迴響", ex: "El violín antiguo tiene una resonancia especial que los instrumentos modernos no logran igualar.", exZh: "這把古老的小提琴擁有現代樂器難以匹敵的獨特共鳴。" },
    { es: "tintineo", gender: "m", plural: "tintineos", pos: "n.", zh: "叮噹聲", ex: "Se despertó con el tintineo de las llaves que su compañero de piso dejaba caer cada mañana.", exZh: "她被室友每天早上掉落鑰匙發出的叮噹聲吵醒。" },
    { es: "cacofonía", en: "cacophony", gender: "f", plural: "cacofonías", pos: "n.", zh: "刺耳雜音;不和諧音", ex: "El tráfico, las obras y las sirenas formaban una auténtica cacofonía en pleno centro.", exZh: "車流、施工聲和警笛聲在市中心交織成一片真正的刺耳雜音。" },
    { es: "rugido", gender: "m", plural: "rugidos", pos: "n.", zh: "吼叫聲;轟鳴聲", ex: "El rugido del león se escuchó desde varios kilómetros de distancia.", exZh: "獅子的吼叫聲從好幾公里外都能聽見。" },
    { es: "crujir", pos: "v.", zh: "發出嘎吱聲", ex: "Las tablas del suelo crujían con cada paso que daba en la casa antigua.", exZh: "他在那棟老房子裡每走一步,地板都會發出嘎吱聲。" },
    { es: "chirriar", pos: "v.", zh: "發出尖銳刺耳聲;吱吱作響", ex: "La puerta del garaje chirría cada vez que la abrimos, así que hay que engrasar las bisagras.", exZh: "每次打開車庫門都會發出尖銳的聲響,所以得幫鉸鏈上油了。" },
    { es: "zumbar", pos: "v.", zh: "嗡嗡作響", ex: "Un mosquito llevaba toda la noche zumbando alrededor de su cabeza.", exZh: "一隻蚊子整晚都在他頭邊嗡嗡地飛。" },
    { es: "retumbar", pos: "v.", zh: "轟鳴;迴盪", ex: "El trueno retumbó con tanta fuerza que las ventanas temblaron.", exZh: "雷聲轟鳴得如此猛烈,連窗戶都震動了。" },
    { es: "murmurar", en: "murmur", pos: "v.", zh: "低聲說;竊竊私語", note: "也可引申指「說閒話、背後議論」。", ex: "Los alumnos empezaron a murmurar entre ellos en cuanto el profesor salió del aula.", exZh: "老師一離開教室,學生們就開始交頭接耳。" },
    { es: "estruendoso", pos: "adj.", zh: "轟隆巨響的;震耳欲聾的", ex: "El público recibió al grupo con un aplauso estruendoso que duró varios minutos.", exZh: "觀眾以持續好幾分鐘的震耳掌聲迎接這個樂團。" },
    { es: "estridente", en: "strident", pos: "adj.", zh: "刺耳的;尖銳的", ex: "El sonido estridente de la alarma hizo que todos salieran corriendo del edificio.", exZh: "那刺耳的警報聲讓所有人都跑出了大樓。" },
    { es: "paladar", en: "palate", gender: "m", plural: "paladares", pos: "n.", zh: "上顎；味覺，品味能力", note: "也可比喻指「品味、鑑賞力」，如 tener buen paladar。", ex: "Después de tantos años catando vinos, ha desarrollado un paladar muy refinado.", exZh: "品酒多年之後，他已經培養出非常精緻的味覺。" },
    { es: "degustación", en: "degustation", gender: "f", plural: "degustaciones", pos: "n.", zh: "品嚐，試吃（試飲）", note: "常見於 menú de degustación（品嚐套餐）。", ex: "El restaurante ofrece un menú de degustación con siete platos distintos.", exZh: "這家餐廳提供一份包含七道不同菜色的品嚐套餐。" },
    { es: "regusto", gender: "m", plural: "regustos", pos: "n.", zh: "餘味，回味（嘴裡留下的味道，也可比喻事後留下的感覺）", note: "常搭配 amargo 等形容詞使用，亦可比喻抽象的「餘韻」。", ex: "El café tenía un regusto amargo que se quedó en la boca varios minutos.", exZh: "這杯咖啡帶有苦澀的餘味，在嘴裡留了好幾分鐘。" },
    { es: "degustar", pos: "v.", zh: "品嚐，細細品味", note: "比 probar 更正式、更強調專業或講究的品嚐方式。", ex: "Nos invitaron a degustar los platos típicos de la región antes de elegir el menú.", exZh: "他們邀請我們在選菜單之前先品嚐這個地區的傳統菜餚。" },
    { es: "catar", pos: "v.", zh: "品嚐，試飲（尤指專業評鑑，如品酒）", note: "常用於 catar vino 等專業品評語境。", ex: "Un sumiller profesional cata decenas de vinos cada semana para evaluar su calidad.", exZh: "一位專業侍酒師每週要試飲數十款葡萄酒以評估品質。" },
    { es: "empalagoso", pos: "adj.", zh: "（甜得）膩人的，過於甜膩的", note: "亦可比喻用來形容人「過分殷勤、肉麻」。", ex: "El pastel estaba tan empalagoso que no pude terminarme ni un trozo.", exZh: "這個蛋糕甜得太膩了，我連一塊都吃不完。" },
    { es: "especiado", pos: "adj.", zh: "加了香料的，辛香的", ex: "El cordero especiado con comino y canela es uno de los platos estrella del restaurante.", exZh: "用孜然和肉桂調味的辛香羊肉是這家餐廳的招牌菜之一。" },
    { es: "umami", en: "umami", pos: "adj.", zh: "鮮味的，旨味的（第五種基本味覺）", note: "源自日文，西班牙文中也常直接當名詞使用，如 el umami。", ex: "Los champiñones y la salsa de soja aportan ese toque umami tan característico.", exZh: "蘑菇和醬油帶來那種很有特色的鮮味。" },
    { es: "avinagrado", pos: "adj.", zh: "帶醋味的，酸味的（也可比喻形容人「臭臉、乖戾」）", ex: "El vino se había estropeado y tenía un sabor avinagrado desagradable.", exZh: "這瓶酒已經變質了，帶著令人不悅的酸醋味。" },
    { es: "astringente", en: "astringent", pos: "adj.", zh: "澀的，收斂性的", ex: "Los caquis verdes tienen un sabor astringente que hace que se te seque la boca.", exZh: "未熟的柿子帶有澀味，會讓人覺得嘴巴發乾。" },
    { es: "agridulce", pos: "adj.", zh: "酸甜的；（比喻）苦樂參半的", note: "常用來形容食物，也常比喻描述情緒或回憶「五味雜陳」。", ex: "El regreso a su antiguo barrio le dejó una sensación agridulce.", exZh: "回到以前住的社區讓他心裡有種苦樂參半的感覺。" },
    { es: "olfato", gender: "m", pos: "n.", zh: "嗅覺", note: "通常不加複數；也常比喻指「敏銳的直覺」，如 tener buen olfato para los negocios。", ex: "Los perros tienen un olfato mucho más desarrollado que el de los humanos.", exZh: "狗的嗅覺比人類發達得多。" },
    { es: "aroma", en: "aroma", gender: "m", plural: "aromas", pos: "n.", zh: "香氣，香味", note: "雖以 -a 結尾，卻是陽性名詞（el aroma），為常見例外。", ex: "Al entrar en la panadería, un aroma a pan recién horneado invadió todo el local.", exZh: "一走進麵包店，剛出爐麵包的香氣就瀰漫了整間店。" },
    { es: "fragancia", en: "fragrance", gender: "f", plural: "fragancias", pos: "n.", zh: "香味，香氛（尤指令人愉悅的香氣，也指香水）", ex: "Esta fragancia tiene notas florales que recuerdan al jazmín.", exZh: "這款香水帶有讓人聯想到茉莉花的花香調。" },
    { es: "tufo", gender: "m", plural: "tufos", pos: "n.", zh: "臭味，惡臭（強烈難聞的氣味）", note: "也可口語比喻指「可疑的跡象、味道」，如 me da tufo a mentira。", ex: "Al abrir la nevera, salió un tufo insoportable a comida podrida.", exZh: "一打開冰箱，就飄出一股令人受不了的腐爛食物臭味。" },
    { es: "aromático", en: "aromatic", pos: "adj.", zh: "芳香的，香氣濃郁的", ex: "Añadió unas hierbas aromáticas al guiso para darle más sabor.", exZh: "他在燉菜裡加了些香草來增添風味。" },
    { es: "rancio", en: "rancid", pos: "adj.", zh: "（油脂等）酸敗的，走味的；（比喻）陳腐的，老掉牙的", note: "也常比喻形容思想或風氣「陳腐守舊」。", ex: "El aceite llevaba tanto tiempo abierto que ya sabía rancio.", exZh: "那瓶油開封太久了，已經有酸敗味了。" },
    { es: "acre", pos: "adj.", zh: "辛辣刺鼻的，嗆人的（氣味或味道）", note: "英文的 acre 是面積單位（英畝），意思完全不同，是典型的 false friend，切勿混淆。", ex: "El humo del tubo de escape dejó un olor acre en toda la calle.", exZh: "排氣管冒出的煙在整條街留下一股嗆鼻的味道。" },
    { es: "maloliente", pos: "adj.", zh: "臭的，難聞的", ex: "El contenedor de basura llevaba días sin vaciarse y estaba maloliente.", exZh: "那個垃圾桶好幾天沒清了，發出陣陣臭味。" },
    { es: "pútrido", en: "putrid", pos: "adj.", zh: "腐爛的，腐臭的", ex: "El cadáver del animal desprendía un olor pútrido que se sentía desde lejos.", exZh: "那隻動物的屍體散發出腐臭味，老遠就聞得到。" },
    { es: "fétido", en: "fetid", pos: "adj.", zh: "惡臭的，腥臭的", ex: "Las aguas estancadas del canal despedían un vapor fétido.", exZh: "運河裡的死水散發出一股惡臭的氣息。" },
    { es: "oler", pos: "v.", zh: "聞，聞起來", note: "不規則動詞（huelo, hueles...），字首加 h。", ex: "Esta habitación huele a cerrado, deberíamos abrir la ventana.", exZh: "這個房間有股悶味，我們應該開窗透透氣。" },
    { es: "imprudencia", en: "imprudence", gender: "f", plural: "imprudencias", pos: "n.", zh: "輕率，魯莽，不謹慎（的行為）", ex: "Conducir sin cinturón de seguridad fue una imprudencia que pudo costarle caro.", exZh: "沒繫安全帶開車是很魯莽的行為，可能讓他付出慘痛代價。" },
    { es: "osadía", gender: "f", plural: "osadías", pos: "n.", zh: "大膽，膽識（有時含冒失、放肆之意）", note: "語境可正面（勇氣）也可負面（放肆），視上下文而定。", ex: "Tuvo la osadía de criticar al jefe delante de todo el equipo.", exZh: "他竟然大膽到在全體同事面前批評老闆。" },
    { es: "aventurero", en: "adventurer", gender: "m", plural: "aventureros", pos: "n.", zh: "冒險家，喜好冒險的人", note: "陰性為 aventurera；也可作形容詞使用，意為「愛冒險的」。", ex: "De joven fue un aventurero que recorrió medio mundo en bicicleta.", exZh: "他年輕時是個冒險家，騎腳踏車環遊了半個世界。" },
    { es: "atreverse", pos: "v.", zh: "敢於，鼓起勇氣（做某事）", note: "反身動詞，常搭配 a + 原形動詞，如 atreverse a hablar。", ex: "Nadie se atrevió a decirle la verdad al director.", exZh: "沒有人敢跟主任說出實話。" },
    { es: "osar", pos: "v.", zh: "敢於，膽敢", note: "比 atreverse 更書面、更文學性，口語較少用。", ex: "Pocos periodistas osaban investigar la corrupción del régimen.", exZh: "很少有記者敢去調查該政權的貪腐問題。" },
    { es: "arriesgar", pos: "v.", zh: "冒（風險），使處於危險之中", note: "反身形式 arriesgarse 表示「冒險去做」。", ex: "El bombero arriesgó su vida para sacar al niño del edificio en llamas.", exZh: "消防員冒著生命危險把孩子從燃燒的大樓裡救出來。" },
    { es: "rescatar", pos: "v.", zh: "營救，救援；搶救（資料等）", ex: "Los equipos de salvamento lograron rescatar a los excursionistas atrapados por la nieve.", exZh: "救援隊成功救出了被大雪困住的登山客。" },
    { es: "poner en peligro", pos: "loc.", zh: "使陷入危險，危及", note: "原始資料 es_raw 為「poner en peligro en」，結尾多了一個因 PDF 擷取產生的重複字 en，已修正為標準片語 poner en peligro。", ex: "Fumar dentro de la gasolinera puso en peligro la vida de todos los presentes.", exZh: "在加油站裡抽菸危及了在場所有人的生命安全。" },
    { es: "intrépido", en: "intrepid", pos: "adj.", zh: "無畏的，勇敢的", ex: "La intrépida periodista viajó sola a la zona de conflicto para cubrir la noticia.", exZh: "這位無畏的記者獨自前往衝突地區採訪報導。" },
    { es: "precario", en: "precarious", pos: "adj.", zh: "不穩定的，岌岌可危的（尤指經濟或工作狀況）", ex: "Muchos jóvenes tienen que aceptar empleos precarios por falta de otras opciones.", exZh: "許多年輕人因為別無選擇，只好接受不穩定的工作。" },
    { es: "razón", gender: "f", plural: "razones", pos: "n.", zh: "原因，理由；理性，道理", note: "以 -ón 結尾卻是陰性名詞，常見例外。", ex: "Nunca nos explicó la razón por la que dejó el trabajo tan de repente.", exZh: "他從來沒解釋過自己為什麼突然辭掉工作的原因。" },
    { es: "motivo", en: "motive", gender: "m", plural: "motivos", pos: "n.", zh: "動機，原因", ex: "La policía todavía no ha determinado el motivo del incendio.", exZh: "警方目前還沒查明這場火災的起火原因。" },
    { es: "fundamento", gender: "m", plural: "fundamentos", pos: "n.", zh: "根據，依據；基礎", ex: "Sus acusaciones no tienen ningún fundamento sólido.", exZh: "他的指控完全沒有任何確切的根據。" },
    { es: "resultado", en: "result", gender: "m", plural: "resultados", pos: "n.", zh: "結果，成果", ex: "Los resultados del examen se publicarán la próxima semana.", exZh: "考試結果將於下週公布。" },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function chunkStages(words) {
  const stages = [];
  for (let i = 0; i < words.length; i += STAGE_SIZE) {
    stages.push({ index: stages.length, words: words.slice(i, i + STAGE_SIZE) });
  }
  return stages;
}

function chunkChapters(stages) {
  const chapters = [];
  for (let i = 0; i < stages.length; i += CHAPTERS_STAGE_COUNT) {
    const stageSlice = stages.slice(i, i + CHAPTERS_STAGE_COUNT);
    const firstWordNum = i * STAGE_SIZE + 1;
    const lastWordNum = i * STAGE_SIZE + stageSlice.reduce((n, s) => n + s.words.length, 0);
    chapters.push({ index: chapters.length, stages: stageSlice, range: `${firstWordNum}-${lastWordNum}` });
  }
  return chapters;
}

function normalizeEs(str) {
  return str
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

// Some entries store alternate forms in one field, e.g. "tío / tía" or
// "cabrón/a". Accept a match against the full string OR any "/"-separated
// piece, so users aren't forced to type the exact combined notation.
// Accents are already stripped by normalizeEs, so plain English-keyboard
// typing (e.g. "nino" for "niño") is accepted automatically.
function checkSpellingAnswer(input, target) {
  const normInput = normalizeEs(input);
  if (!target.includes("/")) {
    return normInput === normalizeEs(target);
  }
  const variants = target.split("/").map((piece) => normalizeEs(piece));
  const noSlash = normalizeEs(target.replace(/\//g, ""));
  return variants.includes(normInput) || normInput === normalizeEs(target) || normInput === noSlash;
}

function masteryTier(bestAccuracy) {
  if (bestAccuracy == null) return { label: "尚未挑戰", stars: 0, color: "#A99B85" };
  if (bestAccuracy >= 100) return { label: "精通", stars: 3, color: "#D4A24C" };

  if (bestAccuracy >= 50) return { label: "略熟", stars: 2, color: "#B98A2E" };
  return { label: "尚未熟悉", stars: 1, color: "#A13A2F" };
}
