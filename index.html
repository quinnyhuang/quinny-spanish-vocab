    { es: "velamen", gender: "m", pos: "n.", zh: "(船的)帆;帆具", ex: "Con el velamen completamente desplegado, el barco alcanzó una velocidad sorprendente.", exZh: "帆全部展開後,這艘船的航速快得驚人。" },
    { es: "encallar", pos: "v.", zh: "(船隻)擱淺", note: "原始資料詞性標為 (n.),已依語意更正為動詞。", ex: "El buque encalló en un banco de arena cerca de la costa y tardaron horas en reflotarlo.", exZh: "那艘船在近岸的沙洲擱淺,花了好幾個小時才把它救起。" },
    { es: "ferrocarril", gender: "m", plural: "ferrocarriles", pos: "n.", zh: "鐵路;鐵道", ex: "La construcción del ferrocarril transformó por completo la economía de la región en el siglo XIX.", exZh: "鐵路的興建在十九世紀徹底改變了這個地區的經濟。" },
    { es: "vagón", gender: "m", plural: "vagones", pos: "n.", zh: "(火車)車廂", ex: "Subimos al último vagón porque estaba mucho menos abarrotado que los demás.", exZh: "我們上了最後一節車廂,因為那裡比其他車廂空得多。" },
    { es: "expreso", en: "express", pos: "adj.", zh: "快速的;特快的", note: "常見於「tren expreso」(快車)或「correo expreso」(快遞)。", ex: "Tomamos el tren expreso para llegar a la capital en poco más de una hora.", exZh: "我們搭快車,只花了一個多小時就抵達首都。" },
    { es: "descarrilar", pos: "v.", zh: "(火車)出軌", note: "原始資料詞性標為 (n.),已依語意更正為動詞。", ex: "El tren descarriló a las afueras de la ciudad, aunque por suerte no hubo heridos graves.", exZh: "火車在市郊出軌,所幸沒有造成重傷。" },
    { es: "desplazar", pos: "v.", zh: "滾動(頁面);移動,位移", note: "科技語境中常指螢幕的「滑動/捲動」(desplazar la pantalla hacia abajo)。", ex: "Desplaza la pantalla hacia abajo para ver los comentarios más recientes.", exZh: "把畫面往下捲動,就能看到最新的留言。" },
    { es: "cliquear", en: "to click", pos: "v.", zh: "點擊", note: "源自英語 click 的西語化說法,口語常用;正式書面語多用「hacer clic」。", ex: "Solo tienes que cliquear en el ícono para abrir la aplicación.", exZh: "你只要點擊那個圖示就能打開應用程式。" },
    { es: "reinicializar", en: "to reinitialize", pos: "v.", zh: "重新啟動;重設", ex: "Si el sistema sigue fallando, tendrás que reinicializarlo desde la configuración de fábrica.", exZh: "如果系統還是持續出錯,你就得把它恢復原廠設定重新啟動。" },
    { es: "hackear", en: "to hack", pos: "v.", zh: "駭入;入侵(電腦系統)", ex: "Un grupo de ciberdelincuentes logró hackear la base de datos de la empresa y robar información de los clientes.", exZh: "一群網路犯罪份子成功駭入該公司的資料庫,竊取了客戶資料。" },
    { es: "guglear", en: "to Google", pos: "v.", zh: "用谷歌搜尋;估狗", note: "口語用法,亦可拼作「googlear」。", ex: "Antes de la entrevista, gugleó el nombre de la empresa para informarse sobre su historia.", exZh: "面試前,她先估狗了那家公司的名字,以了解它的歷史。" },
    { es: "PIN", en: "PIN", gender: "m", plural: "pines", pos: "n.", zh: "個人識別碼", ex: "Olvidó el PIN de la tarjeta y tuvo que solicitar uno nuevo en el banco.", exZh: "他忘記了信用卡的個人識別碼,只好到銀行申請新的。" },
    { es: "bug", en: "bug", gender: "m", plural: "bugs", pos: "n.", zh: "(軟體)錯誤,漏洞", note: "英語借詞;西語中也可用「error」或「fallo」表達同義。", ex: "Los desarrolladores pasaron toda la noche corrigiendo un bug crítico antes del lanzamiento.", exZh: "開發人員徹夜修正一個嚴重的漏洞,才趕上發布時間。" },
    { es: "cookie", en: "cookie", gender: "f", plural: "cookies", pos: "n.", zh: "(網路)小型文字檔;瀏覽器紀錄檔", note: "科技用語中「cookie」為陰性(la cookie)。", ex: "El sitio web te pide aceptar las cookies antes de poder navegar por su contenido.", exZh: "這個網站會要求你先接受 cookie,才能瀏覽其內容。" },
    { es: "interfaz", en: "interface", gender: "f", plural: "interfaces", pos: "n.", zh: "介面", note: "雖以子音結尾,但為陰性名詞(la interfaz)。", ex: "La nueva interfaz de la aplicación es mucho más intuitiva que la versión anterior.", exZh: "這個應用程式的新介面比舊版本直覺許多。" },
    { es: "servidor", en: "server", gender: "m", plural: "servidores", pos: "n.", zh: "伺服器", ex: "El servidor se cayó durante unos minutos y muchos usuarios no pudieron acceder a sus cuentas.", exZh: "伺服器當機了幾分鐘,許多使用者因此無法登入自己的帳號。" },
    { es: "inteligencia artificial", en: "artificial intelligence", gender: "f", pos: "n.", zh: "人工智慧", ex: "Cada vez más empresas utilizan inteligencia artificial para analizar el comportamiento de sus clientes.", exZh: "越來越多企業運用人工智慧來分析顧客的行為。" },
    { es: "pantalla táctil", gender: "f", plural: "pantallas táctiles", pos: "n.", zh: "觸控螢幕", ex: "El nuevo microondas tiene una pantalla táctil que resulta bastante confusa al principio.", exZh: "這台新微波爐配有觸控螢幕,一開始用起來相當令人困惑。" },
    { es: "wifi", en: "Wi-Fi", gender: "m", pos: "n.", zh: "無線網路", ex: "La cafetería ofrece wifi gratuito, pero la conexión suele ser bastante lenta a mediodía.", exZh: "這家咖啡館提供免費無線網路,不過中午時段連線通常相當慢。" },
    { es: "consola", en: "console", gender: "f", plural: "consolas", pos: "n.", zh: "(電玩)主機;控制台", ex: "Le regalaron una consola de videojuegos por su cumpleaños y no ha dejado de jugar desde entonces.", exZh: "他生日時收到一台電玩主機,從那之後就玩個不停。" },
    { es: "sitio web", gender: "m", plural: "sitios web", pos: "n.", zh: "網站", ex: "Rediseñaron por completo el sitio web de la universidad para hacerlo más accesible desde el móvil.", exZh: "他們徹底重新設計了大學的網站,讓它在手機上更容易瀏覽使用。" },
    { es: "base de datos", gender: "f", plural: "bases de datos", pos: "n.", zh: "資料庫", note: "原始資料含多餘的「de」(base de datos de),已修正為「base de datos」。", ex: "El equipo de informática migró toda la base de datos a un nuevo servidor en la nube.", exZh: "資訊團隊將整個資料庫遷移到雲端的新伺服器上。" },
    { es: "inalámbrico", pos: "adj.", zh: "無線的", ex: "Compró unos auriculares inalámbricos para poder hacer ejercicio sin cables enredados.", exZh: "她買了一副無線耳機,運動時就不會被電線纏住。" },
    { es: "virtual", en: "virtual", pos: "adj.", zh: "虛擬的", ex: "La empresa organizó una feria virtual para presentar sus productos a clientes de todo el mundo.", exZh: "公司舉辦了一場虛擬展覽,向全球各地的客戶介紹產品。" },
    { es: "corteza", gender: "f", plural: "cortezas", pos: "n.", zh: "樹皮;(麵包)外皮;(大腦)皮質", note: "除了樹皮之外,也可指麵包的外皮(corteza de pan)或大腦皮質(corteza cerebral)。", ex: "La corteza de este árbol es tan gruesa que protege el tronco de las heladas más intensas.", exZh: "這棵樹的樹皮如此厚實,足以保護樹幹免受最嚴寒的傷害。" },
    { es: "polen", en: "pollen", gender: "m", pos: "n.", zh: "花粉", ex: "La primavera trae consigo una nube de polen que hace estornudar a media ciudad.", exZh: "春天帶來了漫天花粉,讓半座城市的人都打噴嚏。" },
    { es: "mata", gender: "f", plural: "matas", pos: "n.", zh: "灌木;植株", ex: "Detrás de la casa había una mata de tomates que mi abuela cuidaba con esmero.", exZh: "屋子後面有一叢番茄植株,是我祖母細心照料的。" },
    { es: "musgo", gender: "m", pos: "n.", zh: "苔蘚", ex: "Las piedras del sendero estaban cubiertas de musgo, resbaladizas tras la lluvia.", exZh: "小徑上的石頭覆滿了苔蘚,雨後顯得格外濕滑。" },
    { es: "hiedra", gender: "f", plural: "hiedras", pos: "n.", zh: "常春藤", ex: "La fachada de piedra estaba cubierta de hiedra, dándole un aire romántico y abandonado.", exZh: "石造外牆爬滿了常春藤,顯得浪漫又帶點荒廢的氣息。" },
    { es: "bambú", en: "bamboo", gender: "m", plural: "bambúes", pos: "n.", zh: "竹子", ex: "Construyeron la cabaña con cañas de bambú traídas desde el sudeste asiático.", exZh: "他們用從東南亞運來的竹竿搭建了這間小屋。" },
    { es: "polinización", en: "pollination", gender: "f", pos: "n.", zh: "授粉(作用)", ex: "Sin la polinización que realizan las abejas, muchos cultivos no producirían fruto alguno.", exZh: "若沒有蜜蜂進行授粉,許多作物根本無法結出果實。" },
    { es: "savia", gender: "f", pos: "n.", zh: "樹液;(喻)活力,生命力", note: "常用於比喻,指注入新的活力,如 'savia nueva'(新血、新氣象)。", ex: "En primavera, la savia empieza a subir por el tronco y despierta a todo el árbol.", exZh: "到了春天,樹液開始沿著樹幹上升,喚醒整棵樹的生機。" },
    { es: "cascarilla", gender: "f", plural: "cascarillas", pos: "n.", zh: "外殼;麩皮", ex: "Antes de tostar el café, hay que retirar la cascarilla que envuelve cada grano.", exZh: "烘焙咖啡豆之前,必須先去除包裹著每顆豆子的外殼。" },
    { es: "capullo", gender: "m", plural: "capullos", pos: "n.", zh: "花苞;(昆蟲的)繭", note: "在西班牙口語中,'capullo' 也常被用作粗俗的罵人話(意近『笨蛋』),但作為植物詞彙時指花苞或繭。", ex: "Los primeros capullos empezaron a abrirse en cuanto llegó el buen tiempo.", exZh: "天氣一轉好,最初的花苞就開始綻放了。" },
    { es: "pétalo", en: "petal", gender: "m", plural: "pétalos", pos: "n.", zh: "花瓣", ex: "Deshojó la margarita pétalo a pétalo mientras esperaba una respuesta que nunca llegó.", exZh: "她一片一片地摘下雛菊花瓣,等待著一個始終沒有到來的答案。" },
    { es: "espina", gender: "f", plural: "espinas", pos: "n.", zh: "刺;(魚)骨刺", note: "注意與『脊椎』(columna vertebral)區分,'espina dorsal' 才是脊椎的意思。", ex: "Se clavó una espina de rosal en el dedo y tuvo que sacarla con unas pinzas.", exZh: "他被玫瑰花刺扎進了手指,只好用鑷子把刺拔出來。" },
    { es: "diente de león", gender: "m", plural: "dientes de león", pos: "n.", zh: "蒲公英", ex: "Los niños soplaban los dientes de león y veían las semillas volar con el viento.", exZh: "孩子們吹著蒲公英,看著種子隨風飛散。" },
    { es: "mala hierba", gender: "f", plural: "malas hierbas", pos: "n.", zh: "雜草", ex: "Si no arrancas la mala hierba a tiempo, acaba invadiendo todo el jardín.", exZh: "如果不及時拔除雜草,它們最後會佔滿整個花園。" },
    { es: "autóctono", pos: "adj.", zh: "本土的;原生的,土著的", note: "比 'nativo' 或 'indígena' 更正式,常用於生物學或人類學語境。", ex: "Las autoridades promueven el uso de especies autóctonas en los nuevos parques urbanos.", exZh: "當局大力推廣在新建的城市公園中使用本土原生物種。" },
    { es: "manantial", gender: "m", plural: "manantiales", pos: "n.", zh: "泉源;湧泉", ex: "Subieron hasta el manantial para llenar sus cantimploras con agua fresca de montaña.", exZh: "他們爬到泉源處,用清涼的山泉水裝滿水壺。" },
    { es: "estanque", gender: "m", plural: "estanques", pos: "n.", zh: "池塘", ex: "Los patos nadaban tranquilamente en el estanque del parque mientras los niños los observaban.", exZh: "鴨子在公園的池塘裡悠然游泳,孩子們則在一旁觀看。" },
    { es: "ribera", gender: "f", plural: "riberas", pos: "n.", zh: "河岸;水濱", note: "特指河流或溪流沿岸的土地,比泛指任何水域邊緣的 'orilla' 更具體。", ex: "Pasearon al atardecer por la ribera del río, disfrutando de la brisa fresca.", exZh: "他們在傍晚沿著河岸散步,享受著涼爽的微風。" },
    { es: "arrecife", gender: "m", plural: "arrecifes", pos: "n.", zh: "礁;暗礁", ex: "El arrecife de coral que rodea la isla atrae a buceadores de todo el mundo.", exZh: "環繞這座島嶼的珊瑚礁吸引了世界各地的潛水愛好者。" },
    { es: "fauna", en: "fauna", gender: "f", pos: "n.", zh: "動物群;動物相", ex: "El parque nacional protege una fauna variada que incluye especies en peligro de extinción.", exZh: "這座國家公園保護著多樣的動物群,其中包括瀕臨絕種的物種。" },
    { es: "flora", en: "flora", gender: "f", pos: "n.", zh: "植物群;植物相", ex: "La flora de esta región cambia drásticamente según la altitud.", exZh: "這個地區的植物群會隨著海拔高度的不同而產生劇烈變化。" },
    { es: "lacio", pos: "adj.", zh: "(頭髮)柔順平直的;萎軟無力的", note: "最常用來形容毫無捲曲、蓬鬆感的直髮(pelo lacio),也可指植物或姿態的萎靡無力。", ex: "Tiene el pelo lacio y muy fino, así que casi nunca le dura el peinado.", exZh: "她的頭髮又直又細軟,所以髮型幾乎撐不了多久。" },
    { es: "amanecer", gender: "m", plural: "amaneceres", pos: "n.", zh: "黎明;日出", note: "同形也是動詞,意為『天亮』或『(在某處)醒來』,例如 'amanecimos en la playa'。", ex: "Madrugaron para contemplar el amanecer desde la cima de la montaña.", exZh: "他們起了大早,為的是從山頂欣賞日出。" },
    { es: "ocaso", gender: "m", plural: "ocasos", pos: "n.", zh: "日落;(喻)衰落,末期", note: "除了字面的日落之外,也常用於比喻某事物的衰亡期,如 'el ocaso de un imperio'。", ex: "El ocaso teñía el cielo de naranja mientras los pescadores regresaban al puerto.", exZh: "落日將天空染成橙色,漁夫們正返回港口。" },
    { es: "correa", gender: "f", plural: "correas", pos: "n.", zh: "(皮)帶;牽繩", ex: "Antes de sacar al perro, le puso la correa y comprobó que estuviera bien sujeta.", exZh: "帶狗出門前,她先幫牠繫上牽繩,並確認扣得牢固。" },
    { es: "jaula", gender: "f", plural: "jaulas", pos: "n.", zh: "籠子", ex: "El loro llevaba tanto tiempo en la jaula que ya ni intentaba volar cuando la abrían.", exZh: "那隻鸚鵡待在籠子裡太久了,即使籠門打開牠也不再嘗試飛走。" },
    { es: "ladrido", gender: "m", plural: "ladridos", pos: "n.", zh: "(狗的)吠叫聲", ex: "Los ladridos del perro despertaron a todo el vecindario a las tres de la madrugada.", exZh: "狗的吠叫聲在凌晨三點吵醒了整個社區。" },
    { es: "miau", en: "meow", gender: "m", plural: "miaus", pos: "n.", zh: "喵(貓叫聲)", ex: "El gatito soltó un miau lastimero desde debajo de la cama.", exZh: "小貓從床底下發出一聲可憐兮兮的喵叫。" },
    { es: "abatir", pos: "v.", zh: "擊落;打倒;使沮喪", note: "反身形式 'abatirse' 常用來表示『情緒低落、意志消沉』。", ex: "La noticia de su despido lo abatió por completo durante varias semanas.", exZh: "被解僱的消息讓他整整消沉了好幾個星期。" },
    { es: "acariciar", pos: "v.", zh: "撫摸;愛撫", ex: "Le gustaba acariciar al gato mientras leía el periódico por las mañanas.", exZh: "她喜歡在早上看報紙時順手撫摸貓咪。" },
    { es: "ronronear", pos: "v.", zh: "(貓)發出呼嚕聲", ex: "El gato se acurrucó en su regazo y empezó a ronronear suavemente.", exZh: "貓咪蜷縮在她的腿上,輕輕地發出呼嚕聲。" },
    { es: "castrar", en: "castrate", pos: "v.", zh: "閹割", ex: "El veterinario recomendó castrar al gato antes de que cumpliera un año.", exZh: "獸醫建議在貓咪滿一歲之前為牠進行閹割。" },
    { es: "capar", pos: "v.", zh: "閹割(較口語、鄉土用語)", note: "'castrar' 的口語同義詞,常見於農村或養殖語境。", ex: "En el pueblo todavía se capa a los cerdos siguiendo el método tradicional.", exZh: "在這個村莊,人們仍依照傳統方法閹割豬隻。" },
    { es: "esterilizar", en: "sterilize", pos: "v.", zh: "絕育;消毒", ex: "Es recomendable esterilizar a las mascotas para controlar la población de animales callejeros.", exZh: "建議為寵物絕育,以控制流浪動物的數量。" },
    { es: "domar", pos: "v.", zh: "馴服", ex: "Se necesita mucha paciencia para domar a un caballo salvaje.", exZh: "要馴服一匹野馬需要極大的耐心。" },
    { es: "morder", pos: "v.", zh: "咬", ex: "El perro mordió al cartero y ahora los vecinos evitan pasar por esa casa.", exZh: "那隻狗咬了郵差,現在鄰居們都避免經過那棟房子。" },
    { es: "posar", pos: "v.", zh: "棲息;放下,靠著;(為照片)擺姿勢", note: "除了本義的『棲息』或『放下』之外,'posar' 也常指擺姿勢拍照(posar para una foto)。", ex: "El halcón se posó en la rama más alta del árbol y observó el valle.", exZh: "那隻獵鷹棲息在樹的最高枝頭上,俯瞰著山谷。" },
    { es: "galopar", en: "gallop", pos: "v.", zh: "疾馳;奔騰", ex: "Los caballos galopaban libremente por la pradera al amanecer.", exZh: "黎明時分,馬群在草原上自由地奔騰。" },
    { es: "dar de comer a", pos: "v.", zh: "餵(食)", note: "固定搭配用介系詞 'a',而非 'de':'dar de comer a los animales'。", ex: "Cada tarde, los niños se turnan para dar de comer a los peces del estanque.", exZh: "每天下午,孩子們輪流餵池塘裡的魚。" },
    { es: "erizar", pos: "v.", zh: "使(毛髮、羽毛)豎立;使緊張", note: "常以反身形式 'erizarse' 出現,指毛髮或羽毛因驚恐、寒冷而豎起。", ex: "El gato erizó el lomo en cuanto vio al perro entrar en el jardín.", exZh: "貓一看到狗進入花園,背上的毛就豎了起來。" },
    { es: "rabioso", en: "rabid", pos: "adj.", zh: "患狂犬病的;狂怒的", note: "既可指字面上『患有狂犬病的』,也常用於比喻『極度憤怒的』。", ex: "El perro rabioso mordió a dos personas antes de que lograran controlarlo.", exZh: "那隻患有狂犬病的狗在被制伏之前咬傷了兩個人。" },
    { es: "feroz", en: "ferocious", pos: "adj.", zh: "兇猛的;殘暴的", ex: "El tigre es conocido por ser uno de los depredadores más feroces del planeta.", exZh: "老虎以是地球上最兇猛的掠食者之一而聞名。" },
    { es: "fiero", pos: "adj.", zh: "兇猛的;(拉美口語)醜的", note: "在墨西哥、阿根廷等多個拉美國家,'fiero' 口語中也常用來表示『醜』(feo)。", ex: "El toro se puso fiero en cuanto sintió la capa roja del torero.", exZh: "那頭公牛一感受到鬥牛士的紅布,立刻變得兇猛起來。" },
    { es: "salvaje", en: "savage", pos: "adj.", zh: "野生的;野蠻的", ex: "Todavía quedan zonas de bosque salvaje donde el hombre apenas ha puesto un pie.", exZh: "仍有一些原始野生林地是人類幾乎未曾踏足的。" },
    { es: "dócil", en: "docile", pos: "adj.", zh: "溫馴的;聽話的", ex: "A pesar de su tamaño, el mastín resultó ser un perro sorprendentemente dócil.", exZh: "儘管體型龐大,這隻獒犬卻出乎意料地溫馴。" },
    { es: "manso", pos: "adj.", zh: "溫順的;馴服的", ex: "El burro era tan manso que hasta los niños más pequeños podían montarlo sin miedo.", exZh: "這頭驢子非常溫順,連年紀最小的孩子都能毫無畏懼地騎上去。" },
    { es: "domesticado", en: "domesticated", pos: "adj.", zh: "馴化的;家養的", ex: "Aunque parezca domesticado, un lobo nunca perderá del todo su instinto salvaje.", exZh: "即使看似已被馴化,狼永遠不會完全失去牠的野性本能。" },
    { es: "canino", en: "canine", pos: "adj.", zh: "犬的;犬科的", ex: "La clínica veterinaria se especializa en el cuidado dental canino.", exZh: "這家獸醫診所專門提供犬類的牙齒護理。" },
    { es: "felino", en: "feline", pos: "adj.", zh: "貓的;貓科的", ex: "Sus movimientos ágiles y silenciosos tenían algo claramente felino.", exZh: "他敏捷而無聲的動作,帶著一種明顯的貓科氣質。" },
    { es: "chaparrón", gender: "m", plural: "chaparrones", pos: "n.", zh: "驟雨；陣雨", note: "多指突然而猛烈、持續時間短的雨，常用於口語。", ex: "Salimos sin paraguas y nos pilló un chaparrón a mitad de camino.", exZh: "我們沒帶傘就出門了，結果走到一半被一陣驟雨淋濕。" },
    { es: "chubasco", gender: "m", plural: "chubascos", pos: "n.", zh: "陣雨；驟雨（常伴有陣風，尤指海上）", note: "常見於天氣預報，尤其描述短暫且不穩定的降雨。", ex: "El parte meteorológico anuncia chubascos intermitentes durante toda la tarde.", exZh: "氣象預報指出整個下午都會有斷斷續續的陣雨。" },
    { es: "diluvio", gender: "m", plural: "diluvios", pos: "n.", zh: "大洪水；豪雨；（引申）大量湧入", note: "常用於誇張表達，如「diluvio de críticas」（如潮水般的批評）。", ex: "Aquel diluvio dejó varias calles del centro completamente inundadas.", exZh: "那場大暴雨讓市中心好幾條街道全都淹水了。" },
    { es: "ráfaga", gender: "f", plural: "ráfagas", pos: "n.", zh: "陣風；一陣（光、聲音等）；（槍）連發", ex: "Una ráfaga de viento derribó las sombrillas de la terraza en cuestión de segundos.", exZh: "一陣強風幾秒鐘內就把露台上的陽傘吹倒了。" },
    { es: "ciclón", en: "cyclone", gender: "m", plural: "ciclones", pos: "n.", zh: "氣旋；颶風", ex: "El ciclón tropical obligó a evacuar a miles de habitantes de la costa.", exZh: "這場熱帶氣旋迫使數千名沿海居民撤離。" },
    { es: "monzón", en: "monsoon", gender: "m", plural: "monzones", pos: "n.", zh: "季風", ex: "El monzón de verano trae lluvias torrenciales a gran parte del sur de Asia.", exZh: "夏季季風為南亞大部分地區帶來滂沱大雨。" },
    { es: "cellisca", gender: "f", pos: "n.", zh: "雨夾雪；霰", note: "指雨、雪或冰粒混合並伴隨強風的天氣現象；用法接近不可數名詞。", ex: "Con esta cellisca es mejor no coger el coche hasta que mejore la visibilidad.", exZh: "這種雨夾雪的天氣，最好等能見度變好再開車出門。" },
    { es: "alud", gender: "m", plural: "aludes", pos: "n.", zh: "雪崩；（引申）大量湧現", ex: "Un alud sepultó parcialmente la carretera que sube a la estación de esquí.", exZh: "一場雪崩部分掩埋了通往滑雪場的道路。" },
    { es: "calina", gender: "f", pos: "n.", zh: "薄霧；熱霾", note: "多指夏日因高溫和濕氣造成的朦朧霧氣，與「niebla」（濃霧）不同。", ex: "Desde el mirador apenas se distinguía la ciudad entre la calina de agosto.", exZh: "從觀景台望去，八月的熱霾讓城市幾乎看不清楚。" },
    { es: "rocío", gender: "m", pos: "n.", zh: "露水", ex: "Al amanecer, la hierba del jardín amanece cubierta de rocío.", exZh: "清晨時分，花園裡的草地總是佈滿露水。" },
    { es: "escarcha", gender: "f", pos: "n.", zh: "霜", ex: "Esta mañana había una fina capa de escarcha sobre el parabrisas del coche.", exZh: "今天早上車子的擋風玻璃上結了一層薄薄的霜。" },
    { es: "copo de nieve", gender: "m", plural: "copos de nieve", pos: "n.", zh: "雪花", note: "原資料中的「de」為多餘字，已清除。", ex: "Los niños salieron a atrapar copos de nieve con la lengua en cuanto empezó a nevar.", exZh: "一開始下雪，孩子們就跑出去用舌頭接雪花。" },
    { es: "arco iris", gender: "m", plural: "arcos iris", pos: "n.", zh: "彩虹", note: "口語中複數常保持不變（los arco iris），但規範形式為 arcos iris。", ex: "Después de la tormenta apareció un arco iris enorme sobre la bahía.", exZh: "暴風雨過後，海灣上方出現了一道巨大的彩虹。" },
    { es: "escampar", pos: "v.", zh: "（雨）停；放晴", note: "為無人稱動詞，只用第三人稱單數（como llover），主詞通常省略。", ex: "Esperamos bajo el toldo hasta que escampó para seguir el paseo.", exZh: "我們在遮篷下等到雨停了才繼續散步。" },
    { es: "fresco", pos: "adj.", zh: "涼爽的；新鮮的；（口語）厚臉皮的", note: "也可作名詞指壁畫（un fresco）或涼爽的空氣；口語中「ser un fresco」表示厚臉皮、不知羞恥。", ex: "Por las noches en la sierra hace fresco incluso en pleno verano.", exZh: "在山區，就算是仲夏夜裡也會覺得涼爽。" },
    { es: "calmado", en: "calm", pos: "adj.", zh: "平靜的；風平浪靜的", ex: "El mar estaba calmado esa mañana, ideal para salir a remar.", exZh: "那天早上海面風平浪靜，非常適合出海划船。" },
    { es: "cubierto", pos: "adj.", zh: "陰天的；多雲的；被覆蓋的", note: "作天氣用語時意為「陰天」；名詞 el cubierto 另指餐具或套餐。", ex: "El cielo estará cubierto durante todo el fin de semana, según el pronóstico.", exZh: "根據預報，整個週末天空都會是陰天。" },
    { es: "bochornoso", pos: "adj.", zh: "悶熱潮濕的；（引申）令人難堪的", note: "描述天氣時指悶熱難耐；也可用來形容令人尷尬、丟臉的事件。", ex: "Hacía un calor bochornoso y la ropa se pegaba al cuerpo nada más salir a la calle.", exZh: "天氣悶熱潮濕，才一走到街上衣服就黏在身上了。" },
    { es: "brumoso", pos: "adj.", zh: "有霧的；朦朧的", ex: "La costa se veía brumosa desde el faro aquella madrugada.", exZh: "那天凌晨從燈塔望去，海岸看起來一片朦朧。" },
    { es: "fresquito", pos: "adj.", zh: "涼涼的；微涼的", note: "為「fresco」的指小詞，語氣較親切、口語化，常用於日常對話。", ex: "Por la tarde se pone fresquito, así que llévate una chaqueta ligera.", exZh: "下午會變得涼涼的，所以帶件薄外套吧。" },
    { es: "gélido", pos: "adj.", zh: "冰冷的；嚴寒的", note: "比「frío」正式且強烈，常用於書面語或形容極端低溫，也可比喻態度冷淡。", ex: "Un viento gélido soplaba desde las montañas y calaba hasta los huesos.", exZh: "一陣刺骨的寒風從山上吹來，冷得讓人骨頭都在發抖。" },
    { es: "biosfera", en: "biosphere", gender: "f", plural: "biosferas", pos: "n.", zh: "生物圈", ex: "La biosfera terrestre depende de un delicado equilibrio entre especies y ecosistemas.", exZh: "地球的生物圈仰賴物種與生態系統之間微妙的平衡。" },
    { es: "recurso natural", en: "natural resource", gender: "m", plural: "recursos naturales", pos: "n.", zh: "天然資源", ex: "El país exporta buena parte de sus recursos naturales sin apenas procesarlos.", exZh: "這個國家出口大量天然資源，卻幾乎沒有經過加工。" },
    { es: "bosque lluvioso", gender: "m", plural: "bosques lluviosos", pos: "n.", zh: "雨林", note: "與「selva tropical」意思相近，皆可指熱帶雨林。", ex: "Los bosques lluviosos albergan una biodiversidad que aún no hemos terminado de estudiar.", exZh: "雨林裡蘊藏的生物多樣性，至今我們都還沒有完全研究透徹。" },
    { es: "reforestación", en: "reforestation", gender: "f", pos: "n.", zh: "重新造林；植林復育", ex: "El ayuntamiento ha puesto en marcha un plan de reforestación tras el incendio del verano pasado.", exZh: "市政府在去年夏天的火災後啟動了一項植林復育計畫。" },
    { es: "desarrollo sostenible", en: "sustainable development", gender: "m", pos: "n.", zh: "永續發展", ex: "La cumbre reunió a expertos para debatir modelos de desarrollo sostenible en zonas rurales.", exZh: "這場高峰會匯集了專家，共同討論鄉村地區的永續發展模式。" },
    { es: "acuífero", en: "aquifer", gender: "m", plural: "acuíferos", pos: "n.", zh: "含水層", ex: "La sobreexplotación agrícola ha reducido drásticamente el nivel del acuífero de la región.", exZh: "過度的農業開發使該地區含水層的水位大幅下降。" },
    { es: "conservación", en: "conservation", gender: "f", pos: "n.", zh: "保護；保育；保存", ex: "La ONG lleva veinte años dedicada a la conservación de especies en peligro de extinción.", exZh: "這個非政府組織二十年來一直致力於瀕危物種的保育工作。" },
    { es: "preservación", en: "preservation", gender: "f", pos: "n.", zh: "保存；維護", note: "與「conservación」意思相近，但更強調防止破壞或消失。", ex: "El tratado internacional busca garantizar la preservación de los arrecifes de coral.", exZh: "這項國際條約旨在確保珊瑚礁的完好保存。" },
    { es: "cadena alimentaria", gender: "f", plural: "cadenas alimentarias", pos: "n.", zh: "食物鏈", ex: "La desaparición de un depredador puede alterar por completo la cadena alimentaria de un ecosistema.", exZh: "一種掠食者的消失可能會徹底打亂一個生態系統的食物鏈。" },
    { es: "compost", en: "compost", gender: "m", pos: "n.", zh: "堆肥", ex: "En el patio tenemos un cubo donde echamos los restos de comida para hacer compost.", exZh: "我們在後院放了一個桶子，把廚餘丟進去做堆肥。" },
    { es: "aguas residuales", gender: "f", pos: "n.", zh: "廢水；污水", note: "通常以複數形式使用；單數 agua residual 較少見於口語。", ex: "La planta depuradora trata las aguas residuales antes de devolverlas al río.", exZh: "污水處理廠會先處理廢水，才將其排回河流中。" },
    { es: "vertedero", gender: "m", plural: "vertederos", pos: "n.", zh: "垃圾掩埋場；垃圾場", ex: "Gran parte de los residuos que generamos acaba enterrada en un vertedero.", exZh: "我們產生的大部分垃圾最終都會被埋在垃圾掩埋場裡。" },
    { es: "derrame de petróleo", gender: "m", plural: "derrames de petróleo", pos: "n.", zh: "石油外洩；漏油事件", note: "原資料中重複的「de」為多餘字，已清除。", ex: "El derrame de petróleo contaminó decenas de kilómetros de costa en pocas horas.", exZh: "這起漏油事件在短短幾小時內就污染了數十公里的海岸線。" },
    { es: "metal pesado", en: "heavy metal", gender: "m", plural: "metales pesados", pos: "n.", zh: "重金屬", note: "此為環境╱化學用語，指鉛、汞等重金屬，與音樂類型「heavy metal」無關。", ex: "Los análisis detectaron niveles elevados de metales pesados en el agua del pozo.", exZh: "檢驗結果顯示井水中重金屬的濃度偏高。" },
    { es: "huella de carbono", gender: "f", plural: "huellas de carbono", pos: "n.", zh: "碳足跡", note: "原資料中的「de」為多餘字，已清除。", ex: "Cada vez más empresas se comprometen a reducir su huella de carbono en la próxima década.", exZh: "越來越多企業承諾在未來十年內減少自身的碳足跡。" },
    { es: "hidrocarburo", en: "hydrocarbon", gender: "m", plural: "hidrocarburos", pos: "n.", zh: "碳氫化合物", ex: "La combustión de hidrocarburos es una de las principales fuentes de emisiones contaminantes.", exZh: "碳氫化合物的燃燒是污染排放的主要來源之一。" },
    { es: "catástrofe", en: "catastrophe", gender: "f", plural: "catástrofes", pos: "n.", zh: "災難；浩劫", ex: "Los científicos advierten que sin medidas urgentes nos dirigimos hacia una catástrofe climática.", exZh: "科學家警告，若不採取緊急措施，我們將走向一場氣候浩劫。" },
    { es: "emanación", en: "emanation", gender: "f", plural: "emanaciones", pos: "n.", zh: "散發；排放（氣體、氣味等）", ex: "Las emanaciones de la fábrica se notaban en el aire incluso a varios kilómetros de distancia.", exZh: "工廠排放出的氣體，就算在好幾公里外也能聞得到。" },
    { es: "lluvia ácida", gender: "f", pos: "n.", zh: "酸雨", ex: "La lluvia ácida generada por las emisiones industriales dañó gravemente los bosques cercanos.", exZh: "工業排放產生的酸雨嚴重損害了附近的森林。" },
    { es: "incendio forestal", gender: "m", plural: "incendios forestales", pos: "n.", zh: "森林大火", ex: "El verano pasado, un incendio forestal arrasó miles de hectáreas en apenas dos días.", exZh: "去年夏天，一場森林大火在短短兩天內就燒毀了數千公頃的土地。" },
    { es: "erosionar", en: "erode", pos: "v.", zh: "侵蝕；（引申）削弱", ex: "El viento y el agua han erosionado la roca hasta darle formas caprichosas.", exZh: "風和水的侵蝕，讓岩石逐漸形成了奇特的形狀。" },
    { es: "purificar", en: "purify", pos: "v.", zh: "淨化；提純", ex: "Instalaron un filtro para purificar el agua antes de que llegara a los grifos del edificio.", exZh: "他們安裝了一個濾水器，在水送到大樓水龍頭前先加以淨化。" },
    { es: "contaminante", en: "contaminant", pos: "adj.", zh: "污染的；造成污染的（名詞用法：污染物）", note: "常兼作名詞使用（un contaminante = 一種污染物），此處依原資料標為形容詞。", ex: "Las autoridades limitaron la circulación de vehículos con motores muy contaminantes.", exZh: "當局限制了排放污染物較嚴重的車輛通行。" },
    { es: "viciado", pos: "adj.", zh: "污濁的；不流通的（空氣）；受污染的", note: "常用於「aire viciado」（空氣不流通、悶濁），與 contaminado 意思相近但更強調缺乏新鮮空氣。", ex: "Después de tres horas de reunión, el ambiente de la sala estaba completamente viciado.", exZh: "開了三小時的會之後，會議室裡的空氣變得非常不流通。" },
    { es: "neutrón", en: "neutron", gender: "m", plural: "neutrones", pos: "n.", zh: "中子", ex: "El neutrón no tiene carga eléctrica, a diferencia del protón.", exZh: "中子不帶電，這點與質子不同。" },
    { es: "protón", en: "proton", gender: "m", plural: "protones", pos: "n.", zh: "質子", ex: "En el núcleo del átomo se encuentran los protones junto con los neutrones.", exZh: "原子核裡有質子和中子。" },
    { es: "electrón", en: "electron", gender: "m", plural: "electrones", pos: "n.", zh: "電子", ex: "Los electrones giran alrededor del núcleo a una velocidad enorme.", exZh: "電子以極快的速度繞著原子核運轉。" },
    { es: "elemento", en: "element", gender: "m", plural: "elementos", pos: "n.", zh: "元素；要素", ex: "El oro es un elemento químico muy valorado desde la antigüedad.", exZh: "黃金自古以來就是備受重視的化學元素。" },
    { es: "oxígeno", en: "oxygen", gender: "m", pos: "n.", zh: "氧；氧氣", ex: "Sin oxígeno suficiente, las células del cuerpo dejan de funcionar correctamente.", exZh: "若氧氣不足，身體的細胞就無法正常運作。" },
    { es: "nitrógeno", en: "nitrogen", gender: "m", pos: "n.", zh: "氮；氮氣", ex: "El nitrógeno constituye casi el ochenta por ciento de la atmósfera terrestre.", exZh: "氮氣占地球大氣層近百分之八十。" },
    { es: "hidrógeno", en: "hydrogen", gender: "m", pos: "n.", zh: "氫；氫氣", ex: "El hidrógeno se está investigando como combustible limpio para el futuro.", exZh: "氫正被研究作為未來的潔淨燃料。" },
    { es: "carbono", en: "carbon", gender: "m", pos: "n.", zh: "碳", ex: "Las emisiones de dióxido de carbono contribuyen al calentamiento global.", exZh: "二氧化碳排放是全球暖化的成因之一。" },
    { es: "fósforo", en: "phosphorus", gender: "m", pos: "n.", zh: "磷", note: "También significa 'cerilla' (match); en Hispanoamérica es de uso muy común, mientras que en España se prefiere 'cerilla'.", ex: "El fósforo es un elemento esencial para el ADN y las membranas celulares.", exZh: "磷是DNA與細胞膜不可或缺的元素。" },
    { es: "azufre", gender: "m", pos: "n.", zh: "硫；硫磺", ex: "El azufre le da a los huevos podridos su característico olor desagradable.", exZh: "硫磺讓臭雞蛋帶有那股特殊的難聞氣味。" },
    { es: "ácido", en: "acid", gender: "m", plural: "ácidos", pos: "n.", zh: "酸", note: "También se usa como adjetivo con el sentido de 'ácido, agrio' (sour/acidic).", ex: "El ácido sulfúrico se utiliza en numerosos procesos industriales.", exZh: "硫酸廣泛應用於許多工業製程中。" },
    { es: "núcleo", en: "nucleus", gender: "m", plural: "núcleos", pos: "n.", zh: "核；核心", ex: "El núcleo de la célula contiene la mayor parte del material genético.", exZh: "細胞核內含有大部分的遺傳物質。" },
    { es: "reproducir", en: "to reproduce", pos: "v.", zh: "繁殖；複製；再現", note: "En biología suele emplearse en forma reflexiva, 'reproducirse', cuando se habla de organismos.", ex: "Los anfibios se reproducen depositando huevos en el agua.", exZh: "兩棲類動物藉由在水中產卵來繁殖。" },
    { es: "heredar", pos: "v.", zh: "繼承；遺傳", ex: "Según los científicos, ciertos rasgos de personalidad también se pueden heredar.", exZh: "科學家指出，某些人格特質也可能是遺傳而來的。" },
    { es: "genético", en: "genetic", pos: "adj.", zh: "遺傳的；基因的", ex: "La modificación genética de los cultivos sigue siendo un tema controvertido.", exZh: "農作物的基因改造至今仍是備受爭議的議題。" },
    { es: "evolucionar", en: "to evolve", pos: "v.", zh: "演化；進化", ex: "Los científicos explican cómo las especies evolucionan para adaptarse a su entorno.", exZh: "科學家解釋物種如何演化以適應環境。" },
    { es: "ADN", gender: "m", pos: "n.", zh: "去氧核糖核酸；DNA", note: "Sigla de 'ácido desoxirribonucleico', equivalente al inglés DNA.", ex: "Los investigadores compararon el ADN de las dos muestras para confirmar la coincidencia.", exZh: "研究人員比對兩份樣本的DNA以確認是否吻合。" },
    { es: "anfibio", en: "amphibian", gender: "m", plural: "anfibios", pos: "n.", zh: "兩棲動物", note: "También funciona como adjetivo (anfibio, -a) con el sentido de 'amphibious', p. ej. 'un vehículo anfibio'.", ex: "La rana es el anfibio más conocido y vive tanto en el agua como en tierra.", exZh: "青蛙是最廣為人知的兩棲動物，水陸兩棲皆能生活。" },
    { es: "clonación", gender: "f", pos: "n.", zh: "複製；複製技術", ex: "La clonación de animales plantea importantes dilemas éticos.", exZh: "動物複製技術引發了重大的倫理爭議。" },
    { es: "velocidad", en: "velocity", gender: "f", plural: "velocidades", pos: "n.", zh: "速度", ex: "El coche alcanzó una velocidad de casi doscientos kilómetros por hora en la autopista.", exZh: "那輛車在高速公路上一度加速到將近時速兩百公里。" },
    { es: "partícula", en: "particle", gender: "f", plural: "partículas", pos: "n.", zh: "粒子；顆粒", ex: "Los físicos utilizan aceleradores para estudiar el comportamiento de las partículas subatómicas.", exZh: "物理學家利用加速器來研究次原子粒子的行為。" },
    { es: "masa", en: "mass", gender: "f", plural: "masas", pos: "n.", zh: "質量；麵團；群眾", note: "En física significa 'masa' (mass); también puede referirse a la masa de pan (dough) o a 'las masas' (the masses, el pueblo).", ex: "La masa de un objeto no cambia aunque su peso varíe según la gravedad.", exZh: "物體的質量不會改變，儘管其重量會因重力而有所不同。" },
    { es: "térmico", en: "thermal", pos: "adj.", zh: "熱的；熱能的", ex: "La ropa térmica ayuda a mantener el calor corporal durante el invierno.", exZh: "保暖衣物有助於在冬天維持體溫。" },
    { es: "congelación", gender: "f", pos: "n.", zh: "冷凍；結凍；凍結", ex: "El pescado se conserva mejor mediante la congelación inmediata tras la pesca.", exZh: "魚獲在捕撈後立即冷凍能保存得更好。" },
    { es: "derretimiento", gender: "m", pos: "n.", zh: "融化；溶解", ex: "El derretimiento de los glaciares es una de las consecuencias más visibles del cambio climático.", exZh: "冰川融化是氣候變遷最顯著的後果之一。" },
    { es: "evaporación", en: "evaporation", gender: "f", pos: "n.", zh: "蒸發", ex: "La evaporación del agua de los océanos forma parte esencial del ciclo del agua.", exZh: "海洋水分的蒸發是水循環中不可或缺的一環。" },
    { es: "condensación", en: "condensation", gender: "f", pos: "n.", zh: "凝結；冷凝", ex: "Por la mañana suele haber condensación en las ventanas debido al cambio de temperatura.", exZh: "早上窗戶上常因溫差而出現凝結的水珠。" },
    { es: "álgebra", en: "algebra", gender: "f", pos: "n.", zh: "代數；代數學", note: "Sustantivo femenino que usa el artículo 'el' en singular por empezar con 'a' tónica ('el álgebra'), igual que 'el agua'.", ex: "El álgebra les resultaba mucho más difícil que la aritmética a la mayoría de los alumnos.", exZh: "對大多數學生來說，代數比算術困難得多。" },
    { es: "aritmética", en: "arithmetic", gender: "f", pos: "n.", zh: "算術；算數", ex: "Antes de aprender álgebra, los niños deben dominar la aritmética básica.", exZh: "在學習代數之前，孩子們必須先熟練基本的算術。" },
    { es: "trigonometría", en: "trigonometry", gender: "f", pos: "n.", zh: "三角學；三角函數", ex: "La trigonometría se aplica en la ingeniería para calcular distancias y ángulos.", exZh: "三角學被應用於工程學中，用來計算距離與角度。" },
    { es: "cálculo", en: "calculus", gender: "m", plural: "cálculos", pos: "n.", zh: "微積分；計算；估算", note: "También significa 'cálculo, estimación' en general, y 'cálculo renal' se refiere a una piedra en el riñón (kidney stone).", ex: "En la universidad, muchos estudiantes consideran el cálculo diferencial la asignatura más exigente.", exZh: "在大學裡，許多學生認為微分是最具挑戰性的科目。" },
    { es: "fracción", en: "fraction", gender: "f", plural: "fracciones", pos: "n.", zh: "分數；部分", ex: "Solo una pequeña fracción de los alumnos aprobó el examen de matemáticas.", exZh: "只有一小部分學生通過了數學考試。" },
    { es: "sumar", pos: "v.", zh: "加；加總", ex: "Antes de firmar el contrato, conviene sumar todos los gastos adicionales.", exZh: "簽約前最好先把所有額外費用加總起來。" },
    { es: "restar", pos: "v.", zh: "減；減去", ex: "Al restar los gastos de los ingresos, comprobamos que el negocio no era rentable.", exZh: "用收入減去支出後，我們發現這門生意並不賺錢。" },
    { es: "multiplicar", en: "to multiply", pos: "v.", zh: "乘；使增加", ex: "Basta con multiplicar la base por la altura para hallar el área del rectángulo.", exZh: "只要用底乘以高，就能求出長方形的面積。" },
    { es: "dividir", en: "to divide", pos: "v.", zh: "除；劃分", ex: "Decidieron dividir la herencia en partes iguales entre los tres hermanos.", exZh: "他們決定把遺產平分給三個兄弟姊妹。" },
    { es: "ecuación", en: "equation", gender: "f", plural: "ecuaciones", pos: "n.", zh: "方程式", ex: "Resolver esta ecuación de segundo grado requiere aplicar la fórmula general.", exZh: "要解這個二次方程式，必須套用公式解。" },
    { es: "incógnita", gender: "f", plural: "incógnitas", pos: "n.", zh: "未知數；謎團", ex: "Para resolver la ecuación, primero hay que despejar la incógnita.", exZh: "要解這個方程式，首先必須求出未知數。" },
    { es: "cifra", gender: "f", plural: "cifras", pos: "n.", zh: "數字；位數", ex: "El número de desempleados alcanzó una cifra récord el año pasado.", exZh: "去年失業人數達到創紀錄的數字。" },
    { es: "potencia", gender: "f", plural: "potencias", pos: "n.", zh: "冪；次方；功率；強國", note: "En matemáticas significa 'potencia' (exponente); en física se refiere a 'potencia' (wattage); también puede designar a una potencia mundial (a world power).", ex: "Dos elevado a la quinta potencia es igual a treinta y dos.", exZh: "二的五次方等於三十二。" },
    { es: "número par", gender: "m", plural: "números pares", pos: "n.", zh: "偶數", ex: "Todos los números terminados en cero, dos, cuatro, seis u ocho son números pares.", exZh: "所有以0、2、4、6或8結尾的數字都是偶數。" },
    { es: "número impar", gender: "m", plural: "números impares", pos: "n.", zh: "奇數", ex: "La suma de dos números impares siempre da como resultado un número par.", exZh: "兩個奇數相加，結果必定是偶數。" },
    { es: "número entero", gender: "m", plural: "números enteros", pos: "n.", zh: "整數", ex: "El resultado de la división no fue un número entero, sino un decimal.", exZh: "這次除法的結果不是整數，而是小數。" },
    { es: "número natural", en: "natural number", gender: "m", plural: "números naturales", pos: "n.", zh: "自然數", ex: "Los números naturales son aquellos que se usan para contar, comenzando por el uno o el cero.", exZh: "自然數是用來計數的數字，從一或零開始。" },
    { es: "número primo", en: "prime number", gender: "m", plural: "números primos", pos: "n.", zh: "質數；素數", ex: "El siete es un número primo porque solo es divisible por uno y por sí mismo.", exZh: "七是質數，因為它只能被一和自身整除。" },
    { es: "geometría", en: "geometry", gender: "f", pos: "n.", zh: "幾何學", ex: "La geometría estudia las formas, los tamaños y las propiedades del espacio.", exZh: "幾何學研究空間的形狀、大小與性質。" },
    { es: "ángulo", en: "angle", gender: "m", plural: "ángulos", pos: "n.", zh: "角；角度", ex: "Los dos lados del triángulo forman un ángulo de noventa grados.", exZh: "三角形的兩邊形成一個九十度的角。" },
    { es: "obtuso", en: "obtuse", pos: "adj.", zh: "鈍角的；遲鈍的", note: "También se usa en sentido figurado para describir a una persona poco perspicaz o de entendimiento lento.", ex: "Un triángulo obtuso tiene uno de sus ángulos mayor de noventa grados.", exZh: "鈍角三角形的其中一個角大於九十度。" },
    { es: "circunferencia", en: "circumference", gender: "f", plural: "circunferencias", pos: "n.", zh: "圓周；圓周長", ex: "Para calcular la circunferencia de un círculo, se multiplica el diámetro por pi.", exZh: "要計算圓的圓周長，需將直徑乘以圓周率。" },
    { es: "diámetro", en: "diameter", gender: "m", plural: "diámetros", pos: "n.", zh: "直徑", ex: "El diámetro de la Tierra es de aproximadamente doce mil ochocientos kilómetros.", exZh: "地球的直徑約為一萬兩千八百公里。" },
    { es: "perímetro", en: "perimeter", gender: "m", plural: "perímetros", pos: "n.", zh: "周長；周邊", ex: "Colocaron una valla alrededor de todo el perímetro del terreno.", exZh: "他們沿著整塊土地的周邊架起了圍籬。" },
    { es: "área", en: "area", gender: "f", plural: "áreas", pos: "n.", zh: "面積；區域", note: "Sustantivo femenino que usa el artículo 'el' en singular por empezar con 'a' tónica ('el área'), igual que 'el agua'.", ex: "El área de este salón es mayor que la del comedor.", exZh: "這間客廳的面積比餐廳大。" },
    { es: "mediana", en: "median", gender: "f", plural: "medianas", pos: "n.", zh: "中位數；(道路)安全島", note: "En estadística significa 'mediana' (median); en el contexto del tráfico se refiere a la franja divisoria central de una carretera (median strip).", ex: "La mediana de los sueldos del equipo es más representativa que la media, ya que evita distorsiones por valores extremos.", exZh: "團隊薪資的中位數比平均數更具代表性，因為它能避免極端值造成的偏差。" },
    { es: "astronauta", en: "astronaut", gender: "m", plural: "astronautas", pos: "n.", zh: "太空人", note: "屬於通性名詞(el/la astronauta),依指稱對象的性別使用陽性或陰性冠詞,此處預設列為陽性。", ex: "Cuando era niña, soñaba con convertirse en astronauta y viajar a la Luna.", exZh: "她小時候夢想成為太空人並飛向月球。" },
    { es: "galaxia", en: "galaxy", gender: "f", plural: "galaxias", pos: "n.", zh: "星系", ex: "Nuestra galaxia, la Vía Láctea, contiene miles de millones de estrellas.", exZh: "我們的星系「銀河系」包含數十億顆恆星。" },
    { es: "constelación", en: "constellation", gender: "f", plural: "constelaciones", pos: "n.", zh: "星座", ex: "En las noches despejadas se puede distinguir fácilmente la constelación de Orión.", exZh: "在晴朗的夜晚很容易就能辨認出獵戶座這個星座。" },
    { es: "planeta", en: "planet", gender: "m", plural: "planetas", pos: "n.", zh: "行星", note: "雖然字尾是 -a,但屬於陽性名詞(el planeta),源自希臘文,是常見的性別例外。", ex: "Marte es el planeta que más interesa a los científicos en busca de vida extraterrestre.", exZh: "火星是科學家在尋找外星生命時最感興趣的行星。" },
    { es: "asteroide", en: "asteroid", gender: "m", plural: "asteroides", pos: "n.", zh: "小行星", ex: "La NASA vigila de cerca cualquier asteroide que pueda acercarse peligrosamente a la Tierra.", exZh: "美國航太總署密切監控任何可能危險接近地球的小行星。" },
    { es: "satélite", en: "satellite", gender: "m", plural: "satélites", pos: "n.", zh: "衛星", note: "也可指人造衛星(satélite artificial)。", ex: "El satélite fue lanzado con éxito y ya está enviando las primeras imágenes de la Tierra.", exZh: "這顆衛星已成功發射,並已開始傳回地球的初步影像。" },
    { es: "órbita", en: "orbit", gender: "f", plural: "órbitas", pos: "n.", zh: "軌道", ex: "La sonda tardó siete meses en entrar en la órbita de Marte.", exZh: "這艘探測船花了七個月的時間才進入火星的軌道。" },
    { es: "atmósfera", en: "atmosphere", gender: "f", plural: "atmósferas", pos: "n.", zh: "大氣層", note: "也可比喻用來指「氣氛」。", ex: "Al entrar en la atmósfera terrestre, el cohete se calienta muchísimo por la fricción.", exZh: "火箭進入地球大氣層時,會因摩擦而變得非常炙熱。" },
    { es: "gravedad", en: "gravity", gender: "f", pos: "n.", zh: "重力;地心引力", note: "也常用來表示「嚴重性」,例如 la gravedad de la situación(情況的嚴重性)。在此二意義下通常視為不可數,不列複數。", ex: "Los astronautas flotan en el espacio porque allí apenas existe gravedad.", exZh: "太空人在太空中會飄浮,因為那裡幾乎沒有重力。" },
    { es: "eclipse", en: "eclipse", gender: "m", plural: "eclipses", pos: "n.", zh: "蝕(日食或月食)", ex: "Miles de personas salieron a la calle para observar el eclipse solar con gafas especiales.", exZh: "數千人走上街頭,戴著特殊眼鏡觀賞這次日食。" },
    { es: "cohete", gender: "m", plural: "cohetes", pos: "n.", zh: "火箭", note: "英文 rocket 與此字拼字並不相近,並非同源詞。", ex: "El cohete despegó desde la base espacial a las seis de la mañana.", exZh: "這枚火箭在清晨六點從太空基地發射升空。" },
    { es: "Plutón", en: "Pluto", gender: "m", pos: "n.", zh: "冥王星", note: "專有名詞,無複數形。1930年發現,2006年被重新分類為矮行星。", ex: "En 2006 la Unión Astronómica Internacional decidió que Plutón ya no era un planeta.", exZh: "2006年,國際天文學聯合會決議冥王星不再是行星。" },
    { es: "Neptuno", en: "Neptune", gender: "m", pos: "n.", zh: "海王星", note: "專有名詞,無複數形。", ex: "Neptuno es el planeta más alejado del Sol en nuestro sistema solar.", exZh: "海王星是我們太陽系中離太陽最遠的行星。" },
    { es: "Urano", en: "Uranus", gender: "m", pos: "n.", zh: "天王星", note: "專有名詞,無複數形。", ex: "Urano gira sobre su eje de una manera muy inclinada respecto a los demás planetas.", exZh: "天王星的自轉軸相對於其他行星傾斜得非常厲害。" },
    { es: "Saturno", en: "Saturn", gender: "m", pos: "n.", zh: "土星", note: "專有名詞,無複數形。", ex: "Los anillos de Saturno están formados principalmente por hielo y roca.", exZh: "土星環主要是由冰和岩石組成的。" },
    { es: "Júpiter", en: "Jupiter", gender: "m", pos: "n.", zh: "木星", note: "專有名詞,無複數形。", ex: "Júpiter es tan grande que podría contener más de mil planetas como la Tierra.", exZh: "木星非常巨大,大小足以容納一千多個像地球一樣的行星。" },
    { es: "Marte", en: "Mars", gender: "m", pos: "n.", zh: "火星", note: "專有名詞,無複數形。", ex: "Varias agencias espaciales sueñan con enviar humanos a Marte antes de 2040.", exZh: "多個太空總署都夢想在2040年前將人類送上火星。" },
    { es: "Venus", en: "Venus", gender: "m", pos: "n.", zh: "金星", note: "專有名詞,無複數形。雖然羅馬神話中維納斯是女神,但作為行星名在西文中搭配陽性冠詞(el planeta Venus)。", ex: "Venus tiene una temperatura superficial más alta que Mercurio a pesar de estar más lejos del Sol.", exZh: "儘管金星離太陽較遠,它的表面溫度卻比水星還高。" },
    { es: "Mercurio", en: "Mercury", gender: "m", pos: "n.", zh: "水星", note: "專有名詞,無複數形;注意與化學元素「汞」(mercurio,小寫)同形但意義不同,須依語境判斷。", ex: "Mercurio completa una vuelta alrededor del Sol en apenas 88 días.", exZh: "水星只需大約88天就能繞太陽公轉一圈。" },
    { es: "paro cardíaco", gender: "m", plural: "paros cardíacos", pos: "n.", zh: "心臟驟停", ex: "El futbolista sufrió un paro cardíaco en pleno partido y los médicos lograron reanimarlo a tiempo.", exZh: "這名足球員在比賽中突然心臟驟停,醫護人員及時將他救醒。" },
    { es: "infarto", gender: "m", plural: "infartos", pos: "n.", zh: "心肌梗塞(心臟病發作)", note: "口語中常直接指「心臟病發作」,與英文 infarct(醫學上指組織壞死)意義範圍不完全相同,故不視為安全同源詞。", ex: "Mi abuelo tuvo un infarto el año pasado, pero se recuperó gracias a la operación.", exZh: "我祖父去年心肌梗塞發作,但多虧了那次手術才康復。" },
    { es: "cistitis", en: "cystitis", gender: "f", pos: "n.", zh: "膀胱炎", note: "字尾 -itis 的疾病名詞多為陰性且單複數同形(la cistitis / las cistitis)。", ex: "Bebe mucha agua, porque la cistitis puede empeorar si no te hidratas bien.", exZh: "多喝水吧,因為如果水分補充不足,膀胱炎可能會惡化。" },
    { es: "gonorrea", en: "gonorrhea", gender: "f", pos: "n.", zh: "淋病", ex: "La gonorrea es una infección de transmisión sexual que se puede tratar con antibióticos.", exZh: "淋病是一種性傳染病,可以用抗生素治療。" },
    { es: "hemorragia", en: "hemorrhage", gender: "f", plural: "hemorragias", pos: "n.", zh: "出血", ex: "El paciente llegó a urgencias con una hemorragia interna que requería cirugía inmediata.", exZh: "這名病患因體內出血被送到急診室,需要立即進行手術。" },
    { es: "varicela", gender: "f", pos: "n.", zh: "水痘", note: "與英文 chickenpox 拼字完全不同,並非同源詞。", ex: "Casi todos los niños de la clase se contagiaron de varicela ese invierno.", exZh: "那年冬天班上幾乎所有小朋友都感染了水痘。" },
    { es: "artritis", en: "arthritis", gender: "f", pos: "n.", zh: "關節炎", note: "字尾 -itis,單複數同形。", ex: "Con la edad, mi madre ha empezado a sufrir artritis en las manos.", exZh: "隨著年紀增長,我母親的雙手開始出現關節炎。" },
    { es: "hepatitis", en: "hepatitis", gender: "f", pos: "n.", zh: "肝炎", note: "字尾 -itis,單複數同形。", ex: "La vacuna contra la hepatitis B se administra ya en las primeras semanas de vida.", exZh: "B型肝炎疫苗現在在出生後最初幾週就會施打。" },
    { es: "leucemia", en: "leukemia", gender: "f", pos: "n.", zh: "白血病", ex: "Le diagnosticaron leucemia a los ocho años, pero superó la enfermedad tras el tratamiento.", exZh: "他八歲時被診斷出白血病,但經過治療後戰勝了病魔。" },
    { es: "VIH", gender: "m", pos: "n.", zh: "人類免疫缺乏病毒(愛滋病毒)", note: "縮寫,全稱為 Virus de Inmunodeficiencia Humana;字母順序與英文 HIV 不同,外觀上並非同源詞。", ex: "Hoy en día, una persona con VIH puede llevar una vida completamente normal si sigue el tratamiento.", exZh: "現今只要遵循治療,感染愛滋病毒的人也能過著完全正常的生活。" },
    { es: "SIDA", gender: "m", pos: "n.", zh: "愛滋病", note: "縮寫,全稱為 Síndrome de Inmunodeficiencia Adquirida;現今西文詞典也接受小寫「sida」作普通名詞使用。字母順序與英文 AIDS 不同。", ex: "La campaña busca concienciar a los jóvenes sobre cómo se transmite el sida.", exZh: "這項宣導活動旨在讓年輕人了解愛滋病的傳播方式。" },
    { es: "epilepsia", en: "epilepsy", gender: "f", pos: "n.", zh: "癲癇", ex: "Desde niña convive con la epilepsia, pero la medicación le permite llevar una vida activa.", exZh: "她從小就有癲癇,但藥物治療讓她能過著活躍的生活。" },
    { es: "espasmo", en: "spasm", gender: "m", plural: "espasmos", pos: "n.", zh: "痙攣;抽搐", ex: "Sintió un espasmo muscular tan fuerte en la pierna que tuvo que parar de correr.", exZh: "他的腿突然一陣強烈痙攣,只好停下腳步不再跑步。" },
    { es: "crónico", en: "chronic", pos: "adj.", zh: "慢性的", note: "陰性形為 crónica;常搭配疾病名詞使用,如 dolor crónico(慢性疼痛)。", ex: "El estrés laboral puede convertirse en un problema crónico si no se aborda a tiempo.", exZh: "如果不及時處理,工作壓力可能會變成一種慢性問題。" },
    { es: "unidad de cuidados intensivos", gender: "f", plural: "unidades de cuidados intensivos", pos: "n.", zh: "加護病房", note: "常縮寫為 UCI。", ex: "Tras el accidente, lo trasladaron de urgencia a la unidad de cuidados intensivos.", exZh: "車禍發生後,他被緊急送往加護病房。" },
    { es: "RCP", gender: "f", pos: "n.", zh: "心肺復甦術", note: "縮寫,全稱為 reanimación cardiopulmonar,因此使用陰性冠詞(la RCP)。", ex: "El socorrista le practicó la RCP hasta que llegó la ambulancia.", exZh: "救生員對他實施心肺復甦術,直到救護車抵達。" },
    { es: "reanimar", en: "reanimate", pos: "v.", zh: "使甦醒;施行急救復甦", ex: "Los sanitarios lucharon durante varios minutos para reanimar al herido.", exZh: "醫護人員花了好幾分鐘努力想讓傷者甦醒過來。" },
    { es: "inconsciente", en: "unconscious", pos: "adj.", zh: "失去意識的;昏迷的", note: "也可指心理學上的「潛意識的」,須依語境判斷。", ex: "Lo encontraron inconsciente en el suelo tras la caída.", exZh: "他跌倒後被人發現昏迷倒在地上。" },
    { es: "alérgeno", en: "allergen", gender: "m", plural: "alérgenos", pos: "n.", zh: "過敏原", note: "原始資料 es_raw 為「alergeno」,漏了重音符號;正確拼法為重音落在倒數第三音節的「alérgeno」(esdrújula,依西文重音規則此類詞必須標示重音)。", ex: "El polen es uno de los alérgenos más comunes en primavera.", exZh: "花粉是春天最常見的過敏原之一。" },
    { es: "antídoto", en: "antidote", gender: "m", plural: "antídotos", pos: "n.", zh: "解毒劑;解藥", note: "也常比喻使用,如 el antídoto contra el aburrimiento(解悶良方)。", ex: "Los médicos administraron el antídoto justo a tiempo para salvarle la vida.", exZh: "醫生及時施打了解毒劑,才救了他一命。" },
    { es: "yeso", gender: "m", plural: "yesos", pos: "n.", zh: "石膏(繃帶)", note: "原意為「石膏、灰泥」,在醫療語境中指固定骨折用的石膏繃帶;與英文 cast 並非同源詞。", ex: "Se rompió el brazo esquiando y tuvo que llevar el yeso durante seis semanas.", exZh: "他滑雪時摔斷了手臂,只好打了六個星期的石膏。" },
    { es: "inflamado", en: "inflamed", pos: "adj.", zh: "發炎的;腫脹的", ex: "Tiene la garganta tan inflamada que le cuesta tragar.", exZh: "他的喉嚨腫得很厲害,連吞嚥都很困難。" },
    { es: "terapia", en: "therapy", gender: "f", plural: "terapias", pos: "n.", zh: "治療；療法", ex: "Después del accidente, empezó una terapia de rehabilitación que duró casi un año.", exZh: "意外發生後,他開始接受一項幾乎持續一年的復健治療。" },
    { es: "terapeuta", gender: "m", plural: "terapeutas", pos: "n.", zh: "治療師", note: "陰陽性同形的通性名詞(el terapeuta / la terapeuta),此處預設陽性。", ex: "Mi terapeuta me ayudó a entender por qué reaccionaba así ante el estrés.", exZh: "我的治療師幫助我理解自己為什麼會對壓力有這種反應。" },
    { es: "psicoterapia", en: "psychotherapy", gender: "f", plural: "psicoterapias", pos: "n.", zh: "心理治療", ex: "La psicoterapia le permitió afrontar los recuerdos de su infancia sin sentirse abrumada.", exZh: "心理治療讓她能夠面對童年的回憶,而不會感到不知所措。" },
    { es: "meditación", en: "meditation", gender: "f", plural: "meditaciones", pos: "n.", zh: "冥想；靜心", ex: "Practica la meditación cada mañana para empezar el día con la mente despejada.", exZh: "她每天早上練習冥想,讓自己能以清晰的頭腦展開新的一天。" },
    { es: "conciencia plena", gender: "f", pos: "n.", zh: "正念", note: "中心詞 conciencia 為陰性;英文常直接借用 mindfulness 一詞。", ex: "El curso de conciencia plena le enseñó a observar sus pensamientos sin juzgarlos.", exZh: "正念課程教會她如何不帶評判地觀察自己的想法。" },
    { es: "autoestima", gender: "f", pos: "n.", zh: "自尊；自我價值感", ex: "Los comentarios constantes de sus padres afectaron gravemente su autoestima.", exZh: "父母不斷的評論嚴重影響了他的自尊心。" },
    { es: "bienestar", gender: "m", pos: "n.", zh: "幸福感；安康", ex: "La empresa ha puesto en marcha un programa para mejorar el bienestar de sus empleados.", exZh: "這家公司推出了一項計畫,旨在提升員工的幸福感。" },
    { es: "vulnerabilidad", en: "vulnerability", gender: "f", pos: "n.", zh: "脆弱；易受傷害", ex: "Reconocer su propia vulnerabilidad fue el primer paso para pedir ayuda.", exZh: "承認自己的脆弱是他尋求幫助的第一步。" },
    { es: "obsesión", en: "obsession", gender: "f", plural: "obsesiones", pos: "n.", zh: "執念；著迷", ex: "Su obsesión por el orden le impedía relajarse incluso en vacaciones.", exZh: "他對整潔的執念讓他即使在度假時也無法放鬆。" },
    { es: "compulsión", en: "compulsion", gender: "f", plural: "compulsiones", pos: "n.", zh: "強迫衝動", ex: "Sentía una compulsión irresistible a revisar el móvil cada pocos minutos.", exZh: "他感到一種難以抗拒的衝動,每隔幾分鐘就要查看手機。" },
    { es: "trauma", en: "trauma", gender: "m", plural: "traumas", pos: "n.", zh: "創傷", note: "雖以 -a 結尾,但屬於陽性名詞(el trauma)。", ex: "El terapeuta la ayudó a superar el trauma de aquel accidente.", exZh: "治療師幫助她克服了那場意外造成的創傷。" },
    { es: "agotamiento", gender: "m", pos: "n.", zh: "精疲力盡；耗竭", ex: "Llegó a un punto de agotamiento tan grande que tuvo que pedir la baja laboral.", exZh: "他疲憊到了極點,不得不申請病假。" },
    { es: "depresión", en: "depression", gender: "f", pos: "n.", zh: "憂鬱症", ex: "Le diagnosticaron depresión tras varios meses de tristeza constante.", exZh: "經過好幾個月持續的情緒低落後,他被診斷出患有憂鬱症。" },
    { es: "duelo", gender: "m", pos: "n.", zh: "哀悼；喪親之痛", note: "與英文 duel(決鬥)拼字相近但意義不同,勿當成同源詞。", ex: "El proceso de duelo tras la muerte de su madre duró más de un año.", exZh: "母親過世後,他經歷了一年多的哀悼過程。" },
    { es: "apatía", en: "apathy", gender: "f", pos: "n.", zh: "冷漠；無動於衷", ex: "La apatía de los estudiantes hacia la política preocupa a los profesores.", exZh: "學生對政治的冷漠態度讓老師們感到憂心。" },
    { es: "insomnio", en: "insomnia", gender: "m", pos: "n.", zh: "失眠", ex: "El insomnio crónico empezó a afectar su rendimiento en el trabajo.", exZh: "長期失眠開始影響他的工作表現。" },
    { es: "fobia", en: "phobia", gender: "f", plural: "fobias", pos: "n.", zh: "恐懼症", ex: "Tiene fobia a las alturas desde que se cayó de un árbol de niño.", exZh: "自從小時候從樹上摔下來後,他就有懼高症。" },
    { es: "ataque de pánico", gender: "m", plural: "ataques de pánico", pos: "n.", zh: "恐慌發作", note: "es_raw 原文結尾多出一個雜訊「de」,已修正為「ataque de pánico」。", ex: "Sufrió un ataque de pánico en el metro y tuvo que bajarse en la siguiente parada.", exZh: "他在地鐵上恐慌發作,不得不在下一站下車。" },
    { es: "crisis nerviosa", gender: "f", plural: "crisis nerviosas", pos: "n.", zh: "精神崩潰", note: "crisis 為陰性且單複數同形(la crisis / las crisis)。", ex: "Después de meses de presión en el trabajo, sufrió una crisis nerviosa.", exZh: "在工作壓力累積數月後,他精神崩潰了。" },
    { es: "trastorno alimentario", gender: "m", plural: "trastornos alimentarios", pos: "n.", zh: "飲食障礙症", ex: "Muchos adolescentes desarrollan un trastorno alimentario por la presión estética de las redes sociales.", exZh: "許多青少年因社群媒體的外貌壓力而罹患飲食障礙症。" },
    { es: "trastorno bipolar", gender: "m", plural: "trastornos bipolares", pos: "n.", zh: "雙相情感障礙症（躁鬱症）", ex: "El trastorno bipolar se caracteriza por cambios extremos entre la euforia y la depresión.", exZh: "雙相情感障礙症的特徵是情緒在亢奮與憂鬱之間劇烈擺盪。" },
    { es: "trastorno obsesivo-compulsivo", gender: "m", plural: "trastornos obsesivo-compulsivos", pos: "n.", zh: "強迫症", ex: "El trastorno obsesivo-compulsivo le hacía lavarse las manos decenas de veces al día.", exZh: "強迫症讓他一天要洗手好幾十次。" },
    { es: "valor nutritivo", gender: "m", plural: "valores nutritivos", pos: "n.", zh: "營養價值", ex: "Esta etiqueta indica el valor nutritivo de cada ración del producto.", exZh: "這張標籤標示了這項產品每份的營養價值。" },
    { es: "macronutriente", en: "macronutrient", gender: "m", plural: "macronutrientes", pos: "n.", zh: "巨量營養素", ex: "Las proteínas, los carbohidratos y las grasas son los tres macronutrientes principales.", exZh: "蛋白質、碳水化合物和脂肪是三大主要巨量營養素。" },
    { es: "micronutriente", en: "micronutrient", gender: "m", plural: "micronutrientes", pos: "n.", zh: "微量營養素", ex: "Aunque se necesitan en pequeñas cantidades, los micronutrientes son esenciales para la salud.", exZh: "雖然微量營養素所需的量很少,但對健康卻不可或缺。" },
    { es: "grasa saturada", gender: "f", plural: "grasas saturadas", pos: "n.", zh: "飽和脂肪", ex: "Los médicos recomiendan reducir el consumo de grasa saturada para cuidar el corazón.", exZh: "醫生建議減少飽和脂肪的攝取,以維護心臟健康。" },
    { es: "grasa insaturada", gender: "f", plural: "grasas insaturadas", pos: "n.", zh: "不飽和脂肪", ex: "El aceite de oliva es rico en grasa insaturada, considerada más saludable.", exZh: "橄欖油富含不飽和脂肪,被認為對健康較有益。" },
    { es: "grasa trans", gender: "f", plural: "grasas trans", pos: "n.", zh: "反式脂肪", note: "trans 為不變詞,單複數形式相同。", ex: "Muchos países han prohibido la grasa trans en los alimentos procesados.", exZh: "許多國家已經禁止在加工食品中使用反式脂肪。" },
    { es: "calcio", en: "calcium", gender: "m", pos: "n.", zh: "鈣", ex: "Los lácteos son una de las principales fuentes de calcio en la dieta.", exZh: "乳製品是飲食中鈣質的主要來源之一。" },
    { es: "sodio", en: "sodium", gender: "m", pos: "n.", zh: "鈉", ex: "El exceso de sodio en la comida procesada puede elevar la tensión arterial.", exZh: "加工食品中過多的鈉可能會提高血壓。" },
    { es: "potasio", en: "potassium", gender: "m", pos: "n.", zh: "鉀", ex: "El plátano es conocido por su alto contenido en potasio.", exZh: "香蕉以富含鉀質而聞名。" },
    { es: "antioxidante", en: "antioxidant", gender: "m", plural: "antioxidantes", pos: "n.", zh: "抗氧化物", ex: "Los frutos rojos contienen muchos antioxidantes que protegen las células.", exZh: "莓果類含有大量能保護細胞的抗氧化物。" },
    { es: "aditivo", en: "additive", gender: "m", plural: "aditivos", pos: "n.", zh: "添加劑", ex: "Prefiere comprar productos sin aditivos artificiales.", exZh: "她偏好購買不含人工添加劑的產品。" },
    { es: "colorante", en: "colorant", gender: "m", plural: "colorantes", pos: "n.", zh: "色素；著色劑", ex: "Este refresco lleva colorante artificial para darle ese tono tan llamativo.", exZh: "這款汽水添加了人工色素,才會呈現出如此鮮豔的顏色。" },
    { es: "conservante", gender: "m", plural: "conservantes", pos: "n.", zh: "防腐劑", note: "與英文 conservative(保守的)拼字相近但意義不同,勿當成同源詞。", ex: "Esta mermelada casera no lleva conservantes, así que hay que consumirla pronto.", exZh: "這款自製果醬不含防腐劑,所以要儘快食用完畢。" },
    { es: "edulcorante", gender: "m", plural: "edulcorantes", pos: "n.", zh: "甜味劑；代糖", ex: "Sustituyó el azúcar por un edulcorante bajo en calorías.", exZh: "他用低卡路里的代糖取代了砂糖。" },
    { es: "procesado", en: "processed", pos: "adj.", zh: "加工的", ex: "Intenta evitar los alimentos muy procesados y cocinar con ingredientes frescos.", exZh: "他盡量避免食用高度加工的食品,並用新鮮食材烹飪。" },
    { es: "orgánico", en: "organic", pos: "adj.", zh: "有機的", ex: "Cada vez más gente compra verduras orgánicas en el mercado local.", exZh: "越來越多人在當地市場購買有機蔬菜。" },
    { es: "desnutrición", gender: "f", pos: "n.", zh: "營養不良", ex: "La desnutrición infantil sigue siendo un grave problema en algunas regiones del país.", exZh: "兒童營養不良在該國部分地區仍然是一個嚴重的問題。" },
    { es: "flexitariano", en: "flexitarian", gender: "m", plural: "flexitarianos", pos: "n.", zh: "彈性素食者", note: "陰性形式為 flexitariana;也可作形容詞使用(彈性素食的)。", ex: "Como flexitariano, come carne solo una o dos veces por semana.", exZh: "身為彈性素食者,他一週只吃一兩次肉。" },
