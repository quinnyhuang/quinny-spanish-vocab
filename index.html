    { es: "competencia", en: "competence", gender: "f", plural: "competencias", pos: "n.", zh: "能力;才能", note: "Según el contexto también significa 'competencia/rivalidad' (la competencia del mercado); hay que distinguirlo por el sentido de la frase.", ex: "Su competencia en varios idiomas fue decisiva para conseguir el puesto.", exZh: "他精通多國語言的能力,是他能拿到這份工作的關鍵。" },
    { es: "dominio", gender: "m", plural: "dominios", pos: "n.", zh: "精通;掌握;支配", ex: "Tiene un dominio impresionante del francés después de solo dos años viviendo en París.", exZh: "他才在巴黎住了兩年,法文就已經掌握得相當出色。" },
    { es: "paralizado", en: "paralyzed", pos: "adj.", zh: "癱瘓的;(因恐懼或震驚而)僵住不動的", ex: "Se quedó paralizado al ver el accidente desde tan cerca.", exZh: "目睹如此近距離的事故,他嚇得僵在原地動彈不得。" },
    { es: "indignado", en: "indignant", pos: "adj.", zh: "憤慨的;氣憤的", ex: "Los vecinos, indignados con la decisión del ayuntamiento, organizaron una protesta.", exZh: "鄰居們對市政府的決定感到憤慨,於是組織了一場抗議活動。" },
    { es: "despectivo", pos: "adj.", zh: "輕蔑的;貶低的", ex: "Le habló en un tono despectivo que dejó a todos incómodos.", exZh: "他用輕蔑的語氣說話,讓在場所有人都感到不自在。" },
    { es: "exasperado", en: "exasperated", pos: "adj.", zh: "惱怒的;氣惱的", ex: "Después de la tercera llamada sin respuesta, terminó exasperado.", exZh: "打了三次電話都沒人接,他終於忍無可忍。" },
    { es: "intranquilo", pos: "adj.", zh: "不安的;心神不寧的", ex: "Pasó la noche intranquilo, pensando en los resultados del examen.", exZh: "他整晚心神不寧,滿腦子想著考試結果。" },
    { es: "conmocionado", pos: "adj.", zh: "震驚的;震撼的", ex: "El pueblo entero quedó conmocionado tras conocer la noticia del terremoto.", exZh: "全鎮的人在得知地震消息後都感到震驚不已。" },
    { es: "regocijado", pos: "adj.", zh: "欣喜的;興高采烈的", ex: "Regresó a casa regocijado por haber conseguido el trabajo de sus sueños.", exZh: "他因為得到夢寐以求的工作而興高采烈地回到家。" },
    { es: "temeroso", pos: "adj.", zh: "害怕的;膽怯的", ex: "Se acercó al perro con paso temeroso, sin saber si mordería.", exZh: "他小心翼翼、心懷畏懼地靠近那隻狗,不知道牠會不會咬人。" },
    { es: "impactado", pos: "adj.", zh: "震驚的;深受震撼的", note: "常用於口語,表達對某事物印象深刻或大受震撼,語氣比 conmocionado 稍輕。", ex: "Los espectadores quedaron impactados con la fuerza del discurso.", exZh: "觀眾們都被這場演講的震撼力深深打動。" },
    { es: "horrorizado", en: "horrified", pos: "adj.", zh: "感到恐懼的;驚駭的", ex: "Se quedó horrorizado al descubrir el estado en que habían dejado la casa.", exZh: "他發現房子被弄成那樣,感到十分驚駭。" },
    { es: "tenso", en: "tense", pos: "adj.", zh: "緊張的", ex: "El ambiente en la reunión se puso tenso en cuanto se mencionó el despido.", exZh: "一提到裁員,會議的氣氛立刻變得緊張起來。" },
    { es: "agotado", pos: "adj.", zh: "筋疲力盡的;精疲力竭的", ex: "Llegó a casa agotado después de doce horas seguidas de trabajo.", exZh: "連續工作了十二個小時後,他筋疲力盡地回到家。" },
    { es: "avergonzado", pos: "adj.", zh: "尷尬的;感到羞愧的", note: "注意不要與「embarazada」(懷孕的)混淆,兩者發音相近但意思完全不同。", ex: "Se sintió avergonzado al darse cuenta de que había confundido los nombres de todos.", exZh: "他發現自己把大家的名字都搞混了,感到十分尷尬。" },
    { es: "agobiado", pos: "adj.", zh: "不堪重負的;感到壓力沉重的", ex: "Está agobiado con tantas responsabilidades en el trabajo y en casa.", exZh: "工作和家庭的重擔讓他感到喘不過氣來。" },
    { es: "harto", pos: "adj.", zh: "厭煩的;受夠了的", note: "常用於固定結構「estar harto de + 名詞/原形動詞」。", ex: "Estoy harto de que siempre lleguen tarde a las reuniones.", exZh: "我受夠了他們每次開會總是遲到。" },
    { es: "asqueado", pos: "adj.", zh: "感到噁心的;厭惡的", ex: "Salió del restaurante asqueado por la falta de higiene en la cocina.", exZh: "他看到廚房髒亂不堪,感到噁心,於是走出了餐廳。" },
    { es: "perturbador", en: "perturbing", pos: "adj.", zh: "令人不安的;擾亂人心的", ex: "El documental mostraba imágenes perturbadoras sobre el maltrato animal.", exZh: "這部紀錄片呈現了關於虐待動物、令人不安的畫面。" },
    { es: "pena", gender: "f", plural: "penas", pos: "n.", zh: "悲傷;憐憫;遺憾", ex: "Me da mucha pena que no puedas venir a la boda.", exZh: "你不能來婚禮,我覺得很遺憾。" },
    { es: "desprecio", gender: "m", plural: "desprecios", pos: "n.", zh: "輕視;鄙視", ex: "Trató a sus empleados con un desprecio que nadie olvidó.", exZh: "他用一種讓所有人都難以忘懷的輕蔑態度對待員工。" },
    { es: "estupor", en: "stupor", gender: "m", pos: "n.", zh: "驚愕;茫然;恍惚", ex: "La noticia lo dejó en un estado de estupor durante varios minutos.", exZh: "這則消息讓他愣在原地,好幾分鐘說不出話來。" },
    { es: "asco", gender: "m", pos: "n.", zh: "噁心;厭惡", ex: "Me da asco la comida que sirven en esa cafetería.", exZh: "那家咖啡廳供應的食物讓我覺得很噁心。" },
    { es: "ira", en: "ire", gender: "f", pos: "n.", zh: "憤怒;盛怒", ex: "Su ira estalló cuando descubrió la traición de su socio.", exZh: "當他發現合夥人的背叛時,怒火瞬間爆發。" },
    { es: "ansiedad", en: "anxiety", gender: "f", pos: "n.", zh: "焦慮;不安", ex: "La ansiedad antes de los exámenes le impedía dormir bien.", exZh: "考試前的焦慮讓她無法好好入睡。" },
    { es: "asombro", gender: "m", pos: "n.", zh: "驚訝;驚奇", ex: "Contempló el paisaje con asombro, incapaz de articular palabra.", exZh: "他驚訝地凝視著這片風景,一句話也說不出來。" },
    { es: "exaltación", en: "exaltation", gender: "f", pos: "n.", zh: "亢奮;激動", ex: "Vivió el triunfo de su equipo con una exaltación difícil de contener.", exZh: "他懷著難以壓抑的亢奮心情,見證了自己球隊的勝利。" },
    { es: "noviazgo", gender: "m", plural: "noviazgos", pos: "n.", zh: "戀愛關係;交往期", ex: "Llevan tres años de noviazgo antes de decidir casarse.", exZh: "他們交往三年後才決定結婚。" },
    { es: "matrimonio civil", gender: "m", pos: "n.", zh: "公證結婚;民事婚姻", ex: "Optaron por el matrimonio civil porque ninguno de los dos era practicante.", exZh: "由於兩人都沒有宗教信仰,他們選擇了公證結婚。" },
    { es: "matrimonio religioso", gender: "m", pos: "n.", zh: "宗教婚禮;教堂婚禮", ex: "Sus abuelos insistieron en que celebraran también el matrimonio religioso.", exZh: "他們的祖父母堅持要求他們也舉行一場宗教婚禮。" },
    { es: "casamiento", gender: "m", plural: "casamientos", pos: "n.", zh: "婚禮;結婚", note: "拉丁美洲較常用此詞,西班牙則更常用「boda」。", ex: "El casamiento se celebró en una hacienda a las afueras de la ciudad.", exZh: "婚禮在市郊的一座莊園舉行。" },
    { es: "amor platónico", gender: "m", pos: "n.", zh: "柏拉圖式愛情;精神戀愛", ex: "Durante años sintió por su profesora un amor platónico que nunca confesó.", exZh: "多年來他對那位老師懷有一段從未表白的柏拉圖式愛戀。" },
    { es: "relación a distancia", gender: "f", pos: "n.", zh: "遠距離戀愛;異地戀", ex: "Mantener una relación a distancia exige mucha confianza y comunicación constante.", exZh: "維持一段遠距離戀愛需要極大的信任與不間斷的溝通。" },
    { es: "atracción", en: "attraction", gender: "f", plural: "atracciones", pos: "n.", zh: "吸引力", ex: "Sintió una atracción inmediata hacia aquel desconocido en la fiesta.", exZh: "她對派對上那位陌生人立刻產生了強烈的吸引力。" },
    { es: "afecto", en: "affection", gender: "m", pos: "n.", zh: "情感;關愛", ex: "Le demostraba su afecto con pequeños gestos cotidianos.", exZh: "他透過日常生活中的小舉動來表達自己的關愛。" },
    { es: "cariño", gender: "m", pos: "n.", zh: "疼愛;親密感;(稱呼)親愛的", note: "也常直接當作暱稱使用,相當於中文的「親愛的」。", ex: "Con el paso de los años, aquel cariño se convirtió en amor verdadero.", exZh: "隨著歲月流逝,那份情誼逐漸變成了真愛。" },
    { es: "apego", gender: "m", pos: "n.", zh: "依戀;依附", ex: "El niño mostraba un apego especial hacia su abuela.", exZh: "這個孩子對他的祖母表現出特別深的依戀。" },
    { es: "pasión", en: "passion", gender: "f", plural: "pasiones", pos: "n.", zh: "熱情;激情", ex: "Vivía su trabajo con una pasión que contagiaba a todo el equipo.", exZh: "他對工作的熱情感染了整個團隊。" },
    { es: "deseo", en: "desire", gender: "m", plural: "deseos", pos: "n.", zh: "慾望;願望", ex: "Expresó su deseo de viajar por Sudamérica antes de cumplir treinta años.", exZh: "他表達了想在三十歲前遊歷南美洲的願望。" },
    { es: "ternura", gender: "f", pos: "n.", zh: "溫柔;柔情", ex: "Lo miró con una ternura que reveló todo lo que sentía por él.", exZh: "她用一種充滿柔情的眼神看著他,透露出她對他的所有感情。" },
    { es: "flechazo", gender: "m", plural: "flechazos", pos: "n.", zh: "一見鍾情", note: "字面意思是「被箭射中」,源自邱比特之箭的意象。", ex: "Fue un flechazo: se conocieron en la boda de un amigo y no se separaron más.", exZh: "那是一見鍾情:他們在朋友的婚禮上相識,從此再也沒有分開過。" },
    { es: "fidelidad", en: "fidelity", gender: "f", pos: "n.", zh: "忠誠;忠貞", ex: "La fidelidad mutua fue siempre la base de su matrimonio.", exZh: "彼此的忠誠一直是他們婚姻的基石。" },
    { es: "intimidad", en: "intimacy", gender: "f", pos: "n.", zh: "親密;隱私", ex: "Compartían una intimidad construida a lo largo de muchos años juntos.", exZh: "他們共同建立了多年來培養出的親密感。" },
    { es: "apasionado", en: "passionate", pos: "adj.", zh: "熱情的;充滿激情的", ex: "Es un defensor apasionado de los derechos de los animales.", exZh: "他是動物權益的熱情捍衛者。" },
    { es: "cohabitar", en: "cohabit", pos: "v.", zh: "同居", ex: "Decidieron cohabitar un tiempo antes de dar el paso de casarse.", exZh: "在決定結婚之前,他們決定先同居一段時間。" },
    { es: "conquistar", en: "conquer", pos: "v.", zh: "征服;贏得芳心;追求到手", note: "在感情脈絡中意指「贏得某人的芳心」,不一定是字面上的征服。", ex: "Le llevó meses conquistar a su vecina con paciencia y detalles.", exZh: "他花了好幾個月的耐心與貼心舉動,才贏得鄰家女孩的芳心。" },
    { es: "seducir", en: "seduce", pos: "v.", zh: "誘惑;勾引", ex: "Sabía cómo seducir a la audiencia con solo su forma de hablar.", exZh: "他光靠說話的方式就懂得如何吸引全場觀眾。" },
    { es: "cortejar", pos: "v.", zh: "追求;獻殷勤", ex: "Antiguamente, cortejar a una joven implicaba visitas formales a su familia.", exZh: "以前追求一位年輕女子,得正式拜訪她的家人。" },
    { es: "ruptura", en: "rupture", gender: "f", plural: "rupturas", pos: "n.", zh: "破裂;分手", ex: "La ruptura de la pareja fue inevitable después de meses de discusiones constantes.", exZh: "這對情侶的分手在數月不斷爭吵後已是無可避免的。" },
    { es: "infiel", pos: "adj.", zh: "不忠的;出軌的", note: "Se refiere a la falta de lealtad en una relación de pareja; no confundir con el sustantivo inglés \"infidel\" (persona sin determinada fe religiosa).", ex: "Nunca imaginó que fuera infiel; toda la relación se basaba en una mentira.", exZh: "她從沒想過他會不忠;整段感情都建立在謊言之上。" },
    { es: "separación", en: "separation", gender: "f", plural: "separaciones", pos: "n.", zh: "分居;分離", ex: "Tras la separación, ambos acordaron compartir la custodia de los niños.", exZh: "分居後,兩人同意共同分擔孩子的監護權。" },
    { es: "reconciliación", en: "reconciliation", gender: "f", plural: "reconciliaciones", pos: "n.", zh: "和解;復合", ex: "El terapeuta de pareja sugirió varios pasos para facilitar la reconciliación.", exZh: "伴侶治療師提出了幾個步驟,以促成兩人的和解。" },
    { es: "desamor", gender: "m", pos: "n.", zh: "失戀;無情;愛的消逝", note: "Palabra de registro algo literario, muy usada en canciones y poesía para describir la ausencia o pérdida del amor.", ex: "Su último disco está inspirado en el desamor y la soledad que sintió tras la ruptura.", exZh: "他最新的專輯靈感來自分手後感受到的失戀與孤獨。" },
    { es: "desengaño amoroso", gender: "m", pos: "n.", zh: "感情上的幻滅;情傷", ex: "Después de aquel desengaño amoroso, tardó años en volver a confiar en alguien.", exZh: "經歷那次情傷之後,他花了好幾年才重新學會信任別人。" },
    { es: "ex marido", gender: "m", pos: "n.", zh: "前夫", ex: "Se encontró con su ex marido en la boda de un amigo común y la conversación fue bastante incómoda.", exZh: "她在一位共同朋友的婚禮上巧遇前夫,那場對話相當尷尬。" },
    { es: "ex mujer", gender: "f", pos: "n.", zh: "前妻", ex: "Todavía mantiene una buena relación con su ex mujer por el bien de sus hijos.", exZh: "為了孩子著想,他和前妻依然維持著不錯的關係。" },
    { es: "infidelidad", en: "infidelity", gender: "f", plural: "infidelidades", pos: "n.", zh: "不忠;背叛(感情上)", ex: "La infidelidad fue el motivo principal que llevó al divorcio.", exZh: "感情不忠是導致離婚的主要原因。" },
    { es: "traición", gender: "f", plural: "traiciones", pos: "n.", zh: "背叛", note: "También se usa en contextos políticos (traición a la patria), pero en este contexto se refiere a la deslealtad en una relación personal.", ex: "Consideró aquella traición imperdonable y decidió cortar todo contacto.", exZh: "她認為那次背叛不可原諒,決定切斷所有聯繫。" },
    { es: "desconfianza", gender: "f", pos: "n.", zh: "不信任;猜疑", ex: "La desconfianza que sembró aquella mentira nunca desapareció del todo.", exZh: "那個謊言所種下的不信任感,始終未曾完全消失。" },
    { es: "engañar", pos: "v.", zh: "欺騙;哄騙;(感情上)出軌", note: "No confundir con el inglés \"engage\"; \"engañar\" significa mentir o ser infiel, no comprometerse.", ex: "Le costó aceptar que la había engañado durante meses sin que ella se diera cuenta.", exZh: "她很難接受自己被騙了好幾個月卻毫無察覺。" },
    { es: "romper con alguien", pos: "loc.", zh: "和某人分手", ex: "Decidió romper con él en cuanto descubrió los mensajes en su teléfono.", exZh: "她一發現他手機裡的訊息,就決定和他分手。" },
    { es: "distanciar", pos: "v.", zh: "使疏遠;拉開距離", note: "Muy frecuente en forma reflexiva: \"distanciarse de alguien\" (distanciarse de un amigo, de la familia).", ex: "El trabajo constante en el extranjero terminó por distanciar a los dos hermanos.", exZh: "長期在國外工作,最終使這對兄弟漸行漸遠。" },
    { es: "alejar", pos: "v.", zh: "使遠離;疏遠", note: "Como \"distanciar\", suele usarse también en forma reflexiva: \"alejarse de alguien o algo\".", ex: "Sus nuevas responsabilidades la alejaron poco a poco de sus amistades de siempre.", exZh: "她的新責任漸漸讓她疏遠了一直以來的朋友。" },
    { es: "echar de menos", pos: "loc.", zh: "想念;懷念", note: "Expresión típica de España; en gran parte de Latinoamérica se prefiere el verbo \"extrañar\" con el mismo sentido.", ex: "Aunque hablan todos los días por videollamada, sigue echando de menos los abrazos de su familia.", exZh: "雖然他們每天都視訊通話,她仍然想念家人的擁抱。" },
    { es: "elástico", en: "elastic", pos: "adj.", zh: "有彈性的;鬆緊的", ex: "Prefiere los pantalones con cintura elástica porque son mucho más cómodos para viajar.", exZh: "她比較喜歡鬆緊腰的褲子,因為出門旅行時穿起來舒服多了。" },
    { es: "plisado", pos: "adj.", zh: "打褶的;百褶的", ex: "La falda plisada le daba un aire elegante sin dejar de ser práctica para el trabajo.", exZh: "那件百褶裙讓她看起來優雅,同時又適合上班穿著。" },
    { es: "chic", en: "chic", pos: "adj.", zh: "時髦的;別緻的", note: "Préstamo del francés, invariable en género y número.", ex: "Con solo un pañuelo de seda consiguió un look muy chic para la cena.", exZh: "她只用了一條絲巾,就為晚餐營造出非常時髦的造型。" },
    { es: "acampanado", pos: "adj.", zh: "喇叭形的;喇叭狀的", ex: "Los pantalones acampanados volvieron a ponerse de moda entre los más jóvenes.", exZh: "喇叭褲又在年輕人之間重新流行起來。" },
    { es: "estampado", pos: "adj.", zh: "印花的", note: "También se usa como sustantivo masculino: \"el estampado\" (el diseño o dibujo de la tela).", ex: "Llevaba una camisa estampada con motivos florales que llamaba mucho la atención.", exZh: "他穿著一件印有花朵圖案的印花襯衫,十分引人注目。" },
    { es: "en boga", pos: "loc.", zh: "流行的;時興的", ex: "El uso de tejidos reciclados está muy en boga entre las nuevas marcas de moda.", exZh: "使用回收布料的做法,在新興時尚品牌之間非常流行。" },
    { es: "a la medida", pos: "loc.", zh: "量身訂做的;客製化的", ex: "Se hizo un traje a la medida para la boda de su hermana.", exZh: "他為了妹妹的婚禮訂做了一套量身訂製的西裝。" },
    { es: "de cuadros", pos: "loc.", zh: "格紋的;方格圖案的", ex: "La camisa de cuadros combinaba perfectamente con los vaqueros oscuros.", exZh: "那件格紋襯衫和深色牛仔褲搭配得恰到好處。" },
    { es: "floral", en: "floral", pos: "adj.", zh: "花卉圖案的;花卉的", ex: "El vestido floral es perfecto para una boda al aire libre en primavera.", exZh: "這件花卉圖案的洋裝非常適合春天的戶外婚禮。" },
    { es: "entallado", pos: "adj.", zh: "合身的;剪裁貼身的", ex: "El vestido entallado resaltaba su figura sin resultar incómodo.", exZh: "這件合身洋裝襯托出她的身材,穿起來卻不會不舒服。" },
    { es: "en onda", pos: "loc.", zh: "時髦的;跟得上潮流的", note: "Expresión coloquial, usada sobre todo en España.", ex: "Mi sobrina siempre sabe qué está en onda antes que nadie.", exZh: "我姪女總是比任何人都更早知道什麼正在流行。" },
    { es: "sin mangas", pos: "loc.", zh: "無袖的", ex: "Compró una camiseta sin mangas para hacer ejercicio en verano.", exZh: "她買了一件無袖上衣,準備在夏天運動時穿。" },
    { es: "casar", pos: "v.", zh: "相配;搭配(顏色、服裝等)", note: "No confundir con \"casarse\" (contraer matrimonio); este uso intransitivo significa que dos cosas combinan bien entre sí.", ex: "El color del bolso no casa muy bien con el resto del conjunto.", exZh: "這個包包的顏色和整體穿搭不太搭配。" },
    { es: "chillar", pos: "v.", zh: "(顏色)不協調、刺眼;(主要義)尖叫、大喊", note: "El significado principal es \"gritar\"; el uso referido a colores que no combinan es una extensión figurada y coloquial.", ex: "Esos dos colores chillan juntos; prueba a combinar el rojo con algo más neutro.", exZh: "這兩個顏色放在一起很不協調,試著把紅色搭配比較中性的顏色吧。" },
    { es: "albornoz", gender: "m", plural: "albornoces", pos: "n.", zh: "浴袍", ex: "Salió de la ducha, se puso el albornoz y bajó a preparar el desayuno.", exZh: "她洗完澡後穿上浴袍,下樓去準備早餐。" },
    { es: "lencería", gender: "f", pos: "n.", zh: "女性內衣;內衣;(舊)家用亞麻織品", note: "Hoy en día se usa casi siempre para referirse a la ropa interior femenina, aunque históricamente también designaba la ropa blanca del hogar.", ex: "La tienda amplió su sección de lencería justo antes de San Valentín.", exZh: "那家店在情人節前夕擴大了內衣部門的商品線。" },
    { es: "delantal", gender: "m", plural: "delantales", pos: "n.", zh: "圍裙", ex: "Mi abuela nunca cocina sin ponerse el delantal que le regalé hace años.", exZh: "我奶奶做菜時,總是會繫上我多年前送她的那條圍裙。" },
    { es: "pijama mono", gender: "m", pos: "n.", zh: "連身式睡衣;包屁衣睡衣", note: "Se refiere a un pijama de una sola pieza, típico de bebés y niños, aunque también existen versiones para adultos como ropa de estar en casa.", ex: "A mi sobrino le encanta dormir con su pijama mono de dinosaurio.", exZh: "我姪子超愛穿著他的恐龍連身式睡衣睡覺。" },
    { es: "poncho", en: "poncho", gender: "m", plural: "ponchos", pos: "n.", zh: "斗篷;披風式外套", ex: "Se echó el poncho sobre los hombros en cuanto empezó a soplar el viento frío de la sierra.", exZh: "山區冷風一吹起,他立刻把斗篷披到肩上。" },
    { es: "sobretodo", gender: "m", plural: "sobretodos", pos: "n.", zh: "大衣;外套", note: "No confundir con la locución adverbial \"sobre todo\" (sobre todo, ante todo), que se escribe en dos palabras y tiene un significado distinto.", ex: "Se puso el sobretodo gris antes de salir a la calle, donde hacía un frío intenso.", exZh: "他穿上灰色大衣才出門,外頭天氣非常寒冷。" },
    { es: "bolsillo", gender: "m", plural: "bolsillos", pos: "n.", zh: "口袋", ex: "Metió las llaves en el bolsillo del abrigo y salió corriendo para no perder el autobús.", exZh: "他把鑰匙塞進外套口袋,匆忙跑出去以免錯過公車。" },
    { es: "lazo", gender: "m", plural: "lazos", pos: "n.", zh: "蝴蝶結;絲帶結", note: "En otros contextos también significa \"lazo, cuerda\" (de donde viene el inglés \"lasso\") o, en sentido figurado, \"vínculo\" afectivo.", ex: "La niña llevaba un lazo rosa enorme sujetando su coleta.", exZh: "那個小女孩頭上綁著一個巨大的粉紅色蝴蝶結,固定著她的馬尾。" },
    { es: "botón", en: "button", gender: "m", plural: "botones", pos: "n.", zh: "鈕扣;按鈕", note: "También significa \"botón\" en el sentido de pulsador (de una máquina, un ascensor, etc.).", ex: "Se le cayó un botón de la camisa justo antes de la entrevista de trabajo.", exZh: "就在面試前,他襯衫上的一顆鈕扣掉了。" },
    { es: "entidad", en: "entity", gender: "f", plural: "entidades", pos: "n.", zh: "機構；實體（法律、商業或社會組織）", ex: "La ONG se registró como entidad sin ánimo de lucro para poder recibir donaciones deducibles de impuestos.", exZh: "該非政府組織登記為非營利實體，以便能夠收到可抵稅的捐款。" },
    { es: "consejo", gender: "m", plural: "consejos", pos: "n.", zh: "建議；委員會，理事會", note: "También significa \"advice\" (un consejo = a piece of advice), sentido igual de frecuente que el de \"board/council\".", ex: "El consejo de administración se reunió de urgencia para decidir sobre la fusión con la empresa rival.", exZh: "董事會緊急開會，決定是否與競爭對手公司合併。" },
    { es: "liderazgo", gender: "m", pos: "n.", zh: "領導力；領導地位", ex: "Su liderazgo fue decisivo para sacar a la empresa de la crisis financiera.", exZh: "她的領導力對於帶領公司走出財務危機至關重要。" },
    { es: "bancarrota", gender: "f", pos: "n.", zh: "破產", note: "Se usa sobre todo en la expresión \"declararse en bancarrota\".", ex: "Tras años de pérdidas acumuladas, la compañía se declaró en bancarrota el mes pasado.", exZh: "經過多年累積虧損，該公司上個月宣告破產。" },
    { es: "cargo", gender: "m", plural: "cargos", pos: "n.", zh: "職位，職務；主管的職責", note: "No confundir con el inglés \"cargo\" (mercancía); ese sentido en español es \"carga\".", ex: "Fue ascendida al cargo de directora regional después de diez años en la empresa.", exZh: "在公司工作十年後，她被晉升為區域總監一職。" },
    { es: "encargado", pos: "adj.", zh: "負責的；主管的", note: "Se usa muy a menudo como sustantivo (el encargado / la encargada) para referirse a la persona a cargo de un lugar o tarea.", ex: "El empleado encargado de la caja registradora cerró el turno sin cuadrar el dinero.", exZh: "負責收銀機的員工下班結帳時，帳目對不上。" },
    { es: "dueño", gender: "m", plural: "dueños", pos: "n.", zh: "主人；老闆，業主", ex: "El dueño del restaurante decidió cerrar el local durante las obras del edificio.", exZh: "餐廳老闆決定在大樓施工期間暫停營業。" },
    { es: "comercio", en: "commerce", gender: "m", plural: "comercios", pos: "n.", zh: "商業，貿易；商店", ex: "El comercio electrónico ha transformado la manera en que compramos productos cotidianos.", exZh: "電子商務已經改變了我們購買日常用品的方式。" },
    { es: "cobrar", pos: "v.", zh: "收費；領取（薪水）；收回", note: "También significa \"ganar/recibir un sueldo\" (cobrar a fin de mes).", ex: "El fontanero cobra por hora, así que conviene preguntar el presupuesto antes de empezar.", exZh: "水管工是按時計費的，所以最好在開工前先問清楚報價。" },
    { es: "lema", gender: "m", plural: "lemas", pos: "n.", zh: "座右銘；標語，口號", note: "Sustantivo masculino aunque termine en \"-a\": el lema.", ex: "El lema de la campaña publicitaria era sencillo pero pegadizo: \"Vive el momento\".", exZh: "這次廣告活動的標語簡單卻朗朗上口：「活在當下」。" },
    { es: "experiencia", en: "experience", gender: "f", plural: "experiencias", pos: "n.", zh: "經驗；經歷", ex: "La entrevista se centró más en sus habilidades prácticas que en su experiencia académica.", exZh: "這次面試著重在她的實務技能，而非學術經歷。" },
    { es: "aprendiz", en: "apprentice", gender: "m", plural: "aprendices", pos: "n.", zh: "學徒；實習生", note: "Sustantivo de género común: el aprendiz / la aprendiz.", ex: "El aprendiz de carpintero pasó su primer mes lijando tablones y observando al maestro.", exZh: "這名木工學徒第一個月都在打磨木板、觀察師傅的手藝。" },
    { es: "experto", en: "expert", gender: "m", plural: "expertos", pos: "n.", zh: "專家", ex: "Consultaron a un experto en seguridad informática antes de lanzar la nueva plataforma.", exZh: "在推出新平台之前，他們諮詢了一位資訊安全專家。" },
    { es: "carrera", en: "career", gender: "f", plural: "carreras", pos: "n.", zh: "職業生涯；大學學位科系；賽跑", note: "Según el contexto también significa \"carrera universitaria\" (degree/major) o \"carrera\" en el sentido de correr una carrera (race).", ex: "Decidió dejar su carrera como abogada para dedicarse por completo a la pintura.", exZh: "她決定放棄律師的職業生涯，全心投入繪畫。" },
    { es: "oficio", gender: "m", plural: "oficios", pos: "n.", zh: "行業，職業（尤指手藝、技術性工作）", note: "No significa \"office\" (eso es \"oficina\"); \"oficio\" se refiere a un trabajo manual o artesanal.", ex: "Aprendió el oficio de zapatero de su abuelo, que tenía un pequeño taller en el barrio.", exZh: "他跟爺爺學會了鞋匠這門手藝，爺爺在社區裡開了間小工坊。" },
    { es: "baja", gender: "f", plural: "bajas", pos: "n.", zh: "（病假、產假等）休假；停職，減員", note: "Expresión frecuente: \"estar de baja\" (to be on leave).", ex: "Lleva tres semanas de baja por una operación de rodilla.", exZh: "她因為膝蓋手術已經請病假三週了。" },
    { es: "almacén", gender: "m", plural: "almacenes", pos: "n.", zh: "倉庫；（拉美）雜貨店", ex: "Los pedidos se preparan en el almacén central antes de enviarse a las tiendas.", exZh: "訂單會先在中央倉庫備貨，再送到各門市。" },
    { es: "logística", en: "logistics", gender: "f", pos: "n.", zh: "物流；後勤", ex: "La empresa contrató a una consultora para mejorar la logística de distribución.", exZh: "公司聘請了一家顧問公司來改善配送物流。" },
    { es: "entrega", gender: "f", plural: "entregas", pos: "n.", zh: "交付，遞送；（分期）交付款", ex: "El plazo de entrega se retrasó una semana por problemas en la aduana.", exZh: "由於海關問題，交貨期延後了一週。" },
    { es: "jardín trasero", gender: "m", pos: "n.", zh: "後院", ex: "Los niños jugaban al fútbol en el jardín trasero mientras los adultos preparaban la barbacoa.", exZh: "大人在準備烤肉時，孩子們在後院踢足球。" },
    { es: "valla", gender: "f", plural: "vallas", pos: "n.", zh: "圍欄，柵欄；（valla publicitaria）廣告看板", ex: "Instalaron una valla alrededor de la piscina para evitar accidentes con los niños pequeños.", exZh: "他們在泳池四周裝了圍欄，以避免小孩發生意外。" },
    { es: "cabaña", en: "cabin", gender: "f", plural: "cabañas", pos: "n.", zh: "小木屋，山間小屋", ex: "Pasamos el fin de semana en una cabaña de montaña sin cobertura ni wifi.", exZh: "我們在一間沒有訊號也沒有網路的山間小木屋度過了週末。" },
    { es: "recibidor", gender: "m", plural: "recibidores", pos: "n.", zh: "玄關，門廳", ex: "Dejó las llaves y el paraguas en la mesita del recibidor nada más entrar.", exZh: "她一進門就把鑰匙和雨傘放在玄關的小桌上。" },
    { es: "césped", gender: "m", pos: "n.", zh: "草坪；草皮", ex: "Todos los sábados por la mañana corta el césped antes de que empiece el calor.", exZh: "他每週六早上都會在天氣變熱之前修剪草坪。" },
    { es: "porche", en: "porch", gender: "m", plural: "porches", pos: "n.", zh: "門廊，玄關外廊", ex: "Nos sentamos en el porche a tomar café mientras veíamos llover.", exZh: "我們坐在門廊上一邊喝咖啡，一邊看雨。" },
    { es: "cuarto de los niños", gender: "m", pos: "n.", zh: "兒童房", ex: "Pintaron el cuarto de los niños de azul claro antes de que naciera el bebé.", exZh: "在寶寶出生之前，他們把兒童房漆成了淺藍色。" },
    { es: "despensa", gender: "f", plural: "despensas", pos: "n.", zh: "食品儲藏室，儲藏櫃", ex: "Revisó la despensa y se dio cuenta de que ya no quedaba ni una lata de tomate.", exZh: "她檢查了儲藏室，發現連一罐番茄罐頭都沒有了。" },
    { es: "calefacción", gender: "f", pos: "n.", zh: "暖氣，暖氣系統", ex: "En invierno la factura sube mucho porque la calefacción está encendida todo el día.", exZh: "冬天的帳單會漲很多，因為暖氣整天都開著。" },
    { es: "aire acondicionado", en: "air conditioning", gender: "m", pos: "n.", zh: "冷氣，空調", ex: "Pusieron el aire acondicionado al máximo porque hacía un calor insoportable.", exZh: "因為熱得受不了，他們把冷氣開到最強。" },
    { es: "litera", gender: "f", plural: "literas", pos: "n.", zh: "雙層床，上下鋪；（火車、船的）臥鋪", ex: "Los hermanos compartían una litera en su pequeño dormitorio.", exZh: "兄弟倆在他們的小房間裡共用一張上下鋪。" },
    { es: "mesilla", gender: "f", plural: "mesillas", pos: "n.", zh: "床頭櫃", note: "También se dice \"mesita de noche\" según la región.", ex: "Dejó el móvil cargando en la mesilla antes de apagar la luz.", exZh: "她在關燈之前把手機放在床頭櫃上充電。" },
    { es: "cuna", gender: "f", plural: "cunas", pos: "n.", zh: "嬰兒床；（比喻）發源地，搖籃", ex: "Montaron la cuna en la habitación del bebé un mes antes de la fecha del parto.", exZh: "他們在預產期前一個月就把嬰兒床組裝好放進嬰兒房。" },
    { es: "mesa de centro", gender: "f", pos: "n.", zh: "茶几", ex: "Puso los pies sobre la mesa de centro y su madre lo regañó al instante.", exZh: "他把腳放在茶几上，媽媽立刻罵了他。" },
    { es: "coqueta", gender: "f", plural: "coquetas", pos: "n.", zh: "梳妝台（家具）", note: "También existe \"coqueta\" como adjetivo/sustantivo para una persona coqueta (flirtatious); aquí se refiere al mueble.", ex: "Se maquilló frente a la coqueta antes de salir a la fiesta.", exZh: "她在梳妝台前化好妝才出門參加派對。" },
    { es: "empapelado", gender: "m", pos: "n.", zh: "壁紙；貼壁紙（施工）", ex: "Cambiaron el empapelado del salón por uno con motivos florales más modernos.", exZh: "他們把客廳的壁紙換成了較現代的花卉圖案。" },
    { es: "bombilla", gender: "f", plural: "bombillas", pos: "n.", zh: "燈泡", note: "En varios países de Latinoamérica se dice \"foco\" o \"bombillo\".", ex: "Se fundió la bombilla del pasillo y tuvimos que subir al desván a buscar otra.", exZh: "走廊的燈泡燒壞了，我們得爬上閣樓找新的。" },
    { es: "araña", gender: "f", plural: "arañas", pos: "n.", zh: "吊燈（水晶燈）；蜘蛛", note: "El significado más común de \"araña\" es \"spider\"; aquí se refiere a una lámpara de techo con varios brazos.", ex: "Una enorme araña de cristal colgaba del techo del salón de baile.", exZh: "一盞巨大的水晶吊燈懸掛在舞廳的天花板上。" },
    { es: "despertador", gender: "m", plural: "despertadores", pos: "n.", zh: "鬧鐘", ex: "Puso el despertador a las seis, pero terminó apagándolo y volviéndose a dormir.", exZh: "他把鬧鐘設在六點，結果卻按掉又繼續睡了。" },
    { es: "colcha", gender: "f", plural: "colchas", pos: "n.", zh: "床罩，被罩", note: "No confundir con \"colchón\" (mattress) ni con el inglés \"couch\" (sofá).", ex: "Compró una colcha nueva para darle un aire más cálido al dormitorio en invierno.", exZh: "她買了一條新床罩，讓臥室在冬天顯得更溫馨。" },
    { es: "jarrón", gender: "m", plural: "jarrones", pos: "n.", zh: "花瓶", ex: "El gato tiró el jarrón de la mesa y se hizo añicos contra el suelo.", exZh: "貓把花瓶從桌上撞下來，摔得粉碎。" },
    { es: "bote", gender: "m", plural: "botes", pos: "n.", zh: "罐子，容器；（also）小船", note: "Según el contexto puede significar un recipiente (jar/can) o una embarcación pequeña (boat).", ex: "Guardó las galletas caseras en un bote de cristal con tapa hermética.", exZh: "她把自製餅乾裝進一個密封的玻璃罐裡。" },
    { es: "pelador", gender: "m", plural: "peladores", pos: "n.", zh: "削皮刀，削皮器", ex: "Con el pelador nuevo pela las patatas en la mitad de tiempo.", exZh: "用新的削皮刀，她削馬鈴薯的時間縮短了一半。" },
    { es: "espumadera", gender: "f", plural: "espumaderas", pos: "n.", zh: "漏勺", ex: "Usó la espumadera para sacar las croquetas del aceite sin que quedaran empapadas.", exZh: "她用漏勺把可樂餅從油裡撈出來，避免吸太多油。" },
    { es: "gatear", pos: "v.", zh: "(嬰兒或動物般)爬行", ex: "El bebé empezó a gatear por toda la sala mientras su madre lo vigilaba de reojo.", exZh: "寶寶開始在客廳裡到處爬,媽媽在一旁用眼角餘光看著他。" },
    { es: "empujar", pos: "v.", zh: "推;推動", ex: "Tuvimos que empujar el coche hasta la gasolinera porque se había quedado sin batería.", exZh: "我們得把車推到加油站,因為車子的電瓶沒電了。" },
    { es: "tirar", pos: "v.", zh: "拉;丟,扔;投擲", note: "依語境可指「拉」(門上常標示 tirar/empujar)、「丟棄」(tirar la basura)或「投擲」。", ex: "En la puerta ponía \"tirar\", pero casi todos la empujaban sin leer el cartel.", exZh: "門上寫著「拉」,但幾乎每個人都沒看標示就直接用推的。" },
    { es: "arrastrar", pos: "v.", zh: "拖,拽;拖曳", ex: "El perro se negaba a caminar, así que tuve que arrastrarlo suavemente hasta el parque.", exZh: "狗狗不肯走路,我只好輕輕把牠拖到公園去。" },
    { es: "tambalearse", pos: "v.", zh: "搖晃,踉蹌;不穩", note: "也可用不及物形式 tambalear,但反身式 tambalearse 在日常口語中更常見。", ex: "Tras el terremoto, los edificios más antiguos del barrio se tambaleaban de forma alarmante.", exZh: "地震過後,那一區最老舊的建築物搖晃得令人擔憂。" },
    { es: "agacharse", pos: "v.", zh: "彎腰,蹲下", note: "及物形式 agachar 需搭配受詞(如 agachar la cabeza 低頭),但獨立表示「彎腰、蹲下」時用反身式 agacharse。", ex: "Tuve que agacharme para recoger las llaves que se me habían caído debajo del asiento.", exZh: "我得彎下腰去撿掉到座位底下的鑰匙。" },
    { es: "arrodillarse", pos: "v.", zh: "跪下", note: "及物 arrodillar 意為「使跪下」,但表示「自己跪下」的常用形式是反身式 arrodillarse。", ex: "El futbolista se arrodilló en el césped para celebrar su gol con los brazos abiertos.", exZh: "那位足球員跪在草地上,張開雙臂慶祝他的進球。" },
    { es: "tumbar", pos: "v.", zh: "弄倒,撂倒;(反身 tumbarse)躺下", note: "表示「躺下」時常用反身式 tumbarse,如 tumbarse en el sofá。", ex: "El boxeador consiguió tumbar a su rival con un solo golpe en el segundo asalto.", exZh: "那位拳擊手在第二回合僅用一拳就把對手擊倒了。" },
    { es: "incorporarse", pos: "v.", zh: "(從躺臥姿勢)坐起,站起身", note: "及物 incorporar 另有「納入、編入」之意(如 incorporar datos),但表示「坐起身」須用反身式 incorporarse。", ex: "El paciente se incorporó lentamente en la cama en cuanto oyó entrar al médico.", exZh: "病人一聽到醫生走進來,就慢慢地從床上坐起身來。" },
    { es: "agarrar", pos: "v.", zh: "抓住,握住", ex: "Agárrate bien a la barandilla, que las escaleras están muy resbaladizas hoy.", exZh: "抓緊扶手,今天樓梯很滑。" },
    { es: "encoger", pos: "v.", zh: "(使)收縮,縮小;蜷縮", note: "常見片語 encogerse de hombros,意為「聳肩」。", ex: "La camiseta de algodón encogió bastante después de lavarla con agua caliente.", exZh: "這件棉質T恤用熱水洗過之後縮水了不少。" },
    { es: "tropezar", pos: "v.", zh: "絆倒,跌跤", ex: "Tropezó con el bordillo de la acera y estuvo a punto de caerse delante de todos.", exZh: "他被人行道邊的路緣絆了一下,差點就在眾人面前跌倒。" },
    { es: "resbalar", pos: "v.", zh: "滑倒,打滑", ex: "Con la lluvia, el suelo del andén se vuelve tan liso que es fácil resbalar.", exZh: "下雨的時候,月台地面變得非常滑,很容易滑倒。" },
    { es: "deslizar", pos: "v.", zh: "使滑動,滑移", note: "反身式 deslizarse 常用來表示「(人或物)滑行」。", ex: "El niño deslizó la carta por debajo de la puerta para que nadie lo viera.", exZh: "小男孩把信偷偷從門縫底下滑進去,不讓任何人看到。" },
    { es: "cojear", pos: "v.", zh: "跛行,一瘸一拐地走", ex: "Desde el accidente, mi abuelo cojea ligeramente de la pierna izquierda.", exZh: "自從那次意外之後,我爺爺走路左腿就有點跛。" },
    { es: "temblar", pos: "v.", zh: "顫抖,發抖", ex: "Le temblaban las manos de los nervios justo antes de salir al escenario.", exZh: "她上台前緊張得雙手直發抖。" },
    { es: "tiritar", pos: "v.", zh: "(因寒冷或發燒)打哆嗦,發抖", ex: "Esperamos el autobús tiritando de frío durante casi media hora bajo la nieve.", exZh: "我們在雪中冷得直打哆嗦地等了將近半小時的公車。" },
    { es: "gesticular", en: "to gesticulate", pos: "v.", zh: "打手勢,比手畫腳", ex: "El profesor gesticulaba tanto al explicar la teoría que se le cayeron las gafas dos veces.", exZh: "教授講解理論時比手畫腳得太誇張,眼鏡因此掉了兩次。" },
    { es: "de pie", pos: "loc.", zh: "站著;站立", note: "原字串「de pie de」疑為擷取重複所致的雜訊,正確固定用法為 de pie。", ex: "Pasamos casi tres horas de pie esperando a que abrieran las puertas del concierto.", exZh: "我們站著等了將近三個小時,演唱會的大門才開。" },
    { es: "sentado", pos: "adj.", zh: "坐著的", ex: "Prefiero trabajar sentado en un escritorio en vez de repantigado en el sofá.", exZh: "比起窩在沙發上,我更喜歡坐在書桌前工作。" },
    { es: "acostado", pos: "adj.", zh: "躺著的,臥著的", ex: "El médico le pidió que se quedara acostado boca arriba durante toda la radiografía.", exZh: "醫生要求他在照X光的過程中全程仰躺不動。" },
    { es: "rígido", en: "rigid", pos: "adj.", zh: "僵硬的;死板的,嚴格的", ex: "Después de dormir en mala postura, se despertó con el cuello completamente rígido.", exZh: "他睡姿不良,醒來時脖子整個僵硬得動不了。" },
    { es: "fuerza", gender: "f", pos: "n.", zh: "力量;力氣;(物理)力", ex: "Se necesita mucha fuerza de voluntad para mantener una rutina de ejercicio todos los días.", exZh: "要維持每天運動的習慣需要很強的意志力。" },
    { es: "resistencia", en: "resistance", gender: "f", pos: "n.", zh: "耐力,持久力;(物理/電)阻力,抵抗", note: "在健身脈絡中常指「耐力」,和英文 resistance training(阻力訓練)的語意相關但不完全對等。", ex: "Los corredores de fondo entrenan la resistencia con sesiones largas a ritmo moderado.", exZh: "長跑選手透過長時間、中等配速的訓練來鍛鍊耐力。" },
    { es: "halterofilia", gender: "f", pos: "n.", zh: "舉重(運動)", ex: "La halterofilia fue uno de los deportes más seguidos de los Juegos Olímpicos ese año.", exZh: "那一年舉重是奧運中最受矚目的項目之一。" },
    { es: "musculación", gender: "f", pos: "n.", zh: "肌力訓練,健身增肌", ex: "Empezó a hacer musculación tres veces por semana para tonificar los brazos.", exZh: "他開始每週做三次肌力訓練,想讓手臂更結實。" },
    { es: "estiramiento", gender: "m", pos: "n.", zh: "伸展,拉筋", ex: "Nunca me salto los estiramientos al final del entrenamiento para evitar lesiones.", exZh: "我從不省略訓練結束後的伸展運動,以避免受傷。" },
    { es: "mancuerna", gender: "f", plural: "mancuernas", pos: "n.", zh: "啞鈴", ex: "Compré un par de mancuernas ajustables para entrenar en casa sin ir al gimnasio.", exZh: "我買了一組可調式啞鈴,不用去健身房也能在家訓練。" },
    { es: "disco de pesa", gender: "m", plural: "discos de pesa", pos: "n.", zh: "槓片,重量片", ex: "Cada disco de pesa pesaba veinte kilos, así que la barra completa era bastante pesada.", exZh: "每片槓片重二十公斤,所以整支槓鈴加起來相當重。" },
    { es: "cinta de correr", gender: "f", plural: "cintas de correr", pos: "n.", zh: "跑步機", ex: "Cuando llueve, prefiero correr en la cinta del gimnasio en lugar de salir a la calle.", exZh: "下雨的時候,我寧可在健身房的跑步機上跑,也不想到外面去。" },
    { es: "elíptica", en: "elliptical", gender: "f", plural: "elípticas", pos: "n.", zh: "橢圓機", ex: "La elíptica es más suave para las rodillas que la cinta de correr.", exZh: "相較於跑步機,橢圓機對膝蓋的負擔比較小。" },
    { es: "bicicleta estática", gender: "f", plural: "bicicletas estáticas", pos: "n.", zh: "健身腳踏車,飛輪車", ex: "Pedaleé en la bicicleta estática durante cuarenta minutos mientras veía una serie.", exZh: "我一邊看影集,一邊在健身腳踏車上騎了四十分鐘。" },
    { es: "máquina de remo", gender: "f", plural: "máquinas de remo", pos: "n.", zh: "划船機", ex: "La máquina de remo trabaja tanto la espalda como las piernas en un solo movimiento.", exZh: "划船機能在同一個動作中同時鍛鍊背部和腿部肌肉。" },
    { es: "colchoneta", gender: "f", plural: "colchonetas", pos: "n.", zh: "運動墊,瑜珈墊", ex: "Extendí la colchoneta en el suelo del salón para hacer mis ejercicios de espalda.", exZh: "我在客廳地板鋪上運動墊,做背部的伸展運動。" },
    { es: "culturista", gender: "m", plural: "culturistas", pos: "n.", zh: "健美運動員", note: "共性名詞(género común),依所指人物性別使用 el culturista 或 la culturista。", ex: "El culturista pasaba horas en el gimnasio definiendo cada grupo muscular antes de la competición.", exZh: "那位健美運動員在比賽前花了好幾個小時在健身房雕塑每一塊肌肉。" },
    { es: "abdominal", en: "abdominal", gender: "m", plural: "abdominales", pos: "n.", zh: "腹肌;(常用複數)仰臥起坐,捲腹運動", ex: "Hago cien abdominales cada noche antes de acostarme.", exZh: "我每晚睡前都會做一百下仰臥起坐。" },
    { es: "glúteo", en: "gluteus", gender: "m", plural: "glúteos", pos: "n.", zh: "臀肌", ex: "Las sentadillas son uno de los mejores ejercicios para fortalecer el glúteo.", exZh: "深蹲是強化臀肌最有效的運動之一。" },
    { es: "cuádriceps", en: "quadriceps", gender: "m", pos: "n.", zh: "股四頭肌", note: "為不變化名詞,單複數同形(el cuádriceps / los cuádriceps)。", ex: "Tras la lesión, tuvo que hacer fisioterapia para recuperar la fuerza del cuádriceps.", exZh: "受傷之後,他必須做物理治療才能恢復股四頭肌的力量。" },
    { es: "isquiotibial", gender: "m", plural: "isquiotibiales", pos: "n.", zh: "膕繩肌,大腿後肌群", ex: "Se lesionó el isquiotibial al intentar acelerar demasiado rápido en la última vuelta.", exZh: "他在最後一圈試圖加速過猛,結果拉傷了膕繩肌。" },
    { es: "gemelo", gender: "m", plural: "gemelos", pos: "n.", zh: "腓腸肌,小腿肌;(主要義)雙胞胎之一", note: "本義為「雙胞胎」,在健身脈絡中則指小腿後方的腓腸肌,常用複數 gemelos。", ex: "Se le cargó el gemelo derecho a mitad de la carrera y tuvo que parar en seco.", exZh: "他在比賽跑到一半時右小腿肌肉抽筋,只好立刻停下來。" },
    { es: "bíceps", en: "biceps", gender: "m", pos: "n.", zh: "二頭肌", note: "單複數同形(el bíceps / los bíceps)。", ex: "Levantaba la mancuerna despacio para notar cómo trabajaba el bíceps.", exZh: "他慢慢舉起啞鈴,感受二頭肌用力的感覺。" },
    { es: "tríceps", en: "triceps", gender: "m", pos: "n.", zh: "三頭肌", note: "單複數同形(el tríceps / los tríceps)。", ex: "Las fondos en paralelas son excelentes para desarrollar el tríceps.", exZh: "雙槓撐體是鍛鍊三頭肌非常有效的動作。" },
    { es: "deltoides", en: "deltoid", gender: "m", pos: "n.", zh: "三角肌", note: "單複數同形(el deltoides / los deltoides)。", ex: "El press militar es uno de los ejercicios más completos para el deltoides.", exZh: "肩上推舉是鍛鍊三角肌最全面的動作之一。" },
    { es: "pectoral", en: "pectoral", gender: "m", plural: "pectorales", pos: "n.", zh: "胸肌", ex: "El press de banca es el ejercicio clásico para desarrollar el pectoral.", exZh: "臥推是鍛鍊胸肌最經典的動作。" },
    { es: "calentar", pos: "v.", zh: "熱身;加熱", ex: "Siempre calentamos diez minutos antes de empezar a levantar pesas.", exZh: "我們開始舉重之前一定會先熱身十分鐘。" },
    { es: "ejercicio cardiovascular", en: "cardiovascular exercise", gender: "m", plural: "ejercicios cardiovasculares", pos: "n.", zh: "心肺運動,有氧運動", ex: "El médico le recomendó incluir ejercicio cardiovascular al menos tres veces por semana.", exZh: "醫生建議他每週至少安排三次心肺運動。" },
    { es: "repetición", en: "repetition", gender: "f", plural: "repeticiones", pos: "n.", zh: "(訓練中的)一下,重複次數;重複", ex: "Hicimos tres series de doce repeticiones para trabajar el pecho.", exZh: "我們做了三組、每組十二下來鍛鍊胸肌。" },
    { es: "serie", gender: "f", plural: "series", pos: "n.", zh: "(訓練中的)一組", note: "serie 一般也指「影集、系列」;此處為健身術語,指同一動作反覆進行的一組訓練。", ex: "Descansa un minuto entre cada serie para que los músculos se recuperen bien.", exZh: "每組之間休息一分鐘,讓肌肉充分恢復。" },
    { es: "hacer flexiones", pos: "loc.", zh: "做伏地挺身", ex: "Cada mañana hace cincuenta flexiones y cien abdominales antes de ducharse.", exZh: "他每天早上洗澡前都會做五十下伏地挺身和一百下仰臥起坐。" },
    { es: "trotar", pos: "v.", zh: "慢跑;(馬)快步走", ex: "Cada mañana trota por el parque antes de que amanezca del todo.", exZh: "她每天早上天還沒完全亮就會去公園慢跑。" },
    { es: "entrenar", pos: "v.", zh: "訓練;鍛鍊", ex: "El nuevo técnico entrena al equipo dos veces al día durante la pretemporada.", exZh: "新任教練在季前訓練期間,一天讓球隊訓練兩次。" },
    { es: "vencer", pos: "v.", zh: "打敗;戰勝;克服(困難);(期限)屆滿", note: "除了「戰勝」之外,也常用於表示期限、合約等「到期、屆滿」,例如 el plazo vence mañana。", ex: "El equipo local venció al visitante por dos goles a uno en un partido muy reñido.", exZh: "主隊在一場勢均力敵的比賽中以二比一擊敗了客隊。" },
    { es: "encestar", pos: "v.", zh: "(籃球)投籃得分,進球", ex: "El base encestó un triple justo antes de que sonara la bocina.", exZh: "那名控球後衛在蜂鳴器響起前投進了一記三分球。" },
    { es: "despejar", pos: "v.", zh: "(球)解圍,清出;(天空)放晴;(頭腦)清醒", note: "用途廣泛的多義詞:足球等運動指「解圍」,天氣指「放晴」,也可指讓頭腦「清醒」。", ex: "El defensa despejó el balón justo a tiempo para evitar el gol.", exZh: "那名後衛及時解圍,避免了一顆失球。" },
    { es: "noquear", pos: "v.", zh: "(拳擊)擊倒,KO", ex: "El campeón noqueó a su rival en el tercer asalto con un gancho de derecha.", exZh: "冠軍在第三回合用一記右鉤拳將對手擊倒。" },
    { es: "eliminar", en: "eliminate", pos: "v.", zh: "淘汰;消除;刪除", ex: "El equipo fue eliminado del torneo tras perder en la tanda de penaltis.", exZh: "該隊在點球大戰落敗後遭到淘汰出局。" },
    { es: "clasificación", en: "classification", gender: "f", plural: "clasificaciones", pos: "n.", zh: "排名榜;分類;晉級資格", ex: "Con esta victoria, el club sube tres puestos en la clasificación general.", exZh: "憑藉這場勝利,該俱樂部在總排名中上升了三個名次。" },
    { es: "copa", gender: "f", plural: "copas", pos: "n.", zh: "獎盃;(高腳)杯;盃賽", ex: "La selección levantó la copa por primera vez en su historia tras ganar la final.", exZh: "該國代表隊在贏得決賽後,史上首次舉起了獎盃。" },
    { es: "concursante", gender: "m", plural: "concursantes", pos: "n.", zh: "參賽者,選手", note: "陰陽性同形的通性名詞,依所指對象決定用 el concursante 或 la concursante。", ex: "Solo quedan tres concursantes en la final del programa de talentos.", exZh: "這個選秀節目的決賽只剩下三位參賽者了。" },
    { es: "marcador", gender: "m", plural: "marcadores", pos: "n.", zh: "記分板;比分", note: "在部分地區(如墨西哥)也可指「麥克筆、記號筆」。", ex: "El marcador seguía en cero cuando terminó el primer tiempo.", exZh: "上半場結束時,記分板上仍是零比零。" },
    { es: "vuelta", gender: "f", plural: "vueltas", pos: "n.", zh: "(賽跑、賽道)圈;回合;散步;找零", note: "常見多義詞:dar una vuelta(散步)、la vuelta(找零的錢)、una vuelta al circuito(繞賽道一圈)。", ex: "El ciclista lideró la carrera durante las últimas cinco vueltas.", exZh: "那名自行車手在最後五圈一直保持領先。" },
    { es: "round", en: "round", gender: "m", plural: "rounds", pos: "n.", zh: "(拳擊等格鬥運動的)回合", note: "直接借自英文,常見於拳擊、綜合格鬥等運動;正式書面語也可用 asalto。", ex: "El boxeador cayó a la lona en el séptimo round.", exZh: "那名拳擊手在第七回合倒地。" },
    { es: "entretiempo", gender: "m", plural: "entretiempos", pos: "n.", zh: "(球賽)中場休息", ex: "Aprovechamos el entretiempo para comprar algo de comer.", exZh: "我們趁著中場休息去買了點東西吃。" },
    { es: "alineación", gender: "f", plural: "alineaciones", pos: "n.", zh: "(球隊)先發陣容;排列", ex: "El entrenador sorprendió a todos con la alineación titular para el partido decisivo.", exZh: "教練在這場決定性比賽中排出的先發陣容讓所有人都感到意外。" },
    { es: "campeonato", gender: "m", plural: "campeonatos", pos: "n.", zh: "錦標賽,冠軍賽", ex: "El club lleva invicto desde que comenzó el campeonato hace dos meses.", exZh: "自兩個月前錦標賽開打以來,該俱樂部一直保持不敗。" },
    { es: "aparato", en: "apparatus", gender: "m", plural: "aparatos", pos: "n.", zh: "器材;裝置;器械", ex: "Antes de competir, los gimnastas revisan cada aparato con mucho cuidado.", exZh: "比賽前,體操選手會非常仔細地檢查每一項器材。" },

    { es: "vuelo directo", gender: "m", plural: "vuelos directos", pos: "n.", zh: "直飛航班", ex: "No encontramos vuelo directo a esa ciudad, así que tendremos que hacer escala en Fráncfort.", exZh: "我們找不到直飛那座城市的航班,所以得在法蘭克福轉機。" },
