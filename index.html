// ===========================================================================
// Utilities
// ===========================================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function chunkStages(words) {
  const stages = [];
  for (let i = 0; i < words.length; i += STAGE_SIZE) {
    stages.push({ index: stages.length, words: words.slice(i, i + STAGE_SIZE) });
  }
  return stages;
}

function chunkChapters(stages) {
  const chapters = [];
  for (let i = 0; i < stages.length; i += CHAPTERS_STAGE_COUNT) {
    const stageSlice = stages.slice(i, i + CHAPTERS_STAGE_COUNT);
    const firstWordNum = i * STAGE_SIZE + 1;
    const lastWordNum = i * STAGE_SIZE + stageSlice.reduce((n, s) => n + s.words.length, 0);
    chapters.push({ index: chapters.length, stages: stageSlice, range: `${firstWordNum}-${lastWordNum}` });
  }
  return chapters;
}

function normalizeEs(str) {
  return str
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

// Some entries store alternate forms in one field, e.g. "tío / tía" or
// "cabrón/a". Accept a match against the full string OR any "/"-separated
// piece, so users aren't forced to type the exact combined notation.
// Accents are already stripped by normalizeEs, so plain English-keyboard
// typing (e.g. "nino" for "niño") is accepted automatically.
function checkSpellingAnswer(input, target) {
  const normInput = normalizeEs(input);
  if (!target.includes("/")) {
    return normInput === normalizeEs(target);
  }
  const variants = target.split("/").map((piece) => normalizeEs(piece));
  const noSlash = normalizeEs(target.replace(/\//g, ""));
  return variants.includes(normInput) || normInput === normalizeEs(target) || normInput === noSlash;
}

function masteryTier(bestAccuracy) {
  if (bestAccuracy == null) return { label: "尚未挑戰", stars: 0, color: "#5C6B7A" };
  if (bestAccuracy >= 100) return { label: "精通", stars: 3, color: "#D4A24C" };
  if (bestAccuracy >= 80) return { label: "熟練", stars: 3, color: "#5B8C5A" };
  if (bestAccuracy >= 50) return { label: "略熟", stars: 2, color: "#B98A2E" };
  return { label: "尚未熟悉", stars: 1, color: "#A13A2F" };
}

function buildQuestions(words, attemptNumber, fullPool) {
  const pool = shuffle(words);
  const spellingCount = attemptNumber >= 3 ? Math.round(words.length * 0.4) : 0;
  // If this stage is too small to supply 3 wrong-answer options on its own
  // (e.g. a final stage left with only 1-2 words), pull distractors from the
  // whole level/theme word bank instead so the quiz always has real choices.
  const distractorSource = fullPool && fullPool.length > words.length ? fullPool : words;
  return pool.map((w, i) => {
    if (i < spellingCount) {
      return { type: "spelling", word: w, key: `${w.es}-${i}` };
    }
    const typePool = ["zh2es", "es2zh", "audio2zh"];
    const type = typePool[Math.floor(Math.random() * typePool.length)];
    const distractorPool = distractorSource.filter((x) => x.es !== w.es);
    const distractors = shuffle(distractorPool).slice(0, 3);
    const options = shuffle([w, ...distractors]);
    return { type, word: w, options, key: `${w.es}-${i}` };
  });
}

                  </div>
                </React.Fragment>
              ) : (
                <div style={{ fontSize: "0.8rem", color: "#8A7A5E" }}>補充說明</div>
              )}
              {pluralPopup.note && (
                <div style={{ fontSize: "0.72rem", color: "#B98A2E", marginTop: "0.4rem" }}>※ {pluralPopup.note}</div>
              )}
              <button
                onClick={() => setPluralPopup(null)}
                style={{
                  marginTop: "1rem",
                  width: "100%",
                  padding: "0.55rem",
                  borderRadius: "0.6rem",
                  border: "none",
                  background: "#22303F",
                  color: "#F5EFE0",
                  fontWeight: 600,
                  cursor: "pointer",
                }}
              >
                關閉
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ---------------------------------------------------------------------
  // Screen: QUIZ
  // ---------------------------------------------------------------------
  if (screen === "quiz" && quizState) {
    const q = quizState.questions[quizState.qIndex];
    const progressPct = Math.round((quizState.qIndex / quizState.questions.length) * 100);

    let promptNode = null;
    let optionsNode = null;

    if (q.type === "zh2es") {
      promptNode = (
        <div style={{ fontSize: "1.5rem", fontWeight: 600, color: "#22303F" }}>{q.word.zh}</div>
      );
      optionsNode = q.options.map((opt, i) => {
        const isCorrect = opt.es === q.word.es;
        const isSelected = quizState.selectedIndex === i;
        const showState = quizState.showFeedback && (isSelected || isCorrect);
        return (
          <OptionButton key={i} onClick={() => chooseOption(i)} showState={showState} isCorrect={isCorrect} isSelected={isSelected}>
            {opt.es}
          </OptionButton>
        );
      });
    } else if (q.type === "es2zh") {
      promptNode = (
        <div>
          <div style={{ fontFamily: "'Fraunces', serif", fontStyle: "italic", fontWeight: 500, fontSize: "1.7rem", color: "#22303F" }}>
            {q.word.es}
          </div>
          <div style={{ fontSize: "0.8rem", color: "#8A7A5E", marginTop: "0.2rem" }}>
            {q.word.pos}
            <GenderBadge word={q.word} />
          </div>
        </div>
      );
      optionsNode = q.options.map((opt, i) => {
        const isCorrect = opt.es === q.word.es;
        const isSelected = quizState.selectedIndex === i;
        const showState = quizState.showFeedback && (isSelected || isCorrect);
        return (
          <OptionButton key={i} onClick={() => chooseOption(i)} showState={showState} isCorrect={isCorrect} isSelected={isSelected}>
            {opt.zh}
          </OptionButton>
        );
      });
    } else if (q.type === "audio2zh") {
      promptNode = (
        <button
          onClick={() => speak(q.word.es)}
          style={{
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: "0.5rem",
            background: "#E9DFC4",
            border: "none",
            borderRadius: "9999px",
            width: "5rem",
            height: "5rem",
            justifyContent: "center",
            margin: "0 auto",
            cursor: "pointer",
            color: "#8A7A5E",
          }}
        >
          <Volume2 size={26} />
        </button>
      );
      optionsNode = q.options.map((opt, i) => {
        const isCorrect = opt.es === q.word.es;
        const isSelected = quizState.selectedIndex === i;
        const showState = quizState.showFeedback && (isSelected || isCorrect);
        return (
          <OptionButton key={i} onClick={() => chooseOption(i)} showState={showState} isCorrect={isCorrect} isSelected={isSelected}>
            {opt.zh}
          </OptionButton>
        );
      });
    } else if (q.type === "spelling") {
      promptNode = (
        <div>
          <div style={{ fontSize: "1.3rem", fontWeight: 600, color: "#22303F" }}>{q.word.zh}</div>
          <div style={{ fontSize: "0.75rem", color: "#8A7A5E", marginTop: "0.2rem" }}>拼出西班牙文</div>
        </div>
      );
      const isCorrect = quizState.showFeedback && checkSpellingAnswer(quizState.inputValue, q.word.es);
      optionsNode = (
        <div>
          <input
            ref={spellingInputRef}
            type="text"
            value={quizState.inputValue}
            disabled={quizState.showFeedback}
            onChange={(e) => setQuizState((prev) => ({ ...prev, inputValue: e.target.value }))}
            placeholder="輸入西班牙文…(英文鍵盤打法也可以)"
            style={{
              width: "100%",
              padding: "0.8rem 1rem",
              borderRadius: "0.7rem",
              border: `1.5px solid ${quizState.showFeedback ? (isCorrect ? "#4A6B49" : "#7A3A30") : "#3A4A5C"}`,
              background: "#25384A",
              color: "#F5EFE0",
              fontSize: "1rem",
              outline: "none",
              boxSizing: "border-box",
            }}
          />
          {!quizState.showFeedback && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: "0.35rem", marginTop: "0.6rem" }}>
              {SPECIAL_CHARS.map((char) => (
                <button
                  key={char}
                  type="button"
                  onClick={() => insertSpecialChar(char)}
                  style={{
                    width: "2.1rem",
                    height: "2.1rem",
                    borderRadius: "0.5rem",
                    border: "1px solid #3A4A5C",
                    background: "#1C2B3A",
                    color: "#E8DFC8",
                    fontFamily: "'Fraunces', serif",
                    fontSize: "1rem",
                    cursor: "pointer",
                  }}
                >
                  {char}
                </button>
              ))}
            </div>
          )}
          {quizState.showFeedback && !isCorrect && (
            <div style={{ marginTop: "0.5rem", fontSize: "0.85rem", color: "#E3B9AE" }}>
              正確答案:<strong>{q.word.es}</strong>
            </div>
          )}
          {!quizState.showFeedback && (
            <button
              onClick={submitSpelling}
              style={{
                marginTop: "0.8rem",
                width: "100%",
                padding: "0.75rem",
                borderRadius: "0.7rem",
                border: "none",
                background: "#F5EFE0",
                color: "#22303F",
                fontWeight: 700,
                cursor: "pointer",
              }}
            >
              送出答案
            </button>
          )}
        </div>
      );
    }

    return (
      <div style={{ minHeight: "100vh", background: "#1C2B3A", fontFamily: "'Inter', sans-serif" }}>
        <TopBar title={`${info.label} · 測驗`} onBack={backToMap} />
        <div style={{ padding: "0 1.25rem" }}>
          <div style={{ height: "0.4rem", background: "#25384A", borderRadius: "9999px", overflow: "hidden" }}>
            <div
              style={{
                height: "100%",
                width: `${progressPct}%`,
                background: info.color,
                transition: "width 0.3s ease",
              }}
            />
          </div>
          <div style={{ fontSize: "0.72rem", color: "#5C6B7A", marginTop: "0.4rem" }}>
            第 {quizState.qIndex + 1} / {quizState.questions.length} 題 · 第 {quizState.attemptNumber} 次挑戰
            {quizState.attemptNumber >= 3 ? "(含拼寫題)" : ""}
          </div>
        </div>

        <div style={{ padding: "1.5rem 1.25rem" }}>
          <div
            style={{
              background: "#F5EFE0",
              borderRadius: "1.1rem",
              padding: "2rem 1.4rem",
              minHeight: "9rem",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              textAlign: "center",
              marginBottom: "1.2rem",
            }}
          >
            {promptNode}
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: "0.6rem" }}>{optionsNode}</div>

          {quizState.showFeedback && (
            <button
              onClick={nextQuestion}
              style={{
                marginTop: "1rem",
                width: "100%",
                padding: "0.8rem",
                borderRadius: "0.75rem",
                border: "none",
                background: quizState._wasCorrect ? "#4A6B49" : "#7A3A30",
                color: "#F5EFE0",
                fontWeight: 700,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: "0.4rem",
              }}
            >
              {quizState._wasCorrect ? <Check size={16} /> : <X size={16} />}
              {quizState._wasCorrect ? "答對了!" : "答錯了"} · 下一題 →
            </button>
          )}
        </div>
      </div>
    );
  }

  // ---------------------------------------------------------------------
  // Screen: RESULT
  // ---------------------------------------------------------------------
  if (screen === "result" && resultData) {
    const tier = masteryTier(resultData.accuracy);
    return (
      <div
        style={{
          minHeight: "100vh",
          background: "#1C2B3A",
          fontFamily: "'Inter', sans-serif",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          padding: "2rem",
        }}
      >
        <div
          style={{
            background: "#F5EFE0",
            borderRadius: "1.2rem",
            padding: "2.2rem 1.6rem",
            width: "100%",
            maxWidth: "22rem",
            textAlign: "center",
          }}
        >
          <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "1.3rem", color: "#22303F" }}>
            本關結算
          </div>
          <div style={{ marginTop: "1rem", display: "flex", justifyContent: "center", gap: "0.2rem" }}>
            {[0, 1, 2].map((i) => (
              <Star key={i} size={26} fill={i < tier.stars ? tier.color : "none"} stroke={i < tier.stars ? tier.color : "#D8CBA8"} />
            ))}
          </div>
          <div style={{ fontSize: "0.9rem", color: tier.color, fontWeight: 700, marginTop: "0.4rem" }}>{tier.label}</div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "0.6rem", marginTop: "1.4rem" }}>
            {[
              { label: "答對", value: `${resultData.correct}/${resultData.total}` },
              { label: "正確率", value: `${resultData.accuracy}%` },
              { label: "第幾次挑戰", value: resultData.attemptNumber },
            ].map((s) => (
              <div key={s.label} style={{ background: "#EFE6D0", borderRadius: "0.7rem", padding: "0.7rem 0.4rem" }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: "1.05rem", color: "#22303F" }}>
                  {s.value}
                </div>
                <div style={{ fontSize: "0.62rem", color: "#8A7A5E", marginTop: "0.1rem" }}>{s.label}</div>
              </div>
            ))}
          </div>

          <button
            onClick={replayStage}
            style={{
              marginTop: "1.6rem",
              width: "100%",
              padding: "0.8rem",
              borderRadius: "0.75rem",
              border: "none",
              background: "#22303F",
              color: "#F5EFE0",
              fontWeight: 700,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "0.4rem",
            }}
          >
            <RotateCcw size={15} /> 再玩一次
          </button>
          <button
            onClick={backToMap}
            style={{
              marginTop: "0.6rem",
              width: "100%",
              padding: "0.8rem",
              borderRadius: "0.75rem",
              border: "1px solid #D8CBA8",
              background: "transparent",
              color: "#8A7A5E",
              fontWeight: 600,
              cursor: "pointer",
            }}
          >
            返回關卡地圖
          </button>
        </div>
      </div>
    );
  }

  return null;
}

function OptionButton({ children, onClick, showState, isCorrect, isSelected }) {
  let bg = "#25384A";
  let border = "#3A4A5C";
  let color = "#F5EFE0";
  if (showState) {
    if (isCorrect) {
      bg = "#3E5A3D";
      border = "#4A6B49";
    } else if (isSelected) {
      bg = "#5A3730";
      border = "#7A3A30";
    }
  }
  return (
    <button
      onClick={onClick}
      style={{
        textAlign: "left",
        padding: "0.85rem 1rem",
        borderRadius: "0.75rem",
        border: `1.5px solid ${border}`,
        background: bg,
        color,
        fontSize: "0.95rem",
        fontWeight: 500,
        cursor: "pointer",
      }}
    >
      {children}
    </button>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(SpanishVocab));

</script>
</body>
</html>
